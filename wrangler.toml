name = "nyxialabo"
main = "js/tts-bridge.js"
compatibility_date = "2026-09-15"

# Le même Worker compile Azgaar avant chaque déploiement.
[build]
command = "node scripts/build-azgaar.mjs"

# Même site, même domaine, même Worker.
[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = ["/api/*", "/cartographie/azgaar/*"]

[[kv_namespaces]]
binding = "HUB_CONFIG"
id = "75b93baac0974f8cb8d1f2089eceb4e6"

# NyXia Cartographie dans CE MÊME Worker.
[browser]
binding = "BROWSER"

[[r2_buckets]]
binding = "MAPS"
bucket_name = "nyxia-cartographie"

# Secrets Cloudflare : ne jamais inscrire leur valeur dans ce fichier.
# js/tts-bridge.js accepte aussi le nom historique GoogleText-to-Speech_
# UNIQUEMENT s'il contient un JSON de compte de service (client_email/private_key).
# Un ID client OAuth (*.apps.googleusercontent.com) n'est PAS suffisant.
