<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game — Partie</title><link rel="icon" href="/FavIcon.png"><style>
:root{--bg:#060a18;--card:#101831;--p:#7B5CFF;--lav:#a78bfa;--gold:#e8b867;--txt:#f8f6ff;--mut:#9da6c5;--line:rgba(167,139,250,.18);--ok:#35d69a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,rgba(123,92,255,.14),transparent 30%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:rgba(6,10,24,.94);position:sticky;top:0;z-index:4}.brand{font:700 20px Georgia}.brand span{color:var(--lav)}.wrap{max-width:1050px;margin:auto;padding:18px}.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.94),rgba(7,12,27,.96));border-radius:18px;padding:16px;margin-bottom:14px}.hero{min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;background-size:cover;background-position:center;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,7,16,.15),rgba(4,7,16,.92))}.hero>*{position:relative}.hero h1{font-size:29px;margin:0 0 5px}.mut{color:var(--mut)}.objective{border-left:3px solid var(--gold);padding:12px;background:rgba(232,184,103,.06);border-radius:10px;line-height:1.5}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:14px}.clue{padding:10px;border:1px solid rgba(232,184,103,.2);background:rgba(232,184,103,.05);border-radius:10px;margin-bottom:7px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:#121b37;color:#fff;padding:10px 13px;border-radius:10px;font-weight:700;cursor:pointer}button.primary{background:linear-gradient(135deg,var(--p),#5d49d9);border:0}input,textarea,select{width:100%;border:1px solid var(--line);background:#080f22;color:#fff;border-radius:10px;padding:11px}.join{max-width:480px;margin:9vh auto}.dice{font-size:30px;color:var(--gold);font-weight:900;margin:8px 0}.npcReply{white-space:pre-wrap;line-height:1.55;padding:12px;border-left:3px solid var(--p);background:rgba(123,92,255,.07);border-radius:10px}.status{padding:6px 9px;border-radius:999px;border:1px solid var(--line);font-size:11px;color:var(--mut)}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:24px}}</style></head><body>
<div class="top"><div class="brand">NyXia <span>Game</span></div><div id="status" class="status">Connexion…</div></div><main class="wrap"><div id="app"></div></main>
<script>
const q=new URLSearchParams(location.search);let code=(q.get('code')||'').toUpperCase(),token=sessionStorage.getItem('nyxgame_player_'+code)||'',state=null;function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-NyXia-Player-Token':token,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j}function joinForm(msg=''){app.innerHTML=`<div class="join card"><div class="mut">Rejoins une partie NyXia Game</div><h1>${esc(code||'Code requis')}</h1>${msg?`<p style="color:#ff9bac">${esc(msg)}</p>`:''}<input id="name" placeholder="Ton prénom / pseudo"><div style="height:10px"></div><button class="primary" onclick="join()">Entrer dans la partie</button></div>`}async function join(){try{let r=await api('/api/game/live/join',{method:'POST',body:JSON.stringify({code,name:name.value,playerToken:token})});token=r.playerToken;sessionStorage.setItem('nyxgame_player_'+code,token);state=r.state;render()}catch(e){joinForm(e.message)}}async function load(){if(!token){joinForm();return}try{let r=await api('/api/game/live/state?code='+encodeURIComponent(code));state=r.state;render()}catch(e){token='';sessionStorage.removeItem('nyxgame_player_'+code);joinForm(e.message)}}function render(){let r=state.runtime||{},all=[...(r.sharedClues||[]),...(r.teamClues||[])];status.textContent=(state.status||'lobby')+' · '+(state.player?.team||'');let bg=r.imageUrl?`background-image:url('${String(r.imageUrl).replace(/'/g,"%27")}')`:'';app.innerHTML=`<section class="card hero" style="${bg}"><div class="mut">${esc(state.gameType||'')} · ${esc(state.audience||'')}</div><h1>${esc(state.title)}</h1><div>${esc(r.sceneTitle||r.phase||'En attente de l’animateur')}</div></section>${r.announcement?`<section class="card"><b>📣 Annonce</b><p>${esc(r.announcement)}</p></section>`:''}<div class="grid"><div><section class="card"><h2>🎯 Objectif actuel</h2><div class="objective">${esc(r.objective||'L’animateur prépare la prochaine étape…')}</div>${r.narrative?`<p style="line-height:1.65">${esc(r.narrative)}</p>`:''}${r.videoUrl?`<video controls style="width:100%;border-radius:12px" src="${esc(r.videoUrl)}"></video>`:''}${r.audioUrl?`<audio controls style="width:100%" src="${esc(r.audioUrl)}"></audio>`:''}</section><section class="card"><h2>🔎 Tes indices</h2>${all.length?all.map(x=>`<div class="clue">${esc(x)}</div>`).join(''):'<div class="mut">Aucun indice reçu pour l’instant.</div>'}</section></div><div><section class="card"><h2>🎲 Dés</h2>${r.allowDice!==false?`<div class="actions"><button onclick="roll(6)">D6</button><button onclick="roll(10)">D10</button><button onclick="roll(20)">D20</button></div><div id="dice" class="dice">—</div><div class="mut">Tu peux aussi utiliser un vrai dé.</div><div class="actions"><button onclick="physical()">Entrer un résultat physique</button></div>`:'<div class="mut">Dés désactivés pour cette scène.</div>'}</section><section class="card"><h2>🧙 PNJ</h2>${r.allowNpc!==false&&r.activeNpc?`<b>${esc(r.activeNpc)}</b><textarea id="npcmsg" rows="3" placeholder="Pose ta question…"></textarea><div class="actions"><button class="primary" onclick="askNpc()">Parler</button></div><div id="npcreply"></div>`:'<div class="mut">Aucun PNJ disponible maintenant.</div>'}</section><section class="card"><h2>💬 Décision / message</h2><textarea id="decision" rows="3" placeholder="Votre décision d’équipe ou ton action…"></textarea><div class="actions"><button onclick="sendDecision()">Envoyer</button>${r.zoomUrl?`<button onclick="window.open('${esc(r.zoomUrl)}','_blank')">🎥 Zoom</button>`:''}</div></section></div></div>`}async function roll(sides){let r=await api('/api/game/live/action',{method:'POST',body:JSON.stringify({code,playerToken:token,type:'roll',mode:'digital',sides})});dice.textContent='D'+sides+' → '+r.action.result}async function physical(){let sides=Number(prompt('Nombre de faces ?','20')||20),result=Number(prompt('Résultat obtenu ?','')||0);if(!result)return;let r=await api('/api/game/live/action',{method:'POST',body:JSON.stringify({code,playerToken:token,type:'roll',mode:'physical',sides,result})});dice.textContent='D'+sides+' → '+r.action.result}async function sendDecision(){if(!decision.value.trim())return;await api('/api/game/live/action',{method:'POST',body:JSON.stringify({code,playerToken:token,type:'decision',text:decision.value})});decision.value=''}async function askNpc(){if(!npcmsg.value.trim())return;npcreply.innerHTML='<div class="mut">Le personnage réfléchit…</div>';try{let r=await api('/api/game/live/npc-chat',{method:'POST',body:JSON.stringify({code,playerToken:token,message:npcmsg.value})});npcreply.innerHTML='<div class="npcReply">'+esc(r.reply)+'</div>';npcmsg.value=''}catch(e){npcreply.innerHTML='<div class="mut">'+esc(e.message)+'</div>'}}load();setInterval(()=>{if(token)load()},6000)
</script></body></html>
