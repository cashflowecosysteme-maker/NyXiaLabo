<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>NyXia Labo · Accès depuis Univers</title>
<style>body{min-height:100vh;margin:0;display:grid;place-items:center;background:#060a18;color:#efe9ff;font:16px system-ui,sans-serif;text-align:center}main{max-width:460px;padding:26px;border:1px solid #7b5cff66;border-radius:20px;background:#101831}a{color:#c1a7ff}p{line-height:1.6}</style>
</head><body><main><h1>🧪 Labo NyXia</h1><p id="status" role="status">Vérification de ta session Super Admin Univers…</p><p><a href="https://univers.nyxia.top/" target="_top">Retourner à Univers</a></p></main>
<script>
(async function(){
  const status=document.getElementById('status');
  try {
    const old=sessionStorage.getItem('sandbox_token')||'';
    const res=await fetch('/api/check-auth',{method:'POST',credentials:'same-origin',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({token:old})});
    const data=await res.json();
    if(res.ok && data.valid && data.token){
      sessionStorage.setItem('sandbox_token',data.token);
      location.replace('/dashboard.html');
      return;
    }
    sessionStorage.removeItem('sandbox_token');
    status.textContent='Connecte-toi d’abord à Univers. Le Labo ne possède plus de connexion séparée.';
  } catch(_){status.textContent='Impossible de vérifier la session Univers. Aucun accès indépendant n’est proposé.';}
})();
</script></body></html>
