<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NyXia Game — Ma bibliothèque</title>
<link rel="icon" href="/FavIcon.png">
<style>
:root{--bg:#060a18;--card:#101831;--card2:#0a1125;--p:#7B5CFF;--lav:#a78bfa;--gold:#e8b867;--txt:#f7f4ff;--mut:#9ca6c8;--line:rgba(167,139,250,.18);--ok:#35d69a;--bad:#ff627c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% 4%,rgba(123,92,255,.18),transparent 35%),radial-gradient(circle at 88% 18%,rgba(232,184,103,.08),transparent 28%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.top{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;background:rgba(6,10,24,.94);backdrop-filter:blur(18px);z-index:5}.brand{font:700 23px Georgia}.brand span{color:var(--lav)}.tag{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:12px}
.wrap{max-width:1280px;margin:auto;padding:28px 20px 60px}.welcome{display:flex;justify-content:space-between;align-items:end;gap:18px;margin-bottom:22px}.welcome h1{font-size:34px;margin:0 0 6px;font-family:Georgia}.mut{color:var(--mut)}.btn{border:1px solid var(--line);background:#111b38;color:#fff;padding:10px 14px;border-radius:11px;cursor:pointer;font-weight:750}.btn.primary{background:linear-gradient(135deg,var(--p),#5d49d9);border:0}.btn.gold{background:linear-gradient(135deg,#b67b27,#e8b867);color:#171006;border:0}.btn.ghost{background:transparent}.login{max-width:560px;margin:8vh auto;border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.96),rgba(7,12,27,.98));border-radius:24px;padding:28px;box-shadow:0 24px 90px rgba(0,0,0,.35)}.login h1{font:700 30px Georgia;margin:0 0 8px}.login .logo{font-size:42px;margin-bottom:12px}input,select{width:100%;border:1px solid var(--line);background:#080f22;color:#fff;border-radius:11px;padding:12px;outline:none}.field{margin:14px 0}.field label{display:block;font-size:11px;color:var(--mut);font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:7px}
.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:28px 0 12px}.sectionTitle h2{margin:0;font-size:18px}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}.game{min-height:360px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.94),rgba(7,12,27,.98));border-radius:18px;overflow:hidden;display:flex;flex-direction:column}.cover{height:180px;background:linear-gradient(135deg,rgba(123,92,255,.34),rgba(232,184,103,.10)),#0c1430;background-size:cover;background-position:center;position:relative}.cover:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 25%,rgba(6,10,24,.88))}.badge{position:absolute;left:12px;top:12px;z-index:2;padding:6px 9px;border:1px solid rgba(255,255,255,.18);background:rgba(6,10,24,.72);backdrop-filter:blur(12px);border-radius:999px;font-size:11px}.gamebody{padding:15px;display:flex;flex:1;flex-direction:column}.game h3{font:700 21px Georgia;margin:0 0 5px}.meta{font-size:12px;color:var(--mut);margin-bottom:11px}.desc{color:#d8dcf0;line-height:1.5;flex:1}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sessions{display:grid;gap:10px}.session{border:1px solid var(--line);background:rgba(12,19,42,.78);border-radius:14px;padding:13px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}.code{font:800 16px ui-monospace,monospace;letter-spacing:2px;color:var(--gold)}.status{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut)}.dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}.empty{padding:22px;border:1px dashed var(--line);border-radius:14px;color:var(--mut);text-align:center}.err{padding:11px 13px;border:1px solid rgba(255,98,124,.35);background:rgba(255,98,124,.07);border-radius:11px;color:#ffb0bd;margin-top:12px}.notice{padding:11px 13px;border:1px solid rgba(53,214,154,.25);background:rgba(53,214,154,.06);border-radius:11px;color:#baf5dd;margin-top:12px}
@media(max-width:700px){.welcome{align-items:start;flex-direction:column}.welcome h1{font-size:28px}.session{grid-template-columns:1fr}.top{padding:0 14px}.tag{display:none}}

@keyframes nyxshoot{0%{transform:translate(-25vw,-10vh) rotate(-18deg);opacity:0}8%{opacity:.95}18%{transform:translate(110vw,35vh) rotate(-18deg);opacity:0}100%{opacity:0}}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:
radial-gradient(2px 2px at 8% 14%,rgba(255,255,255,.75),transparent 60%),
radial-gradient(1.6px 1.6px at 18% 72%,rgba(255,255,255,.65),transparent 60%),
radial-gradient(2px 2px at 26% 28%,rgba(167,139,250,.95),transparent 60%),
radial-gradient(1.8px 1.8px at 34% 82%,rgba(255,255,255,.65),transparent 60%),
radial-gradient(2px 2px at 46% 18%,rgba(232,184,103,.85),transparent 60%),
radial-gradient(1.4px 1.4px at 58% 64%,rgba(255,255,255,.7),transparent 60%),
radial-gradient(2px 2px at 68% 26%,rgba(167,139,250,.9),transparent 60%),
radial-gradient(1.8px 1.8px at 77% 78%,rgba(255,255,255,.68),transparent 60%),
radial-gradient(2px 2px at 88% 34%,rgba(232,184,103,.82),transparent 60%),
radial-gradient(1.6px 1.6px at 94% 66%,rgba(255,255,255,.72),transparent 60%);
opacity:.95}
body::after{content:"";position:fixed;left:-20vw;top:8vh;width:34vw;height:2px;pointer-events:none;z-index:-1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.96),rgba(167,139,250,.75),transparent);filter:drop-shadow(0 0 7px rgba(255,255,255,.7));transform:rotate(-18deg);animation:nyxshoot 11s linear infinite}
.top:before{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.45),rgba(232,184,103,.35),transparent)}
.brandwrap{display:flex;align-items:center;gap:12px}
.brandimg{width:42px;height:42px;border-radius:14px;object-fit:cover;border:1px solid rgba(167,139,250,.28);box-shadow:0 0 0 1px rgba(255,255,255,.05) inset,0 10px 26px rgba(123,92,255,.22);background:rgba(10,16,35,.85)}
.brand{display:flex;align-items:center;gap:10px}
.hero,.welcome h1,.login h1,.game h3,.steptitle,h1,h2{letter-spacing:.2px}

</style>
</head>
<body>
<header class="top"><div class="brandwrap"><img class="brandimg" src="/nyxia-avatar-top-left.png" alt="NyXia" onerror="this.style.display=\'none\'"><div class="brand">NyXia <span>Game</span></div></div><div class="tag">Ma bibliothèque · Mes soirées</div></header>
<main class="wrap"><div id="app"></div></main>
<script>
let libraryToken=localStorage.getItem('nyxia_game_library_token')||'',data=null;const _q=new URLSearchParams(location.search),_testToken=_q.get('test_token')||'';if(_testToken){libraryToken=_testToken;localStorage.setItem('nyxia_game_library_token',libraryToken);_q.delete('test_token');history.replaceState({},'',location.pathname+(_q.toString()?'?'+_q.toString():''))}
const app=document.getElementById('app');
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{'Content-Type':'application/json','X-NyXia-Library-Token':libraryToken,...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j}
function login(msg=''){app.innerHTML=`<section class="login"><div class="logo">🎮</div><h1>Bienvenue dans NyXia Game</h1><p class="mut">Entre dans une bibliothèque immersive pensée dans l’univers NyXia : sombre, magique, cinématographique et prête pour tes soirées.</p><div class="notice">✨ Ta clé d’accès est fournie avec ton achat. Ton expérience reste indépendante du Labo et s’ouvre ici comme un vrai portail client.</div><div class="field"><label>Adresse courriel liée à l’achat (si demandée)</label><input id="email" type="email" placeholder="toi@exemple.com"></div><div class="field"><label>Clé d’accès</label><input id="access" autocomplete="off" placeholder="NYX-XXXX-XXXX-XXXX-XXXX-XXXX"></div><button class="btn primary" onclick="redeem()">🎮 Ouvrir ma bibliothèque</button>${msg?`<div class="err">${esc(msg)}</div>`:''}</section>`}
async function redeem(){try{let r=await fetch('/api/game/library/redeem',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value,accessKey:access.value})}),j=await r.json();if(!r.ok)throw new Error(j.error||'Accès refusé');libraryToken=j.libraryToken;localStorage.setItem('nyxia_game_library_token',libraryToken);data=j;render()}catch(e){login(e.message)}}
async function load(){if(!libraryToken){login();return}try{data=await api('/api/game/library/me');render()}catch(e){localStorage.removeItem('nyxia_game_library_token');libraryToken='';login(e.message)}}
function gameCard(g){let bg=g.coverUrl?`style="background-image:linear-gradient(180deg,rgba(6,10,24,.05),rgba(6,10,24,.88)),url('${String(g.coverUrl).replace(/'/g,"%27")}')"`:'';return `<article class="game"><div class="cover" ${bg}><div class="badge">${esc(g.category||g.gameType||'NyXia Game')}</div></div><div class="gamebody"><h3>${esc(g.title)}</h3><div class="meta">${esc(g.audience||'16+')} · ${esc(g.players||'?')} joueurs · ${esc(g.duration||'')}</div><div class="desc">${esc(g.description||g.subtitle||'Une expérience NyXia Game prête à vivre avec ton groupe.')}</div><div class="actions"><button class="btn primary" onclick="organize('${g.id}')">🎥 Organiser une soirée</button></div></div></article>`}
function sessionRow(s){return `<div class="session"><div><div class="status"><span class="dot"></span>${esc(s.status||'lobby')} · ${esc(s.playerCount||0)} joueur(s)</div><div style="font-weight:800;margin:4px 0">${esc(s.title)}</div><div class="code">${esc(s.code)}</div><div class="mut" style="font-size:11px">${new Date(s.updatedAt||s.createdAt).toLocaleString('fr-CA')}</div></div><div class="actions"><button class="btn gold" onclick="location.href='${esc(s.hostUrl)}'">🎛️ Reprendre</button><button class="btn" onclick="copy('${esc(s.joinUrl)}')">📋 Invitation</button></div></div>`}
function render(){let games=data.products||[],sessions=data.sessions||[],lic=data.license||{};app.innerHTML=`<section class="welcome"><div><div class="mut">Bibliothèque NyXia Game</div><h1>Mes expériences</h1><div class="mut">${esc(lic.email||lic.label||'Accès client')} ${lic.expiresAt?'· accès jusqu’au '+esc(lic.expiresAt):''}</div></div><button class="btn ghost" onclick="logout()">Changer de compte</button></section><div class="sectionTitle"><h2>🎮 Mes jeux</h2><span class="mut">${games.length} produit(s)</span></div><section class="games">${games.length?games.map(gameCard).join(''):'<div class="empty">Aucun jeu n’est encore associé à cette bibliothèque.</div>'}</section><div class="sectionTitle"><h2>🎥 Mes soirées</h2><button class="btn" onclick="load()">↻ Actualiser</button></div><section class="sessions">${sessions.length?sessions.map(sessionRow).join(''):'<div class="empty">Aucune soirée créée pour l’instant. Choisis un jeu et clique « Organiser une soirée ».</div>'}</section>`}
async function organize(productId){try{let r=await api('/api/game/library/sessions',{method:'POST',body:JSON.stringify({productId})});location.href=r.hostUrl}catch(e){alert(e.message)}}
function logout(){if(!confirm('Retirer cette bibliothèque de cet appareil ?'))return;localStorage.removeItem('nyxia_game_library_token');libraryToken='';login()}
function copy(t){navigator.clipboard?.writeText(t);alert('Lien joueur copié ✓')}
load();
</script>
</body></html>
