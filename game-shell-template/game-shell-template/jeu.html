<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game | Le jeu</title><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/jeu.css"></head><body><canvas id="starry-canvas"></canvas><main><p id="title" hidden></p><h2 id="scene-title" hidden></h2><section id="media-presentation"><div class="media-heading"><button type="button" id="fullscreen-media" disabled aria-label="Afficher les médias en plein écran">⛶ Plein écran</button></div><div id="media"></div></section><div id="slide-status" aria-label="Progression dans le jeu"><span>NyXia Game</span><small id="counter"></small></div><p id="story" hidden></p><div id="breakout"></div><div class="actions"><button id="previous" disabled>← Précédent</button><button id="next" disabled>Suivant →</button></div></main><script src="/js/starry-bg.js" defer></script><script>
'use strict';
/* NYXIA_GAME_EMBEDS_V1 — YouTube, Canva et Google Drive */
let scenes=[],slides=[],index=0,resumeIndex=0,gameId='',token=sessionStorage.getItem('nyxia_token')||'';
const $=id=>document.getElementById(id);
const resume=document.createElement('button');resume.id='resume';resume.type='button';resume.hidden=true;resume.style.display='none';resume.textContent='↪ Reprendre la partie';
$('previous').after(resume);
function validUrl(raw){try{const u=new URL(raw,location.href);return (u.protocol==='https:'&&!u.username&&!u.password)?u:null}catch(_){return null}}
function driveId(url){
 if(url.hostname!=='drive.google.com')return '';
 const m=url.pathname.match(/^\/file\/d\/([\w-]+)/);
 return m?m[1]:url.pathname==='/open'?url.searchParams.get('id')||'':url.searchParams.get('id')||'';
}
function youtubeId(url){
 const host=url.hostname.replace(/^www\./,'').toLowerCase();
 if(host==='youtu.be')return url.pathname.split('/').filter(Boolean)[0]||'';
 if(host==='youtube.com'||host==='m.youtube.com'||host==='music.youtube.com'||host==='youtube-nocookie.com'){
  if(url.pathname==='/watch')return url.searchParams.get('v')||'';
  const m=url.pathname.match(/^\/(?:embed|shorts|live)\/([A-Za-z0-9_-]{6,20})/);return m?m[1]:'';
 }
 return '';
}
function canvaEmbedUrl(url){
 const host=url.hostname.replace(/^www\./,'').toLowerCase();
 if(host!=='canva.com'||!/^\/design\//.test(url.pathname))return '';
 const u=new URL(url.href);u.hash='';
 if(!/\/view\/?$/i.test(u.pathname)){
  const parts=u.pathname.split('/').filter(Boolean);
  const designAt=parts.indexOf('design');
  if(designAt>=0&&parts[designAt+1])u.pathname='/design/'+parts[designAt+1]+'/view';
 }
 u.searchParams.set('embed','1');
 return u.href;
}
function clearMedia(){
 const media=$('media');
 media.querySelectorAll('video,audio').forEach(el=>{try{el.pause();el.removeAttribute('src');el.load()}catch(_){}})
 media.querySelectorAll('iframe').forEach(el=>{try{el.src='about:blank'}catch(_){}})
 media.replaceChildren()
}
function sceneMediaItems(s){
 const media=s.media||{};
 const items=Array.isArray(media.items)&&media.items.length?media.items:
  [['imageUrl','image'],['audioUrl','audio'],['videoUrl','video']].filter(x=>media[x[0]]).map(([key,kind],j)=>({id:'legacy-'+j,kind,url:media[key],label:''}));
 return items.filter(it=>['image','video','audio'].includes(it.kind)&&validUrl(it.url)).slice(0,48);
}
function makeSlides(list){
 return list.map((s,sceneIndex)=>({sceneIndex,scene:s,mediaItems:sceneMediaItems(s)}));
}
function mediaFrame(src,title,height,allow){
 const frame=document.createElement('iframe');frame.src=src;frame.title=title||'Média de la scène';frame.loading='lazy';frame.referrerPolicy='strict-origin-when-cross-origin';frame.allow=allow||'autoplay; fullscreen; picture-in-picture';frame.allowFullscreen=true;frame.style.cssText='display:block;width:100%;height:'+height+';border:0;border-radius:14px;margin:18px auto;background:#050812';return frame;
}
function addExternalMedia(item,scene){
 const u=validUrl(item.url);if(!u)return;
 const box=$('media'),yt=youtubeId(u),canva=canvaEmbedUrl(u),id=driveId(u);
 if(item.kind==='video'&&yt){
  box.appendChild(mediaFrame('https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt)+'?rel=0',item.label||scene.title||'Vidéo YouTube','min(56vw,560px)','autoplay; encrypted-media; picture-in-picture; fullscreen'));
  return;
 }
 if(item.kind==='video'&&canva){
  box.appendChild(mediaFrame(canva,item.label||scene.title||'Présentation Canva','min(62vw,640px)','autoplay; fullscreen'));
  return;
 }
 if(id){
  const preview='https://drive.google.com/file/d/'+encodeURIComponent(id)+'/preview';
  if(item.kind==='audio'){
   box.appendChild(mediaFrame(preview,item.label||'Audio Google Drive','96px','autoplay'));
   return;
  }
  if(item.kind==='video'){
   box.appendChild(mediaFrame(preview,item.label||scene.title||'Vidéo Google Drive','min(56vw,560px)','autoplay; fullscreen'));
   return;
  }
  if(item.kind==='image'){
   const img=document.createElement('img');img.src='https://drive.google.com/uc?export=view&id='+encodeURIComponent(id);img.alt=item.label||scene.title||'Illustration';img.loading='lazy';box.appendChild(img);return;
  }
 }
 const el=document.createElement(item.kind==='image'?'img':item.kind);el.src=u.href;
 if(item.kind==='image'){el.alt=item.label||scene.title||'Illustration';el.loading='lazy'}
 else{el.controls=true;el.preload='metadata';el.loop=item.playback==='boucle';if(item.trigger==='début')el.play().catch(()=>{})}
 box.appendChild(el);
}
function render(){
 const slide=slides[index];if(!slide)return;
 const s=slide.scene,media=s.media||{},items=slide.mediaItems||[];
 $('title').hidden=true;$('scene-title').hidden=true;
 $('counter').textContent=(index+1)+' / '+slides.length;
 const playerText=media.showText===true?String(media.displayText||'').trim():'';
 $('story').textContent=playerText;$('story').hidden=!playerText;
 clearMedia();items.forEach(item=>addExternalMedia(item,s));
 $('media-presentation').hidden=!items.length;$('fullscreen-media').disabled=!items.length;$('breakout').replaceChildren();
 if(s.breakout?.enabled){const d=document.createElement('div');d.className='breakout';d.textContent=s.breakout.instruction||'Suivez les indications du maître de jeu.';$('breakout').appendChild(d)}
 $('previous').disabled=index===0;$('next').disabled=index>=slides.length-1;
}
async function progress(action,at){
 try{const r=await fetch('/api/game/slides/progress',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,action,index:at})});if(!r.ok)return null;return await r.json()}catch(_){return null}
}
function go(to){if(to<0||to>=slides.length)return;index=to;render();progress('save',index)}
$('previous').onclick=()=>go(index-1);$('next').onclick=()=>go(index+1);
resume.onclick=()=>{resume.hidden=true;resume.style.display='none';go(resumeIndex)};
$('fullscreen-media').onclick=()=>{const target=$('media-presentation');if(document.fullscreenElement){document.exitFullscreen?.();return}if(target&&$('media').children.length)target.requestFullscreen?.().catch(()=>{})};
document.addEventListener('fullscreenchange',()=>{$('fullscreen-media').textContent=document.fullscreenElement?'⛶ Quitter le plein écran':'⛶ Plein écran'});
fetch('/api/game/slides',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})})
 .then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'Accès indisponible');return d})
 .then(async d=>{
  gameId=d.gameId||'';$('title').textContent=d.title||'Le jeu';scenes=Array.isArray(d.scenes)?d.scenes:[];slides=makeSlides(scenes);
  if(!slides.length){$('story').textContent='Cette partie n’est pas encore prête.';$('story').hidden=false;return}
  render();const saved=await progress('get');if(Number.isSafeInteger(saved?.index)&&saved.index>0&&saved.index<slides.length){resumeIndex=saved.index;resume.hidden=false;resume.style.display='';resume.textContent='↪ Reprendre à la diapositive '+(resumeIndex+1)}
 }).catch(err=>{$('story').textContent=err.message});
</script></body></html>
