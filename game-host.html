<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game — Animateur</title><link rel="icon" href="/FavIcon.png">
<style>
:root{--bg:#060a18;--card:#101831;--card2:#0b1227;--p:#7B5CFF;--lav:#a78bfa;--gold:#e8b867;--txt:#f7f4ff;--mut:#9ca6c8;--line:rgba(167,139,250,.18);--ok:#35d69a;--bad:#ff627c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(123,92,255,.15),transparent 35%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(6,10,24,.95);backdrop-filter:blur(18px);z-index:5}.brand{font:700 22px Georgia}.brand span{color:var(--lav)}.wrap{max-width:1320px;margin:auto;padding:20px}.hero,.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.94),rgba(7,12,27,.97));border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.22)}.hero{padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.hero h1{margin:3px 0 5px;font-size:27px}.mut{color:var(--mut)}.code{font:900 24px ui-monospace,monospace;letter-spacing:4px;color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:16px}.card{padding:17px;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 12px}.step{border:1px solid rgba(123,92,255,.28);background:linear-gradient(135deg,rgba(123,92,255,.10),rgba(232,184,103,.04));border-radius:18px;padding:20px}.stepnum{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:900}.steptitle{font:700 29px Georgia;margin:5px 0 7px}.instruction{font-size:17px;line-height:1.6;background:rgba(255,255,255,.035);border-left:4px solid var(--lav);padding:14px 16px;border-radius:10px;margin:15px 0}.read{white-space:pre-wrap;line-height:1.65;background:rgba(232,184,103,.06);border:1px solid rgba(232,184,103,.18);padding:13px;border-radius:11px}.mini{padding:11px;border:1px solid var(--line);border-radius:11px;background:rgba(6,10,24,.42);margin-top:9px}.mini b{display:block;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:1px solid var(--line);background:#111b38;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:800}button.primary{background:linear-gradient(135deg,var(--p),#5d49d9);border:0}button.gold{background:linear-gradient(135deg,#b67b27,#e8b867);color:#171006;border:0}button.danger{border-color:rgba(255,98,124,.35);color:#ff9bac}.players,.log,.clues{display:grid;gap:8px}.player,.logrow,.clue{padding:9px;border:1px solid var(--line);background:rgba(4,8,20,.45);border-radius:10px}.player{display:block;padding:11px}.playerhead{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}.playeravatar{width:48px;height:48px;border-radius:14px;object-fit:cover;background:#090f22;border:1px solid var(--line)}.playerchar{font-size:12px;color:#dfe3f7}.playercontrols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.playercontrols .full{grid-column:1/-1}.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.badgeitem{font-size:10px;padding:4px 7px;border-radius:999px;border:1px solid rgba(232,184,103,.25);background:rgba(232,184,103,.07);color:#ffe0a0}.repitem{font-size:10px;color:#cbd2ed;margin-right:7px}.log{max-height:300px;overflow:auto}.logrow{font-size:12px;color:#d8dcf0}.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.clue{border-left:3px solid var(--gold)}.cluehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font:900 29px ui-monospace,monospace;color:var(--gold);margin-top:8px}.progress{height:7px;background:#080f22;border-radius:99px;overflow:hidden;margin:8px 0 14px}.progress>div{height:100%;background:linear-gradient(90deg,var(--p),var(--gold))}.err{padding:18px;border:1px solid rgba(255,98,124,.3);background:rgba(255,98,124,.07);border-radius:14px;color:#ffb0bd}details.advanced{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:18px}details.advanced summary{cursor:pointer;font-weight:850}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f{margin-top:10px}.f label{display:block;font-size:11px;color:var(--mut);font-weight:800;margin-bottom:6px;text-transform:uppercase}input,textarea,select{width:100%;border:1px solid var(--line);background:#080f22;color:#fff;border-radius:10px;padding:10px;outline:none}textarea{resize:vertical}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:11px}@media(max-width:900px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}.playercontrols{grid-template-columns:1fr}.steptitle{font-size:24px}}

@keyframes nyxshoot{0%{transform:translate(-25vw,-10vh) rotate(-18deg);opacity:0}8%{opacity:.95}18%{transform:translate(110vw,35vh) rotate(-18deg);opacity:0}100%{opacity:0}}
body{overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-2;background:
radial-gradient(2px 2px at 8% 14%,rgba(255,255,255,.75),transparent 60%),
radial-gradient(1.6px 1.6px at 18% 72%,rgba(255,255,255,.65),transparent 60%),
radial-gradient(2px 2px at 26% 28%,rgba(167,139,250,.95),transparent 60%),
radial-gradient(1.8px 1.8px at 34% 82%,rgba(255,255,255,.65),transparent 60%),
radial-gradient(2px 2px at 46% 18%,rgba(232,184,103,.85),transparent 60%),
radial-gradient(1.4px 1.4px at 58% 64%,rgba(255,255,255,.7),transparent 60%),
radial-gradient(2px 2px at 68% 26%,rgba(167,139,250,.9),transparent 60%),
radial-gradient(1.8px 1.8px at 77% 78%,rgba(255,255,255,.68),transparent 60%),
radial-gradient(2px 2px at 88% 34%,rgba(232,184,103,.82),transparent 60%),
radial-gradient(1.6px 1.6px at 94% 66%,rgba(255,255,255,.72),transparent 60%);
opacity:.95}
body::after{content:"";position:fixed;left:-20vw;top:8vh;width:34vw;height:2px;pointer-events:none;z-index:-1;background:linear-gradient(90deg,transparent,rgba(255,255,255,.96),rgba(167,139,250,.75),transparent);filter:drop-shadow(0 0 7px rgba(255,255,255,.7));transform:rotate(-18deg);animation:nyxshoot 11s linear infinite}
.top:before{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:linear-gradient(90deg,transparent,rgba(167,139,250,.45),rgba(232,184,103,.35),transparent)}
.brandwrap{display:flex;align-items:center;gap:12px}
.brandimg{width:50px;height:54px;object-fit:contain;object-position:center bottom;border:0;box-shadow:none;background:transparent;filter:drop-shadow(0 8px 18px rgba(123,92,255,.28))}
.brand{display:flex;align-items:center;gap:10px}
.hero,.welcome h1,.login h1,.game h3,.steptitle,h1,h2{letter-spacing:.2px}

/* Médias réels visibles dans la console de l’animateur, dans la charte existante. */
.scene-media{border:1px solid rgba(167,139,250,.32);background:linear-gradient(135deg,rgba(123,92,255,.08),rgba(232,184,103,.045));padding:15px;border-radius:16px;margin:15px 0}
.scene-media>strong{display:block;color:#f0d29a;font-size:12px;letter-spacing:.6px;margin-bottom:11px}
.scene-media img,.scene-media video{display:block;width:100%;max-height:420px;object-fit:contain;border-radius:11px;background:rgba(6,10,24,.7)}
.scene-media audio{display:block;width:100%;margin-top:10px}
.scene-media video,.scene-media img{margin-top:10px}
.gm-die{margin:14px auto 0;width:106px;height:106px;display:grid;place-items:center;background:linear-gradient(135deg,#ebcc87,#8c5b26,#d9a25d);border:2px solid #ffedbc;border-radius:22px;clip-path:polygon(50% 0,87% 12%,100% 52%,74% 99%,26% 99%,0 52%,13% 12%);box-shadow:inset 0 0 22px rgba(17,10,0,.35);font-size:22px;font-weight:900;color:#fff;text-shadow:0 2px 4px #443017;transform-style:preserve-3d}.gm-die.spinning{animation:gmRoll .8s ease-in-out both}@keyframes gmRoll{0%{transform:rotateX(0) rotateY(0) scale(.7)}50%{transform:rotateX(330deg) rotateY(450deg) scale(1.13)}100%{transform:rotateX(720deg) rotateY(720deg)}}@media(prefers-reduced-motion:reduce){.gm-die.spinning{animation:none}}
</style></head><body>
<div class="top"><div class="brandwrap"><img class="brandimg" src="/NyXia.png" alt="NyXia" onerror="this.style.display='none'"><div class="brand">NyXia <span>Game</span> · Animateur</div></div><div style="display:flex;gap:8px;align-items:center"><button onclick="location.href='/game-library.html'">🎮 Ma bibliothèque</button><span class="pill">Soirée guidée</span></div></div><main class="wrap"><div id="app">Chargement…</div></main>
<script>
const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase(),incoming=qs.get('host')||'';if(incoming){sessionStorage.setItem('nyxgame_host_'+code,incoming);qs.delete('host');history.replaceState({},'',location.pathname+'?'+qs.toString())}let hostToken=sessionStorage.getItem('nyxgame_host_'+code)||'',state=null,joinUrl='',timerId=null,timerEnds=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function h(){return {'Content-Type':'application/json','X-NyXia-Host-Token':hostToken}}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...h(),...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j}
function sceneMediaHtml(scene){
  const m=scene?.media||{},parts=[]
  if(m.imageUrl)parts.push(`<img loading="lazy" src="${esc(m.imageUrl)}" alt="Visuel de la scène">`)
  if(m.videoUrl)parts.push(`<video controls preload="metadata" playsinline src="${esc(m.videoUrl)}">Vidéo non prise en charge par ce navigateur.</video>`)
  if(m.audioUrl)parts.push(`<audio controls preload="metadata" src="${esc(m.audioUrl)}">Audio non pris en charge par ce navigateur.</audio>`)
  return parts.length?'<div class="scene-media"><strong>✦ MÉDIAS ASSOCIÉS À CETTE SCÈNE</strong>'+parts.join('')+'</div>':''
}
function scenes(){return Array.isArray(state?.guidedScenes)&&state.guidedScenes.length?state.guidedScenes:(Array.isArray(state?.hostPackage?.guidedScenes)?state.hostPackage.guidedScenes:[])}function idx(){let a=scenes(),n=Number(state?.runtime?.guidedSceneIndex)||0;return Math.max(0,Math.min(Math.max(0,a.length-1),n))}function current(){return scenes()[idx()]||null}
async function load(){try{let r=await api('/api/game/host/'+encodeURIComponent(code));state=r.session;joinUrl=r.joinUrl;render()}catch(e){document.getElementById('app').innerHTML='<div class="err"><b>Impossible d’ouvrir cette soirée.</b><br>'+esc(e.message)+'</div>'}}
function sceneRuntime(scene,index){let r=state.runtime||{};return{guidedSceneIndex:index,guidedSceneId:scene.id||'',phase:scene.phase||'',sceneTitle:scene.title||'',objective:scene.playerObjective||'',announcement:scene.announcement||'',narrative:scene.readAloud||'',activeNpc:scene.npc?.name||'',allowNpc:!!(scene.npc?.enabled&&scene.npc?.name),allowDice:scene.dice?.enabled!==false,imageUrl:scene.media?.imageUrl||'',audioUrl:scene.media?.audioUrl||'',videoUrl:scene.media?.videoUrl||'',zoomUrl:r.zoomUrl||''}}
async function go(index,status='live'){let a=scenes();if(!a.length)return;index=Math.max(0,Math.min(a.length-1,index));let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status,runtime:sceneRuntime(a[index],index)})});state=r.session;render()}
function playerHtml(p){
  let c=p.character||null, badges=Array.isArray(p.badges)?p.badges:[], rep=p.reputation&&typeof p.reputation==='object'?p.reputation:{}
  let badgeCatalog=Array.isArray(state?.playerConfig?.badgeCatalog)?state.playerConfig.badgeCatalog:[]
  let factions=Array.isArray(state?.playerConfig?.factions)?state.playerConfig.factions:[]
  if(c?.faction && !factions.includes(c.faction)) factions=[c.faction,...factions]
  let portrait=c?.portraitDataUrl||''
  let badgeOptions=badgeCatalog.length?'<option value="">Choisir un badge…</option>'+badgeCatalog.map(b=>`<option value="${esc(b.id)}">${esc((b.icon||'🏅')+' '+b.name)}</option>`).join(''):'<option value="">Badge personnalisé…</option>'
  let factionOptions=factions.length?factions.map(f=>`<option ${c?.faction===f?'selected':''}>${esc(f)}</option>`).join(''):`<option>${esc(c?.faction||'Générale')}</option>`
  let reps=Object.entries(rep).map(([f,v])=>`<span class="repitem">⭐ ${esc(f)} : <b>${esc(v)}</b></span>`).join('')
  return `<div class="player">
    <div class="playerhead">
      ${portrait?`<img class="playeravatar" src="${esc(portrait)}" alt="">`:`<div class="playeravatar" style="display:grid;place-items:center;font-size:22px">🎭</div>`}
      <div><span class="statusdot"></span><b>${esc(p.name)}</b>${c?`<div class="playerchar"><b>${esc(c.name)}</b>${c.archetype?' · '+esc(c.archetype):''}${c.faction?' · '+esc(c.faction):''}</div>`:'<div class="mut">Personnage pas encore créé</div>'}<div class="mut">${esc(p.team||'Sans équipe')} · ${p.controller==='ai'?'🤖 Joueur IA':'👤 Joueur humain'}</div></div>
    </div>
    ${c?`<div class="badges">${badges.length?badges.map(b=>`<span class="badgeitem" title="${esc(b.description||'')}">${esc((b.icon||'🏅')+' '+b.name)}</span>`).join(''):'<span class="mut">Aucun badge</span>'}</div><div style="margin-top:5px">${reps||'<span class="mut">Réputation : aucune évolution</span>'}</div>${c.secret?`<details style="margin-top:7px"><summary class="mut" style="cursor:pointer">🔒 Secret du PJ — animateur seulement</summary><div style="margin-top:6px">${esc(c.secret)}</div></details>`:''}`:''}
    <div class="playercontrols">
      <select onchange="movePlayer('${p.id}',this.value)">${(state.teams||[]).map(t=>`<option ${p.team===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select>
      <select id="badge-${p.id}">${badgeOptions}</select>
      <button onclick="awardBadge('${p.id}')">🏅 Donner un badge</button>
      <select id="repfaction-${p.id}">${factionOptions}</select>
      <input id="repdelta-${p.id}" type="number" min="-100" max="100" value="1" title="Variation de réputation">
      <button onclick="changeReputation('${p.id}')">⭐ Modifier réputation</button><button class="danger full" onclick="removeParticipant('${p.id}',${p.controller==='ai'?'true':'false'})">${p.controller==='ai'?'🗑️ Libérer cette place IA':'🚪 Retirer ce joueur · révoquer son accès'}</button>
    </div>
  </div>`
}
function render(){let r=state.runtime||{},a=scenes(),i=idx(),s=current(),players=state.players||[],logs=(state.log||[]).slice(-45).reverse();if(!a.length){document.getElementById('app').innerHTML=`<section class="hero"><div><div class="mut">${esc(state.gameType||'NyXia Game')} · ${esc(state.audience||'16+')}</div><h1>${esc(state.title)}</h1><div class="mut">Code joueur ${esc(code)}</div></div></section><div class="err"><b>Ce jeu n’a pas encore de conducteur guidé.</b><br>Il doit être finalisé dans NyXiaLabo avant d’être vendu. L’acheteur ne devrait pas avoir à écrire les scènes ici.</div>${advancedHtml()}`;return}let pct=Math.round(((i+1)/a.length)*100);document.getElementById('app').innerHTML=`<section class="hero"><div><div class="mut">${esc(state.gameType||'NyXia Game')} · ${esc(state.audience||'16+')}</div><h1>${esc(state.title)}</h1><div class="mut">Suis les étapes. NyXia Game garde les détails techniques derrière le rideau.</div></div><div><div class="mut">CODE JOUEUR</div><div class="code">${esc(code)}</div><button onclick="copyJoin()">📋 Copier l’invitation</button></div></section><div class="grid"><div><section class="step"><div class="stepnum">Étape ${i+1} sur ${a.length} · ${esc(s.phase||'')}</div><div class="progress"><div style="width:${pct}%"></div></div><div class="steptitle">${esc(s.title||'Étape')}</div>${s.durationMinutes?`<div class="mut">Durée prévue : ~${s.durationMinutes} min</div>`:''}<div class="instruction">${esc(s.hostInstruction||'Suis les éléments de cette scène puis passe à la suivante.')}</div>${s.readAloud?`<div class="mini"><b>🔊 À lire / raconter</b><div class="read">${esc(s.readAloud)}</div></div>`:''}${s.breakout?.enabled?`<div class="mini"><b>👥 Breakout Rooms</b>${esc(s.breakout.instruction||'Répartis les joueurs dans leurs équipes.')}${s.breakout.teams?.length?`<div class="mut" style="margin-top:5px">${s.breakout.teams.map(esc).join(' · ')}</div>`:''}</div>`:''}${s.npc?.enabled&&s.npc?.name?`<div class="mini"><b>🧙 PNJ IA : ${esc(s.npc.name)}</b>${esc(s.npc.instruction||'Les joueurs peuvent maintenant interroger ce personnage.')}</div>`:''}${s.dice?.instruction?`<div class="mini"><b>🎲 Dés</b>${esc(s.dice.instruction)}</div>`:''}${s.media?.instruction?`<div class="mini"><b>🎬 Média</b>${esc(s.media.instruction)}</div>`:''}${sceneMediaHtml(s)}${s.completion?`<div class="mini"><b>✓ Quand passer à la suite</b>${esc(s.completion)}</div>`:''}<div class="actions"><button ${i===0?'disabled':''} onclick="go(${i-1})">← Précédente</button><button class="primary" onclick="go(${i},'live')">▶ ${state.status==='lobby'?'Démarrer cette étape':'Envoyer cette étape'}</button><button class="gold" ${i>=a.length-1?'disabled':''} onclick="go(${i+1})">Étape suivante →</button><button onclick="pauseGame()">⏸ Pause</button></div>${s.durationMinutes?`<div class="actions"><button onclick="startTimer(${s.durationMinutes})">⏱ Démarrer ${s.durationMinutes} min</button><span id="timer" class="timer"></span></div>`:''}</section>${cluesHtml(s)}${advancedHtml()}</div><div><section class="card"><h2>👥 Joueurs · ${players.length}</h2><div class="players">${players.length?players.map(playerHtml).join(''):'<div class="mut">En attente des joueurs…</div>'}</div></section><section class="card"><h2>👥 Participation & MJ</h2><p class="mut">Une personne qui arrive crée son propre personnage. Les anciens secrets, objets et relations ne sont jamais transférés. La partie conserve la scène en cours.</p><div class="f"><label>Maître de jeu</label><select id="gmMode" onchange="changeGmMode(this.value)">${(state.partyRules?.gmChoices||'both')!=='ai'?`<option value="human" ${state.partyRules?.gmMode!=='ai'?'selected':''}>👤 MJ humain</option>`:''}${(state.partyRules?.gmChoices||'both')!=='human'?`<option value="ai" ${state.partyRules?.gmMode==='ai'?'selected':''}>🤖 MJ IA · OpenRouter</option>`:''}</select></div>${state.partyRules?.allowAiPlayers!==false?`<div class="f"><label>Ajouter un compagnon joueur IA</label><input id="newAiName" placeholder="Nom du nouveau compagnon"><div class="f"><label>Personnage du compagnon (facultatif sauf distribution imposée)</label><select id="newAiCharacter"><option value="">Personnage original</option>${(state.playableCharacters||[]).filter(c=>!(state.players||[]).some(p=>p.character?.id===c.id)&&!(state.departedPlayers||[]).some(p=>p.character?.id===c.id)).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></div><button onclick="addAiCompanion()">➕ Ajouter une place IA</button></div>`:''}<div class="mut" style="margin-top:8px">${(state.departedPlayers||[]).length} participant(s) parti(s). Leurs personnages restent distincts et ne sont pas transmis.</div></section><section class="card"><h2>🎥 Zoom / soirée hybride</h2><div class="mut">Utilise le même nom d’équipes pour les Breakout Rooms. NyXia Game gère les informations secrètes, PNJ, dés et décisions.</div><div class="actions"><button onclick="window.open(joinUrl,'_blank')">📱 Tester comme joueur</button><button onclick="load()">↻ Actualiser</button></div></section><section class="card"><h2>🎲 Dés du maître de jeu</h2><p class="mut">Jets officiels enregistrés avec le contexte de la scène.</p><div class="actions"><button onclick="hostRoll(4)">D4</button><button onclick="hostRoll(6)">D6</button><button onclick="hostRoll(10)">D10</button><button onclick="hostRoll(20)">D20</button></div><div id="gmDie" class="gm-die" role="status" aria-live="polite">🎲</div></section><section class="card"><h2>📜 Activité</h2><div class="log">${logs.map(e=>`<div class="logrow"><b>${esc(e.playerName||e.team||'Système')}</b> · ${esc(e.type||'')}<br>${esc(e.text||e.prompt||('result' in e?'Résultat : '+e.result:''))}</div>`).join('')}</div></section></div></div>`}
async function changeGmMode(mode){
 try{let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({gmMode:mode})});state=r.session;render()}
 catch(e){alert(e.message);render()}
}
async function addAiCompanion(){
 const name=document.getElementById('newAiName')?.value||''
 const characterId=document.getElementById('newAiCharacter')?.value||''
 try{let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({participant:{action:'add-ai',name,characterId}})});state=r.session;render()}
 catch(e){alert(e.message)}
}
async function removeParticipant(id,isAi){
 if(!confirm(isAi?'Libérer cette place IA ? Un nouvel humain pourra entrer avec son propre personnage.':'Retirer ce joueur et révoquer son accès ? La partie continue.'))return
 try{let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({participant:{action:isAi?'remove':'remove-human',playerId:id}})});state=r.session;render()}
 catch(e){alert(e.message)}
}
async function hostRoll(sides){
 const el=document.getElementById('gmDie');if(el){el.textContent='D'+sides;el.className='gm-die spinning'}
 try{const data=await api('/api/game/host/'+code,{method:'POST',body:JSON.stringify({type:'roll',sides})});
   state=data.session;render();const die=document.getElementById('gmDie');if(die){die.className='gm-die';die.textContent='D'+sides+' → '+data.action.result}
 }catch(e){if(el){el.className='gm-die';el.textContent=e.message}}
}
async function awardBadge(playerId){
  let catalog=Array.isArray(state?.playerConfig?.badgeCatalog)?state.playerConfig.badgeCatalog:[]
  let sel=document.getElementById('badge-'+playerId),badge=catalog.find(b=>b.id===sel?.value)
  let payload
  if(badge) payload={playerId,badgeId:badge.id}
  else{
    let name=prompt('Nom du badge à remettre :','')
    if(!name)return
    let icon=prompt('Emoji du badge :','🏅')||'🏅'
    let description=prompt('Courte description (optionnel) :','')||''
    payload={playerId,name,icon,description}
  }
  let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({badgeAward:payload})})
  state=r.session;render()
}
async function changeReputation(playerId){
  let faction=document.getElementById('repfaction-'+playerId)?.value||'Générale'
  let delta=Number(document.getElementById('repdelta-'+playerId)?.value||0)
  if(!delta)return
  let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({reputationChange:{playerId,faction,delta}})})
  state=r.session;render()
}
function cluesHtml(s){let list=Array.isArray(s.clues)?s.clues:[];if(!list.length)return '';return `<section class="card"><h2>🔎 Indices de cette étape</h2><div class="clues">${list.map((c,j)=>`<div class="clue"><div class="cluehead"><div><b>${esc(c.label||'Indice')}</b><div class="mut">${c.scope==='team'?'Pour '+esc(c.team||'une équipe'):'Pour tous'}</div></div><button class="gold" onclick="sendPreparedClue(${j})">Envoyer</button></div><div style="margin-top:6px">${esc(c.text||'')}</div></div>`).join('')}</div></section>`}
async function sendPreparedClue(j){let c=(current()?.clues||[])[j];if(!c)return;let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({clue:{scope:c.scope==='team'?'team':'all',team:c.team||'',text:c.text||''}})});state=r.session;render()}
function advancedHtml(){let r=state?.runtime||{},teams=(state?.teams||[]).map(x=>x.name);return `<details class="advanced"><summary>⚙️ Options avancées — pour l’équipe / dépannage</summary><div class="mut" style="margin-top:8px">Ces réglages ne sont pas nécessaires pour animer normalement. Ils permettent de reprendre la main sans enlever aucune capacité.</div><div class="row"><div class="f"><label>Phase</label><input id="phase" value="${esc(r.phase||'')}"></div><div class="f"><label>Titre</label><input id="scene" value="${esc(r.sceneTitle||'')}"></div></div><div class="f"><label>Objectif joueurs</label><textarea id="objective" rows="2">${esc(r.objective||'')}</textarea></div><div class="f"><label>Annonce</label><textarea id="announcement" rows="2">${esc(r.announcement||'')}</textarea></div><div class="f"><label>Narration</label><textarea id="narrative" rows="4">${esc(r.narrative||'')}</textarea></div><div class="row"><div class="f"><label>PNJ</label><input id="npc" value="${esc(r.activeNpc||'')}"></div><div class="f"><label>Lien Zoom</label><input id="zoom" value="${esc(r.zoomUrl||'')}"></div></div><div class="row3"><div class="f"><label>Image</label><input id="image" value="${esc(r.imageUrl||'')}"></div><div class="f"><label>Audio</label><input id="audio" value="${esc(r.audioUrl||'')}"></div><div class="f"><label>Vidéo</label><input id="video" value="${esc(r.videoUrl||'')}"></div></div><div class="actions"><label><input id="allowNpc" type="checkbox" ${r.allowNpc!==false?'checked':''} style="width:auto"> PNJ IA</label><label><input id="allowDice" type="checkbox" ${r.allowDice!==false?'checked':''} style="width:auto"> Dés</label><button onclick="pushAdvanced()">Envoyer les modifications</button><button class="danger" onclick="endGame()">Terminer la partie</button></div><div class="row"><div class="f"><label>Indice manuel</label><textarea id="clue" rows="2"></textarea></div><div class="f"><label>Destinataire</label><select id="clueTeam"><option value="">Tous</option>${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><button onclick="sendManualClue()">Envoyer l’indice manuel</button></details>`}
function advancedRuntime(){return{guidedSceneIndex:idx(),guidedSceneId:current()?.id||'',phase:phase.value,sceneTitle:scene.value,objective:objective.value,announcement:announcement.value,narrative:narrative.value,activeNpc:npc.value,zoomUrl:zoom.value,imageUrl:image.value,audioUrl:audio.value,videoUrl:video.value,allowNpc:allowNpc.checked,allowDice:allowDice.checked}}
async function pushAdvanced(){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status:'live',runtime:advancedRuntime()})});state=r.session;render()}async function sendManualClue(){if(!clue.value.trim())return;let team=clueTeam.value,r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({clue:{scope:team?'team':'all',team,text:clue.value}})});state=r.session;render()}async function movePlayer(playerId,team){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({playerTeam:{playerId,team}})});state=r.session;render()}async function pauseGame(){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status:'paused'})});state=r.session;render()}async function endGame(){if(!confirm('Terminer cette partie ?'))return;await api('/api/game/host/'+code,{method:'DELETE'});location.reload()}function copyJoin(){navigator.clipboard?.writeText(joinUrl);alert('Lien joueur copié ✓')}
function startTimer(minutes){clearInterval(timerId);timerEnds=Date.now()+minutes*60000;tick();timerId=setInterval(tick,1000)}function tick(){let el=document.getElementById('timer');if(!el)return;let left=Math.max(0,timerEnds-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timerId);el.textContent='00:00 ✓'}}
load();setInterval(()=>{if(document.visibilityState==='visible')load()},7000)
</script></body></html>
