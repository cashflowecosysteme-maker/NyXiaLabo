<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game — Animateur</title><link rel="icon" href="/FavIcon.png">
<style>
:root{--bg:#060a18;--card:#101831;--card2:#0b1227;--p:#7B5CFF;--lav:#a78bfa;--gold:#e8b867;--txt:#f7f4ff;--mut:#9ca6c8;--line:rgba(167,139,250,.18);--ok:#35d69a;--bad:#ff627c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(123,92,255,.15),transparent 35%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(6,10,24,.95);backdrop-filter:blur(18px);z-index:5}.brand{font:700 22px Georgia}.brand span{color:var(--lav)}.wrap{max-width:1320px;margin:auto;padding:20px}.hero,.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.94),rgba(7,12,27,.97));border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.22)}.hero{padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.hero h1{margin:3px 0 5px;font-size:27px}.mut{color:var(--mut)}.code{font:900 24px ui-monospace,monospace;letter-spacing:4px;color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(330px,.65fr);gap:16px}.card{padding:17px;margin-bottom:16px}.card h2{font-size:16px;margin:0 0 12px}.step{border:1px solid rgba(123,92,255,.28);background:linear-gradient(135deg,rgba(123,92,255,.10),rgba(232,184,103,.04));border-radius:18px;padding:20px}.stepnum{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--gold);font-weight:900}.steptitle{font:700 29px Georgia;margin:5px 0 7px}.instruction{font-size:17px;line-height:1.6;background:rgba(255,255,255,.035);border-left:4px solid var(--lav);padding:14px 16px;border-radius:10px;margin:15px 0}.read{white-space:pre-wrap;line-height:1.65;background:rgba(232,184,103,.06);border:1px solid rgba(232,184,103,.18);padding:13px;border-radius:11px}.mini{padding:11px;border:1px solid var(--line);border-radius:11px;background:rgba(6,10,24,.42);margin-top:9px}.mini b{display:block;margin-bottom:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}button{border:1px solid var(--line);background:#111b38;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:800}button.primary{background:linear-gradient(135deg,var(--p),#5d49d9);border:0}button.gold{background:linear-gradient(135deg,#b67b27,#e8b867);color:#171006;border:0}button.danger{border-color:rgba(255,98,124,.35);color:#ff9bac}.players,.log,.clues{display:grid;gap:8px}.player,.logrow,.clue{padding:9px;border:1px solid var(--line);background:rgba(4,8,20,.45);border-radius:10px}.player{display:grid;grid-template-columns:1fr 145px;gap:8px;align-items:center}.log{max-height:300px;overflow:auto}.logrow{font-size:12px;color:#d8dcf0}.statusdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.clue{border-left:3px solid var(--gold)}.cluehead{display:flex;justify-content:space-between;gap:10px;align-items:center}.timer{font:900 29px ui-monospace,monospace;color:var(--gold);margin-top:8px}.progress{height:7px;background:#080f22;border-radius:99px;overflow:hidden;margin:8px 0 14px}.progress>div{height:100%;background:linear-gradient(90deg,var(--p),var(--gold))}.err{padding:18px;border:1px solid rgba(255,98,124,.3);background:rgba(255,98,124,.07);border-radius:14px;color:#ffb0bd}details.advanced{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:18px}details.advanced summary{cursor:pointer;font-weight:850}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f{margin-top:10px}.f label{display:block;font-size:11px;color:var(--mut);font-weight:800;margin-bottom:6px;text-transform:uppercase}input,textarea,select{width:100%;border:1px solid var(--line);background:#080f22;color:#fff;border-radius:10px;padding:10px;outline:none}textarea{resize:vertical}.pill{padding:7px 10px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:11px}@media(max-width:900px){.grid{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}.player{grid-template-columns:1fr}.steptitle{font-size:24px}}
</style></head><body>
<div class="top"><div class="brand">NyXia <span>Game</span> · Animateur</div><div style="display:flex;gap:8px;align-items:center"><button onclick="location.href='/game-library.html'">🎮 Ma bibliothèque</button><span class="pill">Soirée guidée</span></div></div><main class="wrap"><div id="app">Chargement…</div></main>
<script>
const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase(),incoming=qs.get('host')||'';if(incoming){sessionStorage.setItem('nyxgame_host_'+code,incoming);qs.delete('host');history.replaceState({},'',location.pathname+'?'+qs.toString())}let hostToken=sessionStorage.getItem('nyxgame_host_'+code)||'',state=null,joinUrl='',timerId=null,timerEnds=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function h(){return {'Content-Type':'application/json','X-NyXia-Host-Token':hostToken}}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...h(),...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j}
function scenes(){return Array.isArray(state?.guidedScenes)&&state.guidedScenes.length?state.guidedScenes:(Array.isArray(state?.hostPackage?.guidedScenes)?state.hostPackage.guidedScenes:[])}function idx(){let a=scenes(),n=Number(state?.runtime?.guidedSceneIndex)||0;return Math.max(0,Math.min(Math.max(0,a.length-1),n))}function current(){return scenes()[idx()]||null}
async function load(){try{let r=await api('/api/game/host/'+encodeURIComponent(code));state=r.session;joinUrl=r.joinUrl;render()}catch(e){document.getElementById('app').innerHTML='<div class="err"><b>Impossible d’ouvrir cette soirée.</b><br>'+esc(e.message)+'</div>'}}
function sceneRuntime(scene,index){let r=state.runtime||{};return{guidedSceneIndex:index,guidedSceneId:scene.id||'',phase:scene.phase||'',sceneTitle:scene.title||'',objective:scene.playerObjective||'',announcement:scene.announcement||'',narrative:scene.readAloud||'',activeNpc:scene.npc?.name||'',allowNpc:!!(scene.npc?.enabled&&scene.npc?.name),allowDice:scene.dice?.enabled!==false,imageUrl:scene.media?.imageUrl||'',audioUrl:scene.media?.audioUrl||'',videoUrl:scene.media?.videoUrl||'',zoomUrl:r.zoomUrl||''}}
async function go(index,status='live'){let a=scenes();if(!a.length)return;index=Math.max(0,Math.min(a.length-1,index));let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status,runtime:sceneRuntime(a[index],index)})});state=r.session;render()}
function render(){let r=state.runtime||{},a=scenes(),i=idx(),s=current(),players=state.players||[],logs=(state.log||[]).slice(-45).reverse();if(!a.length){document.getElementById('app').innerHTML=`<section class="hero"><div><div class="mut">${esc(state.gameType||'NyXia Game')} · ${esc(state.audience||'16+')}</div><h1>${esc(state.title)}</h1><div class="mut">Code joueur ${esc(code)}</div></div></section><div class="err"><b>Ce jeu n’a pas encore de conducteur guidé.</b><br>Il doit être finalisé dans NyXiaLabo avant d’être vendu. L’acheteur ne devrait pas avoir à écrire les scènes ici.</div>${advancedHtml()}`;return}let pct=Math.round(((i+1)/a.length)*100);document.getElementById('app').innerHTML=`<section class="hero"><div><div class="mut">${esc(state.gameType||'NyXia Game')} · ${esc(state.audience||'16+')}</div><h1>${esc(state.title)}</h1><div class="mut">Suis les étapes. NyXia Game garde les détails techniques derrière le rideau.</div></div><div><div class="mut">CODE JOUEUR</div><div class="code">${esc(code)}</div><button onclick="copyJoin()">📋 Copier l’invitation</button></div></section><div class="grid"><div><section class="step"><div class="stepnum">Étape ${i+1} sur ${a.length} · ${esc(s.phase||'')}</div><div class="progress"><div style="width:${pct}%"></div></div><div class="steptitle">${esc(s.title||'Étape')}</div>${s.durationMinutes?`<div class="mut">Durée prévue : ~${s.durationMinutes} min</div>`:''}<div class="instruction">${esc(s.hostInstruction||'Suis les éléments de cette scène puis passe à la suivante.')}</div>${s.readAloud?`<div class="mini"><b>🔊 À lire / raconter</b><div class="read">${esc(s.readAloud)}</div></div>`:''}${s.breakout?.enabled?`<div class="mini"><b>👥 Breakout Rooms</b>${esc(s.breakout.instruction||'Répartis les joueurs dans leurs équipes.')}${s.breakout.teams?.length?`<div class="mut" style="margin-top:5px">${s.breakout.teams.map(esc).join(' · ')}</div>`:''}</div>`:''}${s.npc?.enabled&&s.npc?.name?`<div class="mini"><b>🧙 PNJ IA : ${esc(s.npc.name)}</b>${esc(s.npc.instruction||'Les joueurs peuvent maintenant interroger ce personnage.')}</div>`:''}${s.dice?.instruction?`<div class="mini"><b>🎲 Dés</b>${esc(s.dice.instruction)}</div>`:''}${s.media?.instruction?`<div class="mini"><b>🎬 Média</b>${esc(s.media.instruction)}</div>`:''}${s.completion?`<div class="mini"><b>✓ Quand passer à la suite</b>${esc(s.completion)}</div>`:''}<div class="actions"><button ${i===0?'disabled':''} onclick="go(${i-1})">← Précédente</button><button class="primary" onclick="go(${i},'live')">▶ ${state.status==='lobby'?'Démarrer cette étape':'Envoyer cette étape'}</button><button class="gold" ${i>=a.length-1?'disabled':''} onclick="go(${i+1})">Étape suivante →</button><button onclick="pauseGame()">⏸ Pause</button></div>${s.durationMinutes?`<div class="actions"><button onclick="startTimer(${s.durationMinutes})">⏱ Démarrer ${s.durationMinutes} min</button><span id="timer" class="timer"></span></div>`:''}</section>${cluesHtml(s)}${advancedHtml()}</div><div><section class="card"><h2>👥 Joueurs · ${players.length}</h2><div class="players">${players.length?players.map(p=>`<div class="player"><div><span class="statusdot"></span><b>${esc(p.name)}</b><div class="mut">${esc(p.team||'Sans équipe')}</div></div><select onchange="movePlayer('${p.id}',this.value)">${(state.teams||[]).map(t=>`<option ${p.team===t.name?'selected':''}>${esc(t.name)}</option>`).join('')}</select></div>`).join(''):'<div class="mut">En attente des joueurs…</div>'}</div></section><section class="card"><h2>🎥 Zoom / soirée hybride</h2><div class="mut">Utilise le même nom d’équipes pour les Breakout Rooms. NyXia Game gère les informations secrètes, PNJ, dés et décisions.</div><div class="actions"><button onclick="window.open(joinUrl,'_blank')">📱 Tester comme joueur</button><button onclick="load()">↻ Actualiser</button></div></section><section class="card"><h2>📜 Activité</h2><div class="log">${logs.map(e=>`<div class="logrow"><b>${esc(e.playerName||e.team||'Système')}</b> · ${esc(e.type||'')}<br>${esc(e.text||e.prompt||('result' in e?'Résultat : '+e.result:''))}</div>`).join('')}</div></section></div></div>`}
function cluesHtml(s){let list=Array.isArray(s.clues)?s.clues:[];if(!list.length)return '';return `<section class="card"><h2>🔎 Indices de cette étape</h2><div class="clues">${list.map((c,j)=>`<div class="clue"><div class="cluehead"><div><b>${esc(c.label||'Indice')}</b><div class="mut">${c.scope==='team'?'Pour '+esc(c.team||'une équipe'):'Pour tous'}</div></div><button class="gold" onclick="sendPreparedClue(${j})">Envoyer</button></div><div style="margin-top:6px">${esc(c.text||'')}</div></div>`).join('')}</div></section>`}
async function sendPreparedClue(j){let c=(current()?.clues||[])[j];if(!c)return;let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({clue:{scope:c.scope==='team'?'team':'all',team:c.team||'',text:c.text||''}})});state=r.session;render()}
function advancedHtml(){let r=state?.runtime||{},teams=(state?.teams||[]).map(x=>x.name);return `<details class="advanced"><summary>⚙️ Options avancées — pour l’équipe / dépannage</summary><div class="mut" style="margin-top:8px">Ces réglages ne sont pas nécessaires pour animer normalement. Ils permettent de reprendre la main sans enlever aucune capacité.</div><div class="row"><div class="f"><label>Phase</label><input id="phase" value="${esc(r.phase||'')}"></div><div class="f"><label>Titre</label><input id="scene" value="${esc(r.sceneTitle||'')}"></div></div><div class="f"><label>Objectif joueurs</label><textarea id="objective" rows="2">${esc(r.objective||'')}</textarea></div><div class="f"><label>Annonce</label><textarea id="announcement" rows="2">${esc(r.announcement||'')}</textarea></div><div class="f"><label>Narration</label><textarea id="narrative" rows="4">${esc(r.narrative||'')}</textarea></div><div class="row"><div class="f"><label>PNJ</label><input id="npc" value="${esc(r.activeNpc||'')}"></div><div class="f"><label>Lien Zoom</label><input id="zoom" value="${esc(r.zoomUrl||'')}"></div></div><div class="row3"><div class="f"><label>Image</label><input id="image" value="${esc(r.imageUrl||'')}"></div><div class="f"><label>Audio</label><input id="audio" value="${esc(r.audioUrl||'')}"></div><div class="f"><label>Vidéo</label><input id="video" value="${esc(r.videoUrl||'')}"></div></div><div class="actions"><label><input id="allowNpc" type="checkbox" ${r.allowNpc!==false?'checked':''} style="width:auto"> PNJ IA</label><label><input id="allowDice" type="checkbox" ${r.allowDice!==false?'checked':''} style="width:auto"> Dés</label><button onclick="pushAdvanced()">Envoyer les modifications</button><button class="danger" onclick="endGame()">Terminer la partie</button></div><div class="row"><div class="f"><label>Indice manuel</label><textarea id="clue" rows="2"></textarea></div><div class="f"><label>Destinataire</label><select id="clueTeam"><option value="">Tous</option>${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div></div><button onclick="sendManualClue()">Envoyer l’indice manuel</button></details>`}
function advancedRuntime(){return{guidedSceneIndex:idx(),guidedSceneId:current()?.id||'',phase:phase.value,sceneTitle:scene.value,objective:objective.value,announcement:announcement.value,narrative:narrative.value,activeNpc:npc.value,zoomUrl:zoom.value,imageUrl:image.value,audioUrl:audio.value,videoUrl:video.value,allowNpc:allowNpc.checked,allowDice:allowDice.checked}}
async function pushAdvanced(){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status:'live',runtime:advancedRuntime()})});state=r.session;render()}async function sendManualClue(){if(!clue.value.trim())return;let team=clueTeam.value,r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({clue:{scope:team?'team':'all',team,text:clue.value}})});state=r.session;render()}async function movePlayer(playerId,team){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({playerTeam:{playerId,team}})});state=r.session;render()}async function pauseGame(){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status:'paused'})});state=r.session;render()}async function endGame(){if(!confirm('Terminer cette partie ?'))return;await api('/api/game/host/'+code,{method:'DELETE'});location.reload()}function copyJoin(){navigator.clipboard?.writeText(joinUrl);alert('Lien joueur copié ✓')}
function startTimer(minutes){clearInterval(timerId);timerEnds=Date.now()+minutes*60000;tick();timerId=setInterval(tick,1000)}function tick(){let el=document.getElementById('timer');if(!el)return;let left=Math.max(0,timerEnds-Date.now()),m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);el.textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(left<=0){clearInterval(timerId);el.textContent='00:00 ✓'}}
load();setInterval(()=>{if(document.visibilityState==='visible')load()},7000)
</script></body></html>
