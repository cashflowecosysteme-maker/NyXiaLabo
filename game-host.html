<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NyXia Game — Console Animateur</title><link rel="icon" href="/FavIcon.png"><style>
:root{--bg:#060a18;--card:#101831;--card2:#0b1227;--p:#7B5CFF;--lav:#a78bfa;--gold:#e8b867;--txt:#f7f4ff;--mut:#9ca6c8;--line:rgba(167,139,250,.18);--ok:#35d69a;--bad:#ff627c}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 10%,rgba(123,92,255,.15),transparent 35%),var(--bg);color:var(--txt);font:14px system-ui,-apple-system,Segoe UI,sans-serif}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;background:rgba(6,10,24,.94);backdrop-filter:blur(18px);z-index:5}.brand{font:700 22px Georgia;color:#fff}.brand span{color:var(--lav)}.pill{padding:8px 12px;border:1px solid var(--line);border-radius:999px;color:var(--mut);font-size:12px}.wrap{max-width:1450px;margin:auto;padding:20px}.hero,.card{border:1px solid var(--line);background:linear-gradient(145deg,rgba(16,24,49,.92),rgba(7,12,27,.96));border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.24)}.hero{padding:18px 20px;margin-bottom:16px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}.hero h1{margin:0 0 5px;font-size:25px}.mut{color:var(--mut)}.code{font:800 24px ui-monospace,monospace;letter-spacing:4px;color:var(--gold)}.grid{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(360px,.65fr);gap:16px}.card{padding:16px;margin-bottom:16px}.card h2{font-size:15px;margin:0 0 12px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.f{margin-bottom:10px}.f label{display:block;font-size:11px;color:var(--mut);font-weight:700;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}input,textarea,select{width:100%;border:1px solid var(--line);background:#080f22;color:#fff;border-radius:10px;padding:10px 11px;outline:none}textarea{resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}button{border:1px solid var(--line);background:#111b38;color:#fff;padding:9px 12px;border-radius:10px;cursor:pointer;font-weight:700}button.primary{background:linear-gradient(135deg,var(--p),#5d49d9);border-color:transparent}button.gold{background:linear-gradient(135deg,#b67b27,#e8b867);color:#171006;border:0}button.danger{border-color:rgba(255,98,124,.35);color:#ff9bac}.players,.log{display:grid;gap:8px}.player,.logrow{padding:9px;border:1px solid var(--line);background:rgba(4,8,20,.45);border-radius:10px}.player{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center}.log{max-height:390px;overflow:auto}.logrow{font-size:12px;color:#d8dcf0}.status{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px}.clues{display:grid;gap:7px}.clue{border-left:3px solid var(--gold);padding:8px 10px;background:rgba(232,184,103,.06);border-radius:8px}.err{padding:18px;border:1px solid rgba(255,98,124,.3);background:rgba(255,98,124,.07);border-radius:14px;color:#ffb0bd}@media(max-width:900px){.grid{grid-template-columns:1fr}.row,.row3{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.player{grid-template-columns:1fr}}</style></head><body>
<div class="top"><div class="brand">NyXia <span>Game</span> · Console Animateur</div><div style="display:flex;gap:8px;align-items:center"><button onclick="location.href='/game-library.html'">🎮 Ma bibliothèque</button><div class="pill">Mode Hôte — aucun accès au Labo</div></div></div><main class="wrap"><div id="app">Chargement…</div></main>
<script>
const qs=new URLSearchParams(location.search),code=(qs.get('code')||'').toUpperCase(),incoming=qs.get('host')||'';if(incoming){sessionStorage.setItem('nyxgame_host_'+code,incoming);qs.delete('host');history.replaceState({},'',location.pathname+'?'+qs.toString())}let hostToken=sessionStorage.getItem('nyxgame_host_'+code)||'',state=null,joinUrl='';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function h(){return {'Content-Type':'application/json','X-NyXia-Host-Token':hostToken}}async function api(path,opt={}){let r=await fetch(path,{...opt,headers:{...h(),...(opt.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Erreur '+r.status);return j}
async function load(){try{let r=await api('/api/game/host/'+encodeURIComponent(code));state=r.session;joinUrl=r.joinUrl;render()}catch(e){document.getElementById('app').innerHTML='<div class="err"><b>Impossible d’ouvrir cette console.</b><br>'+esc(e.message)+'</div>'}}
function render(){let r=state.runtime||{},teams=(state.teams||[]).map(x=>x.name),players=state.players||[],logs=(state.log||[]).slice(-60).reverse();document.getElementById('app').innerHTML=`<section class="hero"><div><div class="mut">${esc(state.gameType||'NyXia Game')} · ${esc(state.audience||'16+')}</div><h1>${esc(state.title)}</h1><div class="mut">Tu animes la partie. Les joueurs ne voient que leurs informations autorisées.</div></div><div><div class="mut">CODE JOUEUR</div><div class="code">${esc(code)}</div><button onclick="copyJoin()">📋 Copier le lien joueur</button></div></section><div class="grid"><div><section class="card"><h2>🎬 Scène en cours</h2><div class="row"><div class="f"><label>Phase</label><input id="phase" value="${esc(r.phase||'')}"></div><div class="f"><label>Titre de scène</label><input id="scene" value="${esc(r.sceneTitle||'')}"></div></div><div class="f"><label>Objectif envoyé aux joueurs</label><textarea id="objective" rows="3">${esc(r.objective||'')}</textarea></div><div class="f"><label>Annonce</label><textarea id="announcement" rows="3">${esc(r.announcement||'')}</textarea></div><div class="f"><label>Narration / description</label><textarea id="narrative" rows="6">${esc(r.narrative||'')}</textarea></div><div class="row"><div class="f"><label>PNJ disponible</label><input id="npc" value="${esc(r.activeNpc||'')}"></div><div class="f"><label>Lien Zoom</label><input id="zoom" value="${esc(r.zoomUrl||'')}"></div></div><div class="row3"><div class="f"><label>Image</label><input id="image" value="${esc(r.imageUrl||'')}"></div><div class="f"><label>Audio</label><input id="audio" value="${esc(r.audioUrl||'')}"></div><div class="f"><label>Vidéo</label><input id="video" value="${esc(r.videoUrl||'')}"></div></div><div class="actions"><label><input id="allowNpc" type="checkbox" ${r.allowNpc!==false?'checked':''} style="width:auto"> PNJ IA</label><label><input id="allowDice" type="checkbox" ${r.allowDice!==false?'checked':''} style="width:auto"> Dés</label></div><div class="actions"><button class="primary" onclick="push('live')">▶ Envoyer aux joueurs</button><button onclick="push('paused')">⏸ Pause</button><button onclick="push('lobby')">🚪 Lobby</button></div></section><section class="card"><h2>🔎 Indices & informations secrètes</h2><div class="row"><div class="f"><label>Destinataire</label><select id="clueTeam"><option value="">Tous les joueurs</option>${teams.map(t=>`<option>${esc(t)}</option>`).join('')}</select></div><div class="f"><label>Indice</label><textarea id="clue" rows="3"></textarea></div></div><div class="actions"><button class="gold" onclick="sendClue()">Envoyer l’indice</button></div><div class="clues">${(r.sharedClues||[]).slice(-8).map(x=>`<div class="clue">🌐 ${esc(x)}</div>`).join('')}</div></section></div><div><section class="card"><h2>👥 Joueurs · ${players.length}</h2><div class="players">${players.length?players.map(p=>`<div class="player"><div><span class="status"></span><b>${esc(p.name)}</b><div class="mut">${esc(p.team||'Sans équipe')}</div></div><select onchange="movePlayer('${p.id}',this.value)">${teams.map(t=>`<option ${p.team===t?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`).join(''):'<div class="mut">En attente des joueurs…</div>'}</div></section><section class="card"><h2>📜 Activité</h2><div class="log">${logs.map(e=>`<div class="logrow"><b>${esc(e.playerName||e.team||'Système')}</b> · ${esc(e.type||'')}<br>${esc(e.text||e.prompt||('result' in e?'Résultat : '+e.result:''))}</div>`).join('')}</div></section><section class="card"><h2>🎥 Zoom / hybride</h2><div class="mut">Crée les Breakout Rooms dans Zoom avec les mêmes noms d’équipes. NyXia Game gère ici les secrets, objectifs, dés, PNJ IA et décisions. Zoom reste l’espace de discussion vidéo.</div><div class="actions"><button onclick="window.open(joinUrl,'_blank')">📱 Tester comme joueur</button><button onclick="load()">↻ Actualiser</button><button class="danger" onclick="endGame()">Terminer la partie</button></div></section></div></div>${hostGuideHtml()}`}
function hostGuideHtml(){let h=state.hostPackage||{};let blocks=[['🎥 Conducteur Live',h.livePlan],['🧭 Scènes & embranchements',h.scenesQuests],['🧰 Dossier animateur / MJ',h.hostMaterials],['🔒 Vérité / solutions',h.lockedCanon],['🌍 Bible du monde',h.worldBible],['🧙 Personnages',h.characters],['⚔️ Règles & résolution',[(h.mechanics||''),(h.combatRules||''),(h.progression||'')].filter(Boolean).join('\n\n')]];let content=blocks.filter(x=>String(x[1]||'').trim()).map(x=>`<details class="card" style="margin:0 0 10px"><summary style="cursor:pointer;font-weight:800">${x[0]}</summary><div style="white-space:pre-wrap;line-height:1.6;color:#d8dcf0;margin-top:12px">${esc(x[1])}</div></details>`).join('');return `<section style="margin-top:18px"><div class="mut" style="margin-bottom:8px">DOSSIER HÔTE — invisible aux joueurs</div>${content||'<div class="card mut">Le dossier animateur n\'a pas encore été publié avec ce jeu.</div>'}</section>`}
function runtime(){return{phase:phase.value,sceneTitle:scene.value,objective:objective.value,announcement:announcement.value,narrative:narrative.value,activeNpc:npc.value,zoomUrl:zoom.value,imageUrl:image.value,audioUrl:audio.value,videoUrl:video.value,allowNpc:allowNpc.checked,allowDice:allowDice.checked}}async function push(status){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({status,runtime:runtime()})});state=r.session;render()}async function sendClue(){if(!clue.value.trim())return;let team=clueTeam.value,r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({clue:{scope:team?'team':'all',team,text:clue.value}})});state=r.session;render()}async function movePlayer(playerId,team){let r=await api('/api/game/host/'+code,{method:'PUT',body:JSON.stringify({playerTeam:{playerId,team}})});state=r.session;render()}async function endGame(){if(!confirm('Terminer cette partie ?'))return;await api('/api/game/host/'+code,{method:'DELETE'});location.reload()}function copyJoin(){navigator.clipboard?.writeText(joinUrl)}load();setInterval(load,5000)
</script></body></html>
