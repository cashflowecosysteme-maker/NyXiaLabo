<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <title>NyXiaLabo — Atelier Équipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{
      --night:#060A18;--night2:#0c1229;--panel:#111a38;--panel2:#151f46;
      --violet:#7B5CFF;--lav:#A78BFA;--gold:#F4C56A;--text:#F7F4FF;--muted:#A7ADCC;
      --line:rgba(167,139,250,.16);--green:#35d69a;--red:#ff7188;--shadow:0 22px 65px rgba(0,0,0,.34)
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--text);font-family:Outfit,sans-serif}
    body{background:radial-gradient(circle at 18% 0%,rgba(123,92,255,.18),transparent 34%),radial-gradient(circle at 88% 20%,rgba(244,197,106,.08),transparent 28%),var(--night)}
    button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}
    aside{position:sticky;top:0;height:100vh;padding:20px 16px;background:rgba(6,10,24,.92);border-right:1px solid var(--line);backdrop-filter:blur(18px);overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#4b6cff);box-shadow:0 0 34px rgba(123,92,255,.45);font-size:21px}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--gold);margin-top:2px}
    .nav-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#606a94;font-weight:800;margin:18px 10px 7px}.nav-btn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:rgba(123,92,255,.12);border-color:rgba(123,92,255,.25);color:#fff}.nav-btn .ico{width:24px;text-align:center}.back{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
    main{min-width:0}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(6,10,24,.64);backdrop-filter:blur(15px);position:sticky;top:0;z-index:20}.topbar h2{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0;background:linear-gradient(120deg,#fff,var(--lav),var(--gold));-webkit-background-clip:text;color:transparent}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}.status.warn{color:var(--gold)}
    .content{padding:26px;max-width:1450px;margin:auto}.hero{padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(123,92,255,.13),rgba(244,197,106,.04));box-shadow:var(--shadow)}.hero h3{font-family:'Cormorant Garamond',serif;font-size:34px;margin:0 0 6px}.hero p{max-width:850px;color:var(--muted);line-height:1.65;margin:0}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(244,197,106,.25);background:rgba(244,197,106,.07);color:#f8d995;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;margin-bottom:13px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.card{background:rgba(17,26,56,.78);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.18)}.card h4{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}.card .bigico{font-size:28px;margin-bottom:10px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn{border:1px solid rgba(123,92,255,.28);background:rgba(123,92,255,.10);color:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;font-size:12px;font-weight:700}.btn:hover{background:rgba(123,92,255,.2)}.btn.primary{border:none;background:linear-gradient(135deg,var(--violet),#5a70ff);box-shadow:0 8px 25px rgba(123,92,255,.25)}.btn.gold{border-color:rgba(244,197,106,.28);background:rgba(244,197,106,.09);color:#ffe6a6}.btn.danger{border-color:rgba(255,113,136,.28);background:rgba(255,113,136,.08);color:#ff9cab}.btn:disabled{opacity:.5;cursor:not-allowed}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 12px}.section-title h3{margin:0;font-size:20px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:18px}.panel{background:rgba(17,26,56,.82);border:1px solid var(--line);border-radius:18px;padding:18px}.panel h4{margin:0 0 14px}.field{margin-bottom:13px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#7f89b7;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:rgba(6,10,24,.55);border:1px solid rgba(167,139,250,.2);border-radius:11px;color:#fff;padding:10px 12px;outline:none}.field textarea{min-height:95px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(123,92,255,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row.three{grid-template-columns:1fr 1fr 1fr}.muted{color:var(--muted);font-size:12px}.tiny{font-size:11px;color:#6e789f}.locked{border-color:rgba(244,197,106,.35)!important;background:rgba(244,197,106,.04)!important}.tools-line{display:flex;gap:8px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:16px 0}
    .projectbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.projectbar select{max-width:380px;background:rgba(6,10,24,.65);border:1px solid var(--line);color:#fff;padding:9px 12px;border-radius:10px}.save-state{font-size:11px;color:var(--muted)}
    .result{min-height:160px;background:rgba(6,10,24,.5);border:1px solid rgba(167,139,250,.16);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.6;color:#eef0ff;overflow:auto}.result.empty{display:grid;place-items:center;color:#606b94}.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions button{border:0;background:transparent;color:#8992b8;cursor:pointer;font-size:12px;padding:3px}.result-actions button:hover{color:#fff}.applybar{margin-top:10px;display:flex;gap:8px;align-items:center}.applybar select{max-width:230px}
    .recent{width:100%;border-collapse:collapse}.recent td,.recent th{padding:10px;border-bottom:1px solid rgba(167,139,250,.08);text-align:left;font-size:12px}.recent th{color:#68739e;text-transform:uppercase;font-size:10px}.kind{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--lav)}
    .chapter{border:1px solid rgba(167,139,250,.14);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(6,10,24,.32)}.chapter-head{display:flex;gap:8px;align-items:center}.chapter-head input{flex:1}.chapter textarea{margin-top:9px;min-height:120px}.chapter.selected{border-color:rgba(244,197,106,.38);box-shadow:inset 0 0 0 1px rgba(244,197,106,.08)}.audio-box{margin-top:10px;padding:10px;border-radius:12px;background:rgba(6,10,24,.45);border:1px solid var(--line)}audio{width:100%;margin-top:7px}
    .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:10px;border-radius:11px;background:rgba(6,10,24,.4);border:1px solid var(--line);font-size:12px}.check.ok{border-color:rgba(53,214,154,.26);color:#9bf0d0}.check.bad{border-color:rgba(255,113,136,.26);color:#ffb4c1}.lockline{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:rgba(244,197,106,.06);border:1px solid rgba(244,197,106,.2);color:#f5d890;font-size:12px}
    .tool-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool-pill{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(6,10,24,.35);font-size:12px;color:var(--muted)}
    .game-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.game-tab{border:1px solid var(--line);background:rgba(6,10,24,.42);color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer;font-size:11px;font-weight:800}.game-tab.active{background:rgba(123,92,255,.18);border-color:rgba(123,92,255,.45);color:#fff;box-shadow:0 0 24px rgba(123,92,255,.10)}
    .game-meter{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;margin:8px 0}.game-meter span{font-size:11px;color:var(--muted)}.game-meter input[type=range]{width:100%;accent-color:var(--violet)}.game-meter b{text-align:center;color:var(--gold);font-size:12px}
    .game-status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.game-status{border:1px solid var(--line);background:rgba(6,10,24,.34);border-radius:12px;padding:10px;font-size:11px;color:var(--muted)}.game-status strong{display:block;color:#fff;margin-bottom:4px}.game-status.ready{border-color:rgba(53,214,154,.25)}.game-status.ready strong{color:#9bf0d0}.game-kicker{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.7px;text-transform:uppercase}.game-note{padding:11px 12px;border-radius:12px;border:1px solid rgba(244,197,106,.18);background:rgba(244,197,106,.05);color:#f0d89c;font-size:12px;line-height:1.5;margin-bottom:12px}.game-stack{display:grid;gap:10px}.game-file-list{font-size:11px;color:var(--muted);line-height:1.6}    .live-console{border:1px solid rgba(53,214,154,.22);background:linear-gradient(135deg,rgba(53,214,154,.055),rgba(123,92,255,.05));border-radius:16px;padding:14px;margin-top:14px}.live-code{font-family:monospace;font-size:27px;letter-spacing:5px;color:var(--gold);font-weight:900}.live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-box{border:1px solid var(--line);background:rgba(6,10,24,.38);border-radius:12px;padding:11px}.live-box h5{margin:0 0 8px;font-size:12px;color:#fff}.live-players{display:grid;gap:7px}.live-player{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:8px;border-radius:10px;background:rgba(6,10,24,.44);border:1px solid rgba(167,139,250,.1)}.live-log{max-height:300px;overflow:auto;display:grid;gap:6px}.live-log-row{font-size:11px;line-height:1.45;padding:7px 8px;border-radius:9px;background:rgba(6,10,24,.4);border:1px solid rgba(167,139,250,.08)}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 10px rgba(53,214,154,.5)}.live-link{word-break:break-all;color:var(--lav);font-size:11px}.live-preview{border:1px dashed rgba(244,197,106,.25);padding:10px;border-radius:11px;color:var(--muted);font-size:11px}

    @media(max-width:850px){.live-grid{grid-template-columns:1fr}.live-player{grid-template-columns:1fr}.game-status-grid{grid-template-columns:1fr 1fr}.game-meter{grid-template-columns:110px 1fr 30px}}

    .toast{position:fixed;right:22px;bottom:22px;z-index:99;background:#111a38;color:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 14px;border-radius:12px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}

    .map-preview{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(6,10,24,.48);min-height:180px;display:grid;place-items:center;overflow:auto}.map-preview img{max-width:100%;height:auto;border-radius:10px;display:block}.file-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.file-btn{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(123,92,255,.07);color:#fff;cursor:pointer;text-align:center;font-size:12px}.file-btn:hover{background:rgba(123,92,255,.16)}@media(max-width:850px){.file-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.shell{grid-template-columns:220px 1fr}.row.three{grid-template-columns:1fr 1fr}}
    @media(max-width:720px){.shell{display:block}aside{position:relative;width:100%;height:auto}.grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}.row,.row.three{grid-template-columns:1fr}.tool-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="orb">🧪</div><div><h1>NyXiaLabo</h1><small>Atelier équipe humaine + IA</small></div></div>
    <div class="nav-label">Atelier</div>
    <button class="nav-btn active" data-view="home" onclick="showView('home')"><span class="ico">🏠</span>Vue d'ensemble</button>
    <button class="nav-btn" data-view="ghost" onclick="showView('ghost')"><span class="ico">✍️</span>GhostWriting</button>
    <button class="nav-btn" data-view="audio" onclick="showView('audio')"><span class="ico">🎧</span>Studio Livre Audio</button>
    <button class="nav-btn" data-view="game" onclick="showView('game')"><span class="ico">🎮</span>Architecte NyXia Game</button>
    <button class="nav-btn" data-view="mystery" onclick="showView('mystery')"><span class="ico">🎲</span>Meurtre & Mystère</button>
    <button class="nav-btn" data-view="maps" onclick="showView('maps')"><span class="ico">🗺️</span>Cartographie & Mondes</button>
    <button class="nav-btn" data-view="visual" onclick="showView('visual')"><span class="ico">🎨</span>Création visuelle</button>
    <button class="nav-btn" data-view="video" onclick="showView('video')"><span class="ico">🎬</span>Vidéo</button>
    <button class="nav-btn" data-view="models" onclick="showView('models')"><span class="ico">🧪</span>Modèles & API</button>
    <div class="back"><button class="nav-btn" onclick="location.href='/dashboard.html'"><span class="ico">↩</span>Retour au Labo complet</button></div>
  </aside>

  <main>
    <div class="topbar"><h2 id="top-title">Atelier Équipe</h2><div id="health" class="status">Connexion…</div></div>
    <div class="content">
      <section id="view-home" class="view"></section>
      <section id="view-ghost" class="view hidden"></section>
      <section id="view-audio" class="view hidden"></section>
      <section id="view-game" class="view hidden"></section>
      <section id="view-mystery" class="view hidden"></section>
      <section id="view-maps" class="view hidden"></section>
      <section id="view-visual" class="view hidden"></section>
      <section id="view-video" class="view hidden"></section>
      <section id="view-models" class="view hidden"></section>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
  var token = sessionStorage.getItem('sandbox_token') || ''
  var allProjects = []
  var currentProject = null
  var tools = []
  var aiTools = []
  var currentView = 'home'
  var lastAI = { prompt:'', system:'', toolId:'', text:'', target:'' }
  var saveTimer = null
  var audioUrls = []
  var selectedChapter = 0
  var pendingMysteryProposal = null
  var cartoJob = null
  var cartoPreviewUrl = ''
  var cartoReady = false
  var gameTab = 'concept'
  var gameLivePoll = null
  var gameLiveHostState = null
  var gameLiveHostUrl = ''

  function h(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token } }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }
  function toast(msg){ var e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(function(){e.classList.remove('show')},1800) }
  function kindLabel(k){ return ({ghostwriting:'GhostWriting',audiobook:'Livre Audio','nyxia-game':'NyXia Game',mystery:'Meurtre & Mystère',visual:'Visuel',video:'Vidéo',api:'Modèles & API'})[k]||k }
  function kindIcon(k){ return ({ghostwriting:'✍️',audiobook:'🎧','nyxia-game':'🎮',mystery:'🎲',visual:'🎨',video:'🎬',api:'🧪'})[k]||'🧪' }

  async function api(url, opts){
    opts=opts||{}; opts.headers=Object.assign({},h(),opts.headers||{})
    var r=await fetch(url,opts); var data=await r.json().catch(function(){return {}})
    if(r.status===401){ sessionStorage.removeItem('sandbox_token'); location.href='/login.html'; throw new Error('Session expirée') }
    if(!r.ok) throw new Error(data.error||('HTTP '+r.status))
    return data
  }

  async function boot(){
    if(!token){ location.href='/login.html'; return }
    try{
      var auth=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})}).then(function(r){return r.json()})
      if(!auth.valid){ location.href='/login.html'; return }
      var data=await Promise.all([api('/api/atelier/health'),api('/api/atelier/projects'),api('/api/tools')])
      var health=data[0]; allProjects=data[1].projects||[]; tools=data[2].tools||[]
      aiTools=tools.filter(function(t){ return t.providerId && t.model && (!t.kind || t.kind==='chat') })
      var savedAi='';try{savedAi=sessionStorage.getItem('nyxialabo_default_ai_tool')||''}catch(e){}
      var savedTool=aiTools.find(function(t){return t.id===savedAi})
      var bootTool=savedTool||preferredGptTool()
      if(bootTool)rememberAiModel(bootTool.id)
      cartoReady=!!health.cartography; var he=document.getElementById('health'); he.textContent='● Atelier connecté'+(health.googleTts?' · TTS prêt':' · TTS à configurer')+(cartoReady?' · Cartographie prête':' · Cartographie à configurer'); he.className='status '+(health.googleTts&&cartoReady?'ok':'warn')
      renderHome()
    }catch(e){ document.getElementById('health').textContent='⚠ '+e.message; document.getElementById('health').className='status warn'; renderHome() }
  }

  function showView(v){
    currentView=v
    document.querySelectorAll('.view').forEach(function(x){x.classList.add('hidden')})
    document.getElementById('view-'+v).classList.remove('hidden')
    document.querySelectorAll('.nav-btn[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)})
    document.getElementById('top-title').textContent=({home:'Atelier Équipe',ghost:'Atelier GhostWriting',audio:'Studio Livre Audio',game:'Architecte NyXia Game',mystery:'Meurtre & Mystère',maps:'Cartographie & Mondes',visual:'Création visuelle',video:'Vidéo',models:'Modèles & API'})[v]
    if(v==='home')renderHome(); if(v==='game')renderGame(); if(v==='ghost')renderGhost(); if(v==='audio')renderAudio(); if(v==='mystery')renderMystery(); if(v==='maps')renderMaps(); if(v==='visual')renderVisual(); if(v==='video')renderVideo(); if(v==='models')renderModels()
  }

  function renderHome(){
    var recent=(allProjects||[]).slice(0,8).map(function(p){return '<tr><td>'+kindIcon(p.kind)+' <span class="kind">'+esc(kindLabel(p.kind))+'</span></td><td><b>'+esc(p.title)+'</b><div class="tiny">'+esc(p.client||'')+'</div></td><td>'+new Date(p.updatedAt).toLocaleDateString('fr-CA')+'</td><td><button class="btn" onclick="openProject(\''+p.id+'\')">Ouvrir</button></td></tr>'}).join('')
    document.getElementById('view-home').innerHTML=''+
      '<div class="hero"><div class="badge">ATELIER INTERNE · ÉQUIPE HUMAINE + IA</div><h3>Créer plus vite sans céder la direction créative.</h3><p>Le Labo reste ton atelier. Les modèles servent à produire, tester, comparer et contrôler. Les faits verrouillés, les décisions éditoriales et la relation client restent entre les mains de l’équipe humaine.</p></div>'+
      '<div class="grid">'+
        homeCard('✍️','GhostWriting','Idée → synopsis → plan → chapitres → cohérence. Les faits verrouillés sont injectés dans chaque demande IA.','ghost','Nouveau livre')+
        homeCard('🎧','Studio Livre Audio','Aperçu gratuit dans le navigateur, puis production réelle avec Google Cloud Text-to-Speech.','audio','Nouveau livre audio')+
        homeCard('🎮','Architecte NyXia Game','Idée → structure jouable → personnages → règles → matériel → médias → contrôle → package. RPG, ACE, soirées, enquêtes et histoires interactives.','game','Créer un jeu')+
        homeCard('🎲','Meurtre & Mystère','Bible Maîtresse, contrôle de solvabilité, dossiers et variantes pour les enquêtes verrouillées.','mystery','Ouvrir')+
        homeCard('🗺️','Cartographie & Mondes','Azgaar devient la vérité géographique : seed verrouillée, villes, États, rivières, routes et exports .map / JSON / SVG / PNG.','maps','Créer une carte')+
        homeCard('🎨','Création visuelle','Retrouve les moteurs déjà présents dans le Labo pour couvertures, personnages et scènes.','visual','Ouvrir')+
        homeCard('🎬','Vidéo','Bandes-annonces, teasers, scènes courtes et messages fictifs en réutilisant les outils existants.','video','Ouvrir')+
        homeCard('🧪','Modèles & API','Comparer les modèles, outils API personnalisés, banques et fournisseurs avant intégration portail.','models','Ouvrir')+
      '</div>'+
      '<div class="section-title"><div><h3>Projets récents</h3><p>Stockés dans HUB_CONFIG, donc disponibles à l’équipe sur le Labo.</p></div></div>'+
      '<div class="card">'+(recent?'<table class="recent"><tr><th>Atelier</th><th>Projet</th><th>Modifié</th><th></th></tr>'+recent+'</table>':'<p>Aucun projet Atelier pour l’instant.</p>')+'</div>'
  }

  function gameImportHeadingInfo(line){
    var raw=String(line||'').trim(),level=0,title=raw
    var m=raw.match(/^(#{1,6})\s+(.+)$/)
    if(m){level=m[1].length;title=m[2].trim()}
    else if(/^([IVXLCDM]+\.|\d+[.)])\s+.+/i.test(raw)||(/^[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŒ0-9][A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŒ0-9 '\-—–:()]{4,120}$/.test(raw)&&raw.length<130)){level=1}
    else if(/^(ACTE|PHASE|ÉPISODE|EPISODE|SCÈNE|SCENE|FIN|FINALE|QUÊTE|QUETE|ÉVÉNEMENT|EVENEMENT|EMBRANCHEMENT|CLIFFHANGER|ÉPILOGUE|EPILOGUE|PERSONNAGE|PERSONNAGES|PNJ|NPC|CASTING|HÉROS|HEROS|HÉROÏNE|HEROINE|FACTION|FACTIONS|CRÉATURE|CREATURE|CRÉATURES|CREATURES|ENNEMI|ENNEMIS|ADVERSAIRE|ADVERSAIRES|BOSS|OBJET|OBJETS|INDICE|INDICES|RÉCOMPENSE|RECOMPENSE|RÉCOMPENSES|RECOMPENSES|LOOT|PROMPT|IMAGE|IMAGES|VISUEL|VISUELS|ILLUSTRATION|ILLUSTRATIONS|PORTRAIT|PORTRAITS|COUVERTURE|COVER|AUDIO|SON|SONS|MUSIQUE|MUSIQUES|VOIX|VIDÉO|VIDEO|VIDÉOS|VIDEOS|CLIP|CLIPS|CARTE|CARTES|MAP|MAPS|BATTLEMAP|BATTLEMAPS)\b/i.test(raw)){level=2}
    else return null
    return {level:level,title:title}
  }
  function gameImportCategory(title,current,endingMode){
    var t=String(title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    if(/\b(prompt(?:s)? (?:graphique|graphiques|image|images|visuel|visuels)|image|images|graphique|graphiques|visuel|visuels|illustration|illustrations|portrait|portraits|token|tokens|couverture|cover|midjourney|dall[- ]?e|imagegen)\b/.test(t))return 'images'
    if(/\b(prompt(?:s)? audio|audio|son|sons|musique|musiques|bruitage|bruitages|voix|tts|ambiance sonore|ambiances sonores)\b/.test(t))return 'audio'
    if(/\b(prompt(?:s)? video|video|videos|clip|clips|cinematique|cinematiques|storyboard|transition|transitions)\b/.test(t))return 'video'
    if(/\b(prompt(?:s)? carte|carte|cartes|map|maps|battlemap|battlemaps|cartographie|azgaar|plan des lieux|plans des lieux)\b/.test(t))return 'maps'
    if(/\b(personnage|personnages|pnj|npc|casting|heros|heroine|protagoniste|protagonistes|antagoniste|antagonistes|fiche personnage|fiches personnages)\b/.test(t))return 'characters'
    if(/\b(faction|factions|creature|creatures|ennemi|ennemis|adversaire|adversaires|boss|monstre|monstres|bestiaire|clan|clans|guilde|guildes)\b/.test(t))return 'factions'
    if(/\b(objet|objets|indice|indices|recompense|recompenses|loot|artefact|artefacts|relique|reliques|inventaire|tresor|tresors)\b/.test(t))return 'items'
    if(/\b(fin|fins|finale|finales|consequence|consequences|cliffhanger|epilogue|resolution|resolutions)\b/.test(t))return 'endings'
    if(endingMode)return 'endings'
    if(/\b(scene|scenes|quete|quetes|evenement|evenements|embranchement|embranchements|declencheur|declencheurs|moment wow)\b/.test(t))return 'scenes'
    if(/\b(structure|schema|acte|phase|episode|architecture|histoire|synopsis|trame|boucle de jeu|rythme)\b/.test(t))return 'story'
    return current||'story'

  function gameImportSplit(text){
    var lines=String(text||'').replace(/\r\n?/g,'\n').split('\n'),parts={story:[],scenes:[],endings:[],characters:[],factions:[],items:[],images:[],audio:[],video:[],maps:[]},current='story',endingMode=false,block=[]
    function flush(){var val=block.join('\n').trim();if(val&&parts[current])parts[current].push(val);block=[]}
    lines.forEach(function(line){
      var h=gameImportHeadingInfo(line)
      if(h){
        flush()
        var norm=String(h.title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
        if(h.level<=1){
          if(/\b(fin|fins|finale|finales|consequence|consequences|cliffhanger|resolutions?)\b/.test(norm))endingMode=true
          else if(/\b(acte|structure|histoire|architecture|recapitulatif|rythme|personnage|personnages|pnj|casting|faction|factions|creature|creatures|ennemi|ennemis|adversaire|adversaires|objet|objets|indice|indices|recompense|recompenses|media|medias|graphique|visuel|audio|video|carte|cartographie)\b/.test(norm))endingMode=false
        }
        current=gameImportCategory(h.title,current,endingMode)
      }
      block.push(line)
    });flush()
    return {
      story:parts.story.join('\n\n').trim(),
      scenes:parts.scenes.join('\n\n').trim(),
      endings:parts.endings.join('\n\n').trim(),
      characters:parts.characters.join('\n\n').trim(),

  async function gameImportDocx(file){

    var zip=await JSZip.loadAsync(file),entry=zip.file('word/document.xml');if(!entry)throw new Error('DOCX illisible')

  async function pollGameMedia(url,kind,maxAttempts,delay){
    for(var i=0;i<maxAttempts;i++){
      var d=await api(url)
      if(kind==='image'&&d.status==='completed'&&d.output_url)return d.output_url
      if(kind==='audio'&&d.status==='completed'&&d.audio_url)return d.audio_url
      if(kind==='video'&&d.status==='completed'&&d.video_url)return d.video_url
      if(d.status==='failed'||d.status==='error'||d.error)throw new Error(typeof d.error==='string'?d.error:JSON.stringify(d.error||'Échec de génération'))
      await mediaWait(delay)
    }
    throw new Error('Temps d’attente dépassé pour '+kind)
  }

      if(start.output_url)return start.output_url
      if(!start.id)throw new Error('Le moteur image n’a retourné aucun identifiant.')
      return await pollGameMedia('/api/alexya/status?id='+encodeURIComponent(start.id),'image',45,4000)

    var out=await api('/api/generate-image',{method:'POST',body:JSON.stringify({toolId:tool.id,prompt:prompt,aspect_ratio:ratio})})
    var imgs=out.images||[]
    if(!imgs.length)throw new Error('Le moteur image n’a retourné aucune image.')
    return imgs[0]

    var audioTool=tools.find(function(t){return t.id===audioId})
    var videoTool=tools.find(function(t){return t.id===videoId})
    d.mediaImageToolId=imageId;d.mediaAudioToolId=audioId;d.mediaVideoToolId=videoId
    var queue=assets.filter(function(a){return ['image','badge','map','audio','video'].indexOf(a.kind)>=0&&a.status!=='produit'})
    if(!queue.length){alert('Tous les médias du registre sont déjà produits.');return}
    var needImage=queue.some(function(a){return ['image','badge','map'].indexOf(a.kind)>=0})
    var needAudio=queue.some(function(a){return a.kind==='audio'})
    var needVideo=queue.some(function(a){return a.kind==='video'})
    if(needImage&&!imageTool){alert('Aucun moteur image n’est sélectionné/détecté.');return}
    if(needAudio&&!audioTool){alert('Aucun moteur audio n’est sélectionné/détecté.');return}
    if(needVideo&&!videoTool){alert('Aucun moteur vidéo n’est sélectionné/détecté.');return}
    var summary=queue.reduce(function(o,a){o[a.kind]=(o[a.kind]||0)+1;return o},{})
    if(!confirm('NyXia va maintenant produire automatiquement '+queue.length+' média(s) sans quitter cette page. Continuer ?\n\n'+Object.keys(summary).map(function(k){return k+' : '+summary[k]}).join('\n')))return
    var btn=document.getElementById('produce-all-media-btn')
    if(btn){btn.disabled=true;btn.textContent='⏳ Production des médias en cours…'}
    var log=[],done=0,errors=0
    function note(s){log.push(s);mediaProgress(log.join('\n'))}
    note('Production média NyXia démarrée — '+queue.length+' élément(s).')
    for(var i=0;i<queue.length;i++){
      var a=queue[i]
      try{
        note('['+(i+1)+'/'+queue.length+'] '+a.kind+' · '+(a.title||'asset')+'…')
        a.status='production'
        d.productionAssetsJson=JSON.stringify(assets,null,2)
        var url=''
        if(a.kind==='audio')url=await generateGameAudioAsset(a,audioTool,d)
        else if(a.kind==='video')url=await generateGameVideoAsset(a,videoTool,d)
        else url=await generateGameImageAsset(a,imageTool,d)
        a.url=url;a.status='produit';a.generatedAt=new Date().toISOString()
        a.toolId=(a.kind==='audio'?audioTool.id:(a.kind==='video'?videoTool.id:imageTool.id))
        delete a.error
        done++
        note('✅ '+(a.title||a.kind))
      }catch(e){
        a.status='erreur';a.error=e.message||String(e);errors++
        note('⚠ '+(a.title||a.kind)+' — '+a.error)
      }
      d.productionAssetsJson=JSON.stringify(assets,null,2)
      d.mediaProductionLog=log.join('\n')
      markDirty()
      await saveCurrent()
    }
    d.mediaProductionCompletedAt=new Date().toISOString()
    d.productionAssetsJson=JSON.stringify(assets,null,2)
    d.mediaProductionLog=log.join('\n')
    markDirty();await saveCurrent()
    if(btn){btn.disabled=false;btn.textContent='✨ PRODUIRE TOUS LES MÉDIAS DU JEU'}
    renderGame()
    toast('Médias produits : '+done+' · erreurs : '+errors)
  }

  async function buildGuidedScenesJson(force){

    var d=currentProject.data||{}

      try{var existing=parseJsonLoose(d.guidedScenesJson);var arr=Array.isArray(existing)?existing:existing.scenes;if(Array.isArray(arr)&&arr.length)return d.guidedScenesJson}catch(e){}
    }
    var tool=currentAiTool()
    if(!tool)throw new Error('Aucun modèle GPT n’est sélectionné ou disponible.')
    rememberAiModel(tool.id)
    var ctx=JSON.stringify(gameContext(),null,2)
    var schema='{"scenes":[{"id":"scene-01","phase":"Acte / phase","title":"Titre court","durationMinutes":10,"hostInstruction":"Ce que l’animateur fait maintenant, en langage simple","readAloud":"Texte optionnel à lire aux joueurs","playerObjective":"Objectif visible des joueurs","announcement":"Annonce courte optionnelle","completion":"Comment savoir que cette scène est terminée","breakout":{"enabled":false,"instruction":"","teams":[]},"npc":{"enabled":false,"name":"","instruction":""},"dice":{"enabled":true,"instruction":""},"media":{"imageUrl":"","audioUrl":"","videoUrl":"","instruction":""},"clues":[{"id":"clue-01","label":"Nom de l’indice","scope":"all","team":"","text":"Texte envoyé"}]}]}'
    var prompt='Transforme ce DOSSIER DE JEU en CONDUCTEUR GUIDÉ PRÊT À ANIMER. Réponds UNIQUEMENT avec du JSON valide, sans markdown, exactement selon ce schéma : '+schema+'\n\nRÈGLES : 1) couvre toute la soirée dans l’ordre réel; 2) chaque hostInstruction doit dire précisément quoi faire en 1 à 4 phrases, sans jargon technique; 3) l’animateur ne doit pas inventer le jeu pendant la soirée; 4) conserve toutes les mécaniques puissantes prévues (PNJ IA, dés, médias, Breakout Rooms, indices, embranchements) lorsqu’elles sont pertinentes; 5) ne révèle jamais un secret joueur dans playerObjective/readAloud; 6) utilise les URL médias déjà présentes si le dossier en contient, sinon laisse les URL vides; 7) scope d’un indice = "all" ou "team"; 8) garde un public adulte/16+ selon le dossier; 9) respecte strictement Canon et Bible.\n\nDOSSIER :\n'+ctx
    toast('NyXia prépare le conducteur guidé…')
    var res=await api('/api/chat',{method:'POST',body:JSON.stringify({providerId:tool.providerId,model:tool.model,system_prompt:(tool.system_prompt?tool.system_prompt+'\n\n':'')+gamePromptBase(),max_tokens:9000,temperature:0.45,messages:[{role:'user',content:prompt}]})})
    var obj=parseJsonLoose(res.text||'')
    var scenes=Array.isArray(obj)?obj:obj.scenes
    if(!Array.isArray(scenes)||!scenes.length)throw new Error('NyXia n’a pas produit de scènes guidées exploitables')
    currentProject.data.guidedScenesJson=JSON.stringify({scenes:scenes},null,2)
    markDirty();await saveCurrent();renderGame()
    return currentProject.data.guidedScenesJson
  }

  function gamePromptBase(){return 'Tu travailles dans NyXiaLabo avec une équipe humaine qui garde la direction créative. Le projet est 16+ par défaut : mature, immersif, jamais infantilisant. Respecte exactement les niveaux d’intensité demandés. La sensualité peut être forte et romantique sans devenir pornographique explicite. L’horreur peut être sombre et dérangeante selon le niveau choisi. Ne modifie jamais les faits du CANON VERROUILLÉ. Pour les PNJ IA, la Bible + le Canon + l’état du moteur sont l’autorité de vérité : un PNJ peut mentir en personnage mais ne peut pas inventer un nouveau fait canonique, accéder à une connaissance interdite ni modifier l’état du jeu. Ton travail doit produire du matériel réellement jouable et exploitable, pas seulement une belle histoire. Quand une information manque, propose une solution éditoriale au lieu de bloquer.'}

  async function runAIText(system,prompt,lockedToolId){

  function splitAssetLines(txt){
    return String(txt||'').split(/\r?\n/).map(function(line){return line.replace(/^[\-\*\d\.\)\s]+/,'').trim()}).filter(Boolean)
  }
  function buildDefaultProductionAssets(d){
    var out=[],id=1
    function add(kind,title,source,scene,priority,notes){
      out.push({id:'asset-'+(id++),kind:kind,title:title,status:'à produire',sourceField:source||'',scene:scene||'',priority:priority||'moyenne',notes:notes||''})
    }
    if(String(d.imageBriefs||'').trim()){
      var lines=splitAssetLines(d.imageBriefs)
      if(lines.length){
        lines.slice(0,40).forEach(function(line){add('image',line,'imageBriefs','',/priorité\s*[:\-]?\s*haute/i.test(line)?'haute':'moyenne','Brief image')})
      } else {
        add('image','Couverture du jeu','imageBriefs','','haute','Couverture principale')
      }
    }
    if(d.prodAutoTokens!==false){
      add('image','Portraits des personnages joueurs','imageBriefs','','haute','PJ / rôles jouables')
      add('image','Portraits des PNJ principaux','imageBriefs','','haute','PNJ IA')
      add('image','Tokens / pions des personnages et ennemis','imageBriefs','','moyenne','Utilisation plateau / écran')
    }
    if(String(d.audioPlan||'').trim()){
      var alines=splitAssetLines(d.audioPlan)
      if(alines.length){alines.slice(0,30).forEach(function(line){add('audio',line,'audioPlan','','moyenne','Plan audio')})}
      else add('audio','Ambiance principale du jeu','audioPlan','','moyenne','Boucle d’ambiance')
    }
    if(String(d.videoPlan||'').trim()){
      var vlines=splitAssetLines(d.videoPlan)
      if(vlines.length){vlines.slice(0,20).forEach(function(line){add('video',line,'videoPlan','','moyenne','Storyboard vidéo')})}
      else add('video','Clip d’introduction','videoPlan','','moyenne','Ouverture de la partie')
    }
    if(String(d.mapPlan||'').trim()){
      var mlines=splitAssetLines(d.mapPlan)
      if(mlines.length){mlines.slice(0,20).forEach(function(line){add('map',line,'mapPlan','','moyenne','Plan cartographique')})}
      else add('map','Carte principale du jeu','mapPlan','','haute','Carte maître')
    }
    if(d.prodAutoBadges!==false){
      var badges=splitAssetLines(d.playerBadgeCatalog)
      if(badges.length){badges.slice(0,30).forEach(function(line){add('badge',line,'playerBadgeCatalog','','moyenne','Badge joueur')})}
      else add('badge','Jeu initial de badges','playerBadgeCatalog','','moyenne','Badges de progression')
    }
    if(String(d.playerMaterials||'').trim())add('document','Documents joueurs','playerMaterials','','haute','Briefings, fiches, aides')
    if(String(d.hostMaterials||'').trim())add('document','Dossier animateur / MJ','hostMaterials','','haute','Conducteur complet')
    return out
  }

    var lockedToolId=lockedTool.id

    function stamp(msg){

      var prodBox=Array.from(boxes).find(function(x){return x.textContent&&x.textContent.indexOf('Démarrage de la production')>=0})

    try{

      if(isOn('prodAutoPlayerDocs')){
        stamp('Production du matériel joueurs…')
        d.playerMaterials=await runAIText(sys,'Rédige et structure le matériel destiné aux joueurs : briefing, règles courtes, fiches, cartes, informations secrètes, indices et aides de jeu. Indique clairement quels documents sont individuels ou communs.\n\nDOSSIER:\n'+ctx,lockedToolId)

              af.file(String(ai+1).padStart(3,'0')+'-'+safeName(aa.title||aa.kind)+'.'+ext,ab)
            }

      var blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeName(currentProject.title)+'.nyxgame';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(url)},2500);toast('Package NyXia Game créé ✓')

  function cleanSpeechMarkdown(text){
    var t=String(text||'');
    // Blocs de code / marqueurs de langage : ```md, ```json, etc.
    t=t.replace(/```[a-zA-Z0-9_-]*\s*/g,' ').replace(/```/g,' ');
    // Images Markdown ![alt](url) -> alt
    t=t.replace(/!\[([^\]]*)\]\([^)]+\)/g,'$1');
    // Liens Markdown [texte](url) -> texte
    t=t.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
    // Titres Markdown
    t=t.replace(/^\s{0,3}#{1,6}\s+/gm,'');
    // Citations
    t=t.replace(/^\s*>\s?/gm,'');
    // Listes / puces / checkboxes
    t=t.replace(/^\s*[-*+]\s+\[[ xX]\]\s+/gm,'');
    t=t.replace(/^\s*[-*+]\s+/gm,'');
    t=t.replace(/^\s*\d+[\.\)]\s+/gm,'');
    // Gras, italique, barré, code inline
    t=t.replace(/\*\*([^*]+)\*\*/g,'$1')
       .replace(/__([^_]+)__/g,'$1')
       .replace(/\*([^*]+)\*/g,'$1')
       .replace(/_([^_]+)_/g,'$1')
       .replace(/~~([^~]+)~~/g,'$1')
       .replace(/`([^`]+)`/g,'$1');
    // Tableaux Markdown : enlève les séparateurs et transforme les pipes en pauses
    t=t.replace(/^\s*\|?[\s:|-]+\|?\s*$/gm,' ');
    t=t.replace(/\s*\|\s*/g,', ');
    // HTML simple éventuellement présent
    t=t.replace(/<br\s*\/?>/gi,'. ').replace(/<[^>]+>/g,' ');
    // Entités courantes
    t=t.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,' et ').replace(/&quot;/gi,'"')
       .replace(/&#39;/gi,"'").replace(/&lt;/gi,' ').replace(/&gt;/gi,' ');
    // URLs seules : ne pas lire les adresses complètes
    t=t.replace(/https?:\/\/\S+/gi,'');
    // Nettoyage espaces / répétitions
    t=t.replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'. ').replace(/\.{2,}/g,'. ');
    return t.trim()
  }
  function splitSpeechText(text,maxLen){
    maxLen=maxLen||420;
    var clean=String(text||'').replace(/\s+/g,' ').trim();
    if(!clean)return [];
    var sentences=clean.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[clean],out=[],buf='';
    sentences.forEach(function(s){
      s=s.trim();if(!s)return;
      if((buf+' '+s).trim().length<=maxLen){buf=(buf+' '+s).trim();return}
      if(buf){out.push(buf);buf=''}
      if(s.length<=maxLen){buf=s;return}
      var words=s.split(/\s+/),part='';
      words.forEach(function(w){
        var next=(part+' '+w).trim();
        if(next.length<=maxLen)part=next;
        else{if(part)out.push(part);part=w}
      });
      if(part)buf=part
    });
    if(buf)out.push(buf);
    return out
  }
  function stopAISpeech(){
    aiSpeechStopped=true;aiSpeechQueue=[];aiSpeechIndex=0;
    if('speechSynthesis' in window)window.speechSynthesis.cancel();
    toast('Lecture arrêtée')
  }
  function speakNextAIChunk(){
    if(aiSpeechStopped||aiSpeechIndex>=aiSpeechQueue.length){
      if(!aiSpeechStopped)toast('Lecture terminée ✓');
      return
    }
    var part=aiSpeechQueue[aiSpeechIndex++];
    var u=new SpeechSynthesisUtterance(part);
    u.lang='fr-FR';u.rate=.95;
    var voices=window.speechSynthesis.getVoices()||[];
    // Priorité absolue au français de France. On évite qu'un fr-CA soit choisi
    // simplement parce qu'il apparaît avant dans la liste du navigateur.
    var fr=voices.find(function(v){return /^fr[-_]FR$/i.test(v.lang||'')})||
           voices.find(function(v){return /^fr[-_]FR\b/i.test(v.lang||'')})||
           voices.find(function(v){
             return /^fr\b/i.test(v.lang||'') && /france|français \(france\)|francais \(france\)/i.test((v.name||'')+' '+(v.lang||''))
           })||
           voices.find(function(v){return /^fr\b/i.test(v.lang||'') && !/^fr[-_]CA$/i.test(v.lang||'')});
    if(fr){u.voice=fr;u.lang='fr-FR'}
    else{
      u.lang='fr-FR';
      toast('Aucune voix Français (France) installée : le navigateur utilisera sa voix fr-FR par défaut.')
    }
    u.onend=function(){setTimeout(speakNextAIChunk,80)};
    u.onerror=function(e){
      aiSpeechStopped=true;
      toast('Lecture impossible : '+(e.error||'erreur du navigateur'));
    };
    window.speechSynthesis.speak(u)
  }
  function speakAI(){
    var text=cleanSpeechMarkdown(String(lastAI&&lastAI.text||''));
    if(!text){toast('Aucun texte à écouter');return}
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
      toast('La lecture vocale n’est pas disponible dans ce navigateur');return
    }
    window.speechSynthesis.cancel();
    aiSpeechStopped=false;
    aiSpeechQueue=splitSpeechText(text,420);
    aiSpeechIndex=0;
    if(!aiSpeechQueue.length){toast('Aucun texte à écouter');return}
    toast('🔊 Lecture du personnage…');
    setTimeout(speakNextAIChunk,120)
  }

  function retryAI(){if(lastAI.prompt)runAI(lastAI.system,lastAI.prompt,lastAI.target)}
  function pdfAI(){if(!window.jspdf)return;var doc=new window.jspdf.jsPDF(),y=20,lines=doc.splitTextToSize(lastAI.text,175);doc.setFontSize(15);doc.text(currentProject?currentProject.title:'NyXiaLabo',18,y);y+=10;doc.setFontSize(11);lines.forEach(function(l){if(y>280){doc.addPage();y=20}doc.text(l,18,y);y+=6});doc.save(safeName(currentProject?currentProject.title:'nyxialabo')+'-'+Date.now()+'.pdf')}
  function applyAITo(field){if(!currentProject||!field)return;if(!confirm('Remplacer le contenu du champ « '+field+' » par cette proposition ?'))return;setData(field,lastAI.text);if(currentView==='ghost')renderGhost();if(currentView==='game')renderGame();toast('Proposition appliquée')}
  function parseJsonLoose(txt){var t=String(txt||'').trim().replace(/^```json\s*/i,'').replace(/```$/,'').trim();return JSON.parse(t)}
  function applyMysteryProposal(){try{var obj=parseJsonLoose(lastAI.text),keys=['murderer','motive','method','timeline','secrets','relationships','trueClues','redHerrings','solution'];keys.forEach(function(k){if(obj[k]!=null)currentProject.data[k]=String(obj[k])});markDirty();renderMystery();toast('Bible appliquée — tu peux maintenant la verrouiller')}catch(e){alert('La réponse n’est pas un JSON exploitable. Copie-la ou réessaie avec le bouton ↺.') }}
  function saveDeliverable(type){currentProject.data.deliverables=currentProject.data.deliverables||{};currentProject.data.deliverables[type]=lastAI.text;markDirty();toast('Livrable conservé dans le projet')}

  window.addEventListener('beforeunload',function(){audioUrls.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});if(cartoPreviewUrl)try{URL.revokeObjectURL(cartoPreviewUrl)}catch(e){}})
  boot()
