<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <title>NyXiaLabo — Atelier Équipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{
      --night:#060A18;--night2:#0c1229;--panel:#111a38;--panel2:#151f46;
      --violet:#7B5CFF;--lav:#A78BFA;--gold:#F4C56A;--text:#F7F4FF;--muted:#A7ADCC;
      --line:rgba(167,139,250,.16);--green:#35d69a;--red:#ff7188;--shadow:0 22px 65px rgba(0,0,0,.34)
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--text);font-family:Outfit,sans-serif}
    body{background:radial-gradient(circle at 18% 0%,rgba(123,92,255,.18),transparent 34%),radial-gradient(circle at 88% 20%,rgba(244,197,106,.08),transparent 28%),var(--night)}
    button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}
    aside{position:sticky;top:0;height:100vh;padding:20px 16px;background:rgba(6,10,24,.92);border-right:1px solid var(--line);backdrop-filter:blur(18px);overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#4b6cff);box-shadow:0 0 34px rgba(123,92,255,.45);font-size:21px}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--gold);margin-top:2px}
    .nav-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#606a94;font-weight:800;margin:18px 10px 7px}.nav-btn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:rgba(123,92,255,.12);border-color:rgba(123,92,255,.25);color:#fff}.nav-btn .ico{width:24px;text-align:center}.back{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
    main{min-width:0}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(6,10,24,.64);backdrop-filter:blur(15px);position:sticky;top:0;z-index:20}.topbar h2{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0;background:linear-gradient(120deg,#fff,var(--lav),var(--gold));-webkit-background-clip:text;color:transparent}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}.status.warn{color:var(--gold)}
    .tts-tools{display:flex;align-items:center;gap:12px;min-width:0}.tts-tools .status{max-width:340px;overflow-wrap:anywhere}.tts-tools .btn{white-space:nowrap}.content{padding:26px;max-width:1450px;margin:auto}.hero{padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(123,92,255,.13),rgba(244,197,106,.04));box-shadow:var(--shadow)}.hero h3{font-family:'Cormorant Garamond',serif;font-size:34px;margin:0 0 6px}.hero p{max-width:850px;color:var(--muted);line-height:1.65;margin:0}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(244,197,106,.25);background:rgba(244,197,106,.07);color:#f8d995;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;margin-bottom:13px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.card{background:rgba(17,26,56,.78);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.18)}.card h4{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}.card .bigico{font-size:28px;margin-bottom:10px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn{border:1px solid rgba(123,92,255,.28);background:rgba(123,92,255,.10);color:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;font-size:12px;font-weight:700}.btn:hover{background:rgba(123,92,255,.2)}.btn.primary{border:none;background:linear-gradient(135deg,var(--violet),#5a70ff);box-shadow:0 8px 25px rgba(123,92,255,.25)}.btn.gold{border-color:rgba(244,197,106,.28);background:rgba(244,197,106,.09);color:#ffe6a6}.btn.danger{border-color:rgba(255,113,136,.28);background:rgba(255,113,136,.08);color:#ff9cab}.btn:disabled{opacity:.5;cursor:not-allowed}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 12px}.section-title h3{margin:0;font-size:20px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:18px}.panel{background:rgba(17,26,56,.82);border:1px solid var(--line);border-radius:18px;padding:18px}.panel h4{margin:0 0 14px}.field{margin-bottom:13px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#7f89b7;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:rgba(6,10,24,.55);border:1px solid rgba(167,139,250,.2);border-radius:11px;color:#fff;padding:10px 12px;outline:none}.field textarea{min-height:95px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(123,92,255,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row.three{grid-template-columns:1fr 1fr 1fr}.muted{color:var(--muted);font-size:12px}.tiny{font-size:11px;color:#6e789f}.locked{border-color:rgba(244,197,106,.35)!important;background:rgba(244,197,106,.04)!important}.tools-line{display:flex;gap:8px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:16px 0}
    .projectbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.projectbar select{max-width:380px;background:rgba(6,10,24,.65);border:1px solid var(--line);color:#fff;padding:9px 12px;border-radius:10px}.save-state{font-size:11px;color:var(--muted)}
    .result{min-height:160px;background:rgba(6,10,24,.5);border:1px solid rgba(167,139,250,.16);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.6;color:#eef0ff;overflow:auto}.result.empty{display:grid;place-items:center;color:#606b94}.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions button{border:0;background:transparent;color:#8992b8;cursor:pointer;font-size:12px;padding:3px}.result-actions button:hover{color:#fff}.applybar{margin-top:10px;display:flex;gap:8px;align-items:center}.applybar select{max-width:230px}
    .recent{width:100%;border-collapse:collapse}.recent td,.recent th{padding:10px;border-bottom:1px solid rgba(167,139,250,.08);text-align:left;font-size:12px}.recent th{color:#68739e;text-transform:uppercase;font-size:10px}.kind{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--lav)}
    .chapter{border:1px solid rgba(167,139,250,.14);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(6,10,24,.32)}.chapter-head{display:flex;gap:8px;align-items:center}.chapter-head input{flex:1}.chapter textarea{margin-top:9px;min-height:120px}.chapter.selected{border-color:rgba(244,197,106,.38);box-shadow:inset 0 0 0 1px rgba(244,197,106,.08)}.audio-box{margin-top:10px;padding:10px;border-radius:12px;background:rgba(6,10,24,.45);border:1px solid var(--line)}audio{width:100%;margin-top:7px}
    .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:10px;border-radius:11px;background:rgba(6,10,24,.4);border:1px solid var(--line);font-size:12px}.check.ok{border-color:rgba(53,214,154,.26);color:#9bf0d0}.check.bad{border-color:rgba(255,113,136,.26);color:#ffb4c1}.lockline{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:rgba(244,197,106,.06);border:1px solid rgba(244,197,106,.2);color:#f5d890;font-size:12px}
    .tool-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool-pill{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(6,10,24,.35);font-size:12px;color:var(--muted)}
    .game-tabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.game-tab{border:1px solid var(--line);background:rgba(6,10,24,.42);color:var(--muted);border-radius:999px;padding:8px 11px;cursor:pointer;font-size:11px;font-weight:800}.game-tab.active{background:rgba(123,92,255,.18);border-color:rgba(123,92,255,.45);color:#fff;box-shadow:0 0 24px rgba(123,92,255,.10)}
    .game-meter{display:grid;grid-template-columns:140px 1fr 34px;gap:10px;align-items:center;margin:8px 0}.game-meter span{font-size:11px;color:var(--muted)}.game-meter input[type=range]{width:100%;accent-color:var(--violet)}.game-meter b{text-align:center;color:var(--gold);font-size:12px}
    .game-status-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}.game-status{border:1px solid var(--line);background:rgba(6,10,24,.34);border-radius:12px;padding:10px;font-size:11px;color:var(--muted)}.game-status strong{display:block;color:#fff;margin-bottom:4px}.game-status.ready{border-color:rgba(53,214,154,.25)}.game-status.ready strong{color:#9bf0d0}.game-kicker{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.7px;text-transform:uppercase}.game-note{padding:11px 12px;border-radius:12px;border:1px solid rgba(244,197,106,.18);background:rgba(244,197,106,.05);color:#f0d89c;font-size:12px;line-height:1.5;margin-bottom:12px}.game-stack{display:grid;gap:10px}.game-file-list{font-size:11px;color:var(--muted);line-height:1.6}.quick-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-4px 0 16px}.quick-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:auto;min-height:0;padding:11px 16px;border-radius:14px;border:1px solid rgba(123,92,255,.26);background:linear-gradient(135deg,rgba(123,92,255,.24),rgba(90,112,255,.18));color:#fff;cursor:pointer;font-size:12px;font-weight:800;line-height:1.25;box-shadow:0 12px 28px rgba(123,92,255,.18),inset 0 1px 0 rgba(255,255,255,.06)}.quick-btn:hover{transform:translateY(-1px);background:linear-gradient(135deg,rgba(123,92,255,.36),rgba(90,112,255,.24))}.quick-btn .emoji{font-size:14px}.quick-btn.audio{border-color:rgba(167,139,250,.28)}.quick-btn.video{border-color:rgba(244,197,106,.24);background:linear-gradient(135deg,rgba(123,92,255,.22),rgba(244,197,106,.12))}.quick-btn.map{border-color:rgba(53,214,154,.24);background:linear-gradient(135deg,rgba(123,92,255,.18),rgba(53,214,154,.10))}    .live-console{border:1px solid rgba(53,214,154,.22);background:linear-gradient(135deg,rgba(53,214,154,.055),rgba(123,92,255,.05));border-radius:16px;padding:14px;margin-top:14px}.live-code{font-family:monospace;font-size:27px;letter-spacing:5px;color:var(--gold);font-weight:900}.live-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.live-box{border:1px solid var(--line);background:rgba(6,10,24,.38);border-radius:12px;padding:11px}.live-box h5{margin:0 0 8px;font-size:12px;color:#fff}.live-players{display:grid;gap:7px}.live-player{display:grid;grid-template-columns:1fr 150px;gap:8px;align-items:center;padding:8px;border-radius:10px;background:rgba(6,10,24,.44);border:1px solid rgba(167,139,250,.1)}.live-log{max-height:300px;overflow:auto;display:grid;gap:6px}.live-log-row{font-size:11px;line-height:1.45;padding:7px 8px;border-radius:9px;background:rgba(6,10,24,.4);border:1px solid rgba(167,139,250,.08)}.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;box-shadow:0 0 10px rgba(53,214,154,.5)}.live-link{word-break:break-all;color:var(--lav);font-size:11px}.live-preview{border:1px dashed rgba(244,197,106,.25);padding:10px;border-radius:11px;color:var(--muted);font-size:11px}

    @media(max-width:850px){.live-grid{grid-template-columns:1fr}.live-player{grid-template-columns:1fr}.game-status-grid{grid-template-columns:1fr 1fr}.game-meter{grid-template-columns:110px 1fr 30px}}

    .toast{position:fixed;right:22px;bottom:22px;z-index:99;background:#111a38;color:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 14px;border-radius:12px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}

    .map-preview{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(6,10,24,.48);min-height:180px;display:grid;place-items:center;overflow:auto}.map-preview img{max-width:100%;height:auto;border-radius:10px;display:block}.file-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.file-btn{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(123,92,255,.07);color:#fff;cursor:pointer;text-align:center;font-size:12px}.file-btn:hover{background:rgba(123,92,255,.16)}@media(max-width:850px){.file-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.shell{grid-template-columns:220px 1fr}.row.three{grid-template-columns:1fr 1fr}}
    @media(max-width:720px){.topbar{height:auto;min-height:66px;gap:10px;flex-wrap:wrap;padding:10px 16px}.tts-tools{flex-wrap:wrap}.shell{display:block}aside{position:relative;width:100%;height:auto}.grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}.row,.row.three{grid-template-columns:1fr}.tool-list{grid-template-columns:1fr}}

    /* Classement des projets — données conservées dans les routes Atelier existantes. */
    .game-tab.concept-complete{border-color:rgba(53,214,154,.55);color:#9bf0d0;background:rgba(53,214,154,.09)}
    .concept-approved{border:1px solid rgba(53,214,154,.4);color:#b9f6df;background:rgba(53,214,154,.08);padding:12px;border-radius:12px;margin:12px 0}
    .classement-trigger{border-color:rgba(244,197,106,.48);color:#ffe5ac;background:rgba(244,197,106,.12);white-space:nowrap}
    .classement-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
    .classement-controls .field{flex:1 1 215px;margin-bottom:0}
    .classement-controls input,.classement-controls select,.classement-edit input,.classement-edit select{width:100%;background:rgba(6,10,24,.7);border:1px solid var(--line);border-radius:10px;color:#fff;padding:10px}
    .classement-table-wrap{overflow-x:auto}
    .classement-table{width:100%;border-collapse:collapse;min-width:820px}
    .classement-table th,.classement-table td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:12px}
    .classement-table th{color:var(--lav);font-size:11px;white-space:nowrap}
    .classement-name{border:0;background:transparent;color:#fff;text-align:left;font-weight:700;font-size:13px;cursor:pointer;overflow-wrap:anywhere;padding:0}
    .classement-name:hover{text-decoration:underline;color:var(--gold)}
    .classement-actions{display:flex;gap:5px;flex-wrap:wrap;min-width:295px}
    .classement-actions .btn{padding:7px 9px}
    .classement-edit{border:1px solid rgba(244,197,106,.38);border-radius:15px;padding:16px;margin:0 0 18px;background:rgba(244,197,106,.04)}
    .classement-edit-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .classement-pagination{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:15px}
    @media(max-width:720px){.classement-edit-grid{grid-template-columns:1fr}.classement-trigger{order:-1}.classement-actions{min-width:285px}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="orb">🧪</div><div><h1>NyXiaLabo</h1><small>Atelier équipe humaine + IA</small></div></div>
    <div class="nav-label">Atelier</div>
    <button class="nav-btn active" data-view="home" onclick="showView('home')"><span class="ico">🏠</span>Vue d'ensemble</button>
    <button class="nav-btn" data-view="ghost" onclick="showView('ghost')"><span class="ico">✍️</span>GhostWriting</button>
    <button class="nav-btn" data-view="audio" onclick="showView('audio')"><span class="ico">🎧</span>Studio Livre Audio</button>
    <button class="nav-btn" data-view="game" onclick="showView('game')"><span class="ico">🎮</span>Architecte NyXia Game</button>
    <button class="nav-btn" data-view="mystery" onclick="showView('mystery')"><span class="ico">🎲</span>Meurtre & Mystère</button>
    <button class="nav-btn" data-view="maps" onclick="showView('maps')"><span class="ico">🗺️</span>Cartographie & Mondes</button>
    <button class="nav-btn" data-view="visual" onclick="showView('visual')"><span class="ico">🎨</span>Création visuelle</button>
    <button class="nav-btn" data-view="video" onclick="showView('video')"><span class="ico">🎬</span>Vidéo</button>
    <button class="nav-btn" data-view="models" onclick="showView('models')"><span class="ico">🧪</span>Modèles & API</button>
    <div class="back"><button class="nav-btn" onclick="location.href='/dashboard.html'"><span class="ico">↩</span>Retour au Labo complet</button></div>
  </aside>

  <main>
    <div class="topbar"><h2 id="top-title">Atelier Équipe</h2><div class="tts-tools"><div id="health" class="status">Connexion…</div><button type="button" class="btn" onclick="testGoogleTts()">🔎 Tester Google TTS</button><button type="button" class="btn classement-trigger" onclick="openClassement()">🗂️ Classement</button></div></div><div id="tts-diagnostic" role="status" aria-live="polite" style="display:none;padding:12px 24px;border-bottom:1px solid rgba(167,139,250,.2);font-size:12px;line-height:1.5"></div>
    <div class="content">
      <section id="view-home" class="view"></section>
      <section id="view-classement" class="view hidden"></section>
      <section id="view-ghost" class="view hidden"></section>
      <section id="view-audio" class="view hidden"></section>
      <section id="view-game" class="view hidden"></section>
      <section id="view-mystery" class="view hidden"></section>
      <section id="view-maps" class="view hidden"></section>
      <section id="view-visual" class="view hidden"></section>
      <section id="view-video" class="view hidden"></section>
      <section id="view-models" class="view hidden"></section>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
  var token = sessionStorage.getItem('sandbox_token') || ''
  var allProjects = []
  var classementQuery = ''
  var classementFilter = 'tous'
  var classementPage = 0
  var classementPerPage = 25
  var classementCache = Object.create(null)
  var classementBatchBusy = false
  var classementEditId = ''
  var currentProject = null
  var tools = []
  var aiTools = []
  var currentView = 'home'
  var lastAI = { prompt:'', system:'', toolId:'', text:'', target:'' }
  var saveTimer = null
  var audioUrls = []
  var selectedChapter = 0
  var audioMode = "chapitres"
  var dialogueFocusActor = ""
  var dialogueFocusAct = ""
  var dialogueBusy = false
  var dialogueMp3 = Object.create(null) // URLs temporaires, MP3 à télécharger
  var dialogueProposals = Object.create(null) // suggestions IA, jamais appliquées sans validation
  var dialogueAnalysisBusy = false
  var dialogueImportStatus = ""
  var pendingMysteryProposal = null
  var cartoJob = null
  var cartoPreviewUrl = ''
  var cartoReady = false
  var gameTab = 'concept'
  var gameLivePoll = null
  var gameLiveHostState = null
  var gameLiveHostUrl = ''

  function h(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token } }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }
  function toast(msg){ var e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(function(){e.classList.remove('show')},1800) }
  function kindLabel(k){ return ({ghostwriting:'GhostWriting',audiobook:'Livre Audio','nyxia-game':'NyXia Game',mystery:'Meurtre & Mystère',visual:'Visuel',video:'Vidéo',api:'Modèles & API'})[k]||k }
  function kindIcon(k){ return ({ghostwriting:'✍️',audiobook:'🎧','nyxia-game':'🎮',mystery:'🎲',visual:'🎨',video:'🎬',api:'🧪'})[k]||'🧪' }

  async function api(url, opts){
    opts=opts||{}; opts.headers=Object.assign({},h(),opts.headers||{})
    var r=await fetch(url,opts); var data=await r.json().catch(function(){return {}})
    if(r.status===401){ sessionStorage.removeItem('sandbox_token'); location.href='/login.html'; throw new Error('Session expirée') }
    if(!r.ok) throw new Error(data.error||('HTTP '+r.status))
    return data
  }

  async function boot(){
    if(!token){ location.href='/login.html'; return }
    try{
      var auth=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})}).then(function(r){return r.json()})
      if(!auth.valid){ location.href='/login.html'; return }

  function isClassementArchived(p){return /^(archive|archivé|archived)$/i.test(String(p&&p.status||''))}
  function classementAttr(value){return String(value==null?'':value).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  async function openClassement(){
    // Conserver les changements en cours avant de changer de vue.
    if(saveTimer){clearTimeout(saveTimer);saveTimer=null;if(!(await saveCurrent()))return alert('Enregistre le projet en cours avant de quitter cette page.')}
    try{await reloadIndex();showView('classement')}catch(e){alert('Impossible de charger les projets : '+e.message)}
  }
  function classementMeta(p){
    var cache=classementCache[p.id]
    if(!cache||cache.updatedAt!==p.updatedAt)return null
    return cache
  }
  function classementMode(p){
    if(p.kind!=='nyxia-game')return '—'
    var detail=classementMeta(p)
    return detail?(detail.error?'Indisponible':detail.mode||'Non défini'):'Chargement…'
  }
  function classementType(p){
    if(p.kind!=='nyxia-game')return kindLabel(p.kind)
    var detail=classementMeta(p)
    return detail?(detail.error?'Indisponible':detail.type||'Non défini'):'Chargement…'
  }
  function setClassementQuery(value){var pos=null;try{pos=document.activeElement&&document.activeElement.id==='classement-search'?document.activeElement.selectionStart:null}catch(_){}classementQuery=String(value||'');classementPage=0;renderClassement();var input=document.getElementById('classement-search');if(input){input.focus();if(pos!=null)try{input.setSelectionRange(pos,pos)}catch(_){}}}
  function setClassementFilter(value){classementFilter=value;classementPage=0;renderClassement()}
  function setClassementPage(value){classementPage=Math.max(0,Number(value)||0);renderClassement()}
  function renderClassement(){
    var host=document.getElementById('view-classement');if(!host)return
    var existingEditor=classementEditId&&host.querySelector('#classement-editor .classement-edit')
    var term=classementQuery.trim().toLocaleLowerCase('fr')

      if(classementFilter==='actifs'&&isClassementArchived(p))return false
      if(classementFilter==='archives'&&!isClassementArchived(p))return false
      var detail=classementMeta(p)
      return !term||[p.title,p.client,kindLabel(p.kind),detail&&detail.mode,detail&&detail.type].join(' ').toLocaleLowerCase('fr').includes(term)
    })
    var totalPages=Math.max(1,Math.ceil(filtered.length/classementPerPage))
    classementPage=Math.min(classementPage,totalPages-1)
    var shown=filtered.slice(classementPage*classementPerPage,(classementPage+1)*classementPerPage)
    var archivedCount=(allProjects||[]).filter(isClassementArchived).length
    var rows=shown.map(function(p){

        '<div class="tiny">'+kindIcon(p.kind)+' '+esc(kindLabel(p.kind))+' · '+(archived?'📦 Archivé':'En cours')+' · '+(p.updatedAt?esc(new Date(p.updatedAt).toLocaleDateString('fr-CA')):'—')+'</div></td>'+
        '<td>'+esc(classementMode(p))+'</td><td>'+esc(classementType(p))+'</td><td>'+esc(p.client||'—')+'</td>'+
        '<td><div class="classement-actions">'+
        '<button class="btn" data-id="'+id+'" onclick="duplicateClassement(this.dataset.id)">Dupliquer</button>'+
        '<button class="btn" data-id="'+id+'" onclick="editClassement(this.dataset.id)">Modifier</button>'+
        '<button class="btn danger" data-id="'+id+'" onclick="deleteClassement(this.dataset.id)">Supprimer</button>'+
        '<button class="btn gold" data-id="'+id+'" onclick="archiveClassement(this.dataset.id)">'+(archived?'Restaurer':'Archiver')+'</button>'+

    }).join('')
    host.innerHTML='<div class="hero" style="margin-bottom:18px"><div class="badge">GESTION DES PROJETS</div><h3>🗂️ Classement</h3><p>Retrouve tous les projets du Labo, ouvre-les ou classe-les sans toucher à leur contenu. Archiver est réversible; supprimer est définitif.</p></div>'+
      '<div class="classement-controls">'+
      '<div class="field"><label for="classement-search">Rechercher un projet ou un auteur</label><input id="classement-search" type="search" placeholder="Nom du projet, auteur…" value="'+classementAttr(classementQuery)+'" oninput="setClassementQuery(this.value)"></div>'+
      '<div class="field" style="max-width:220px"><label for="classement-status">Afficher</label><select id="classement-status" onchange="setClassementFilter(this.value)"><option value="tous"'+(classementFilter==='tous'?' selected':'')+'>Tous les projets</option><option value="actifs"'+(classementFilter==='actifs'?' selected':'')+'>Projets actifs</option><option value="archives"'+(classementFilter==='archives'?' selected':'')+'>Archives</option></select></div>'+
      '<span class="muted">'+allProjects.length+' projets · '+archivedCount+' archivés</span></div>'+
      '<div id="classement-editor"></div>'+
      '<div class="card classement-table-wrap">'+(rows?'<table class="classement-table"><thead><tr><th>Nom du projet</th><th>Mode</th><th>Type</th><th>Client (nom auteur)</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p>Aucun projet ne correspond à ce filtre.</p>')+'</div>'+
      '<div class="classement-pagination"><span class="muted">'+filtered.length+' résultat(s) · page '+(classementPage+1)+' sur '+totalPages+'</span><div class="tools-line"><button class="btn"'+(classementPage===0?' disabled':'')+' onclick="setClassementPage(classementPage-1)">← Précédent</button><button class="btn"'+(classementPage>=totalPages-1?' disabled':'')+' onclick="setClassementPage(classementPage+1)">Suivant →</button></div></div>'
    if(existingEditor){var editorSlot=host.querySelector('#classement-editor');if(editorSlot)editorSlot.appendChild(existingEditor)}
    // L'index KV est léger. Charger seulement les détails de la page affichée, au maximum 4 à la fois.
    var missing=shown.filter(function(p){return p.kind==='nyxia-game'&&!classementMeta(p)})
    if(missing.length&&!classementBatchBusy)hydrateClassement(missing)
  }
  async function hydrateClassement(list){
    classementBatchBusy=true
    var cursor=0
    async function one(){
      while(cursor<list.length){
        var p=list[cursor++]
        try{var response=await api('/api/atelier/projects/'+encodeURIComponent(p.id)),project=response.project||{}
          classementCache[p.id]={updatedAt:p.updatedAt,mode:String(project.data?.playMode||''),type:String(project.data?.gameType||''),error:false}
        }catch(e){classementCache[p.id]={updatedAt:p.updatedAt,mode:'',type:'',error:true};console.warn('Classement : détails indisponibles pour un projet',e)}
      }
    }
    try{await Promise.all(Array.from({length:Math.min(4,list.length)},one))}
    finally{classementBatchBusy=false;if(currentView==='classement')renderClassement()}
  }
  async function classementFlushSelected(id){
    if(currentProject&&currentProject.id===id&&saveTimer){
      clearTimeout(saveTimer);saveTimer=null
      if(!(await saveCurrent()))throw new Error('Le projet contient des modifications non enregistrées. Action annulée.')
    }
  }
  async function classementLoad(id){
    await classementFlushSelected(id)

  async function archiveClassement(id){
    try{
      var project=await classementLoad(id),wasArchived=isClassementArchived(project)
      var message=wasArchived?'Restaurer « '+project.title+' » dans les projets actifs ?':'Archiver « '+project.title+' » ? Il ne sera plus dans les listes de travail, mais restera accessible ici.'
      if(!confirm(message))return
      if(wasArchived){project.status=project.classementPreviousStatus||'brouillon';delete project.classementPreviousStatus;delete project.classementArchivedAt}
      else{project.classementPreviousStatus=project.status||'brouillon';project.classementArchivedAt=new Date().toISOString();project.status='archivé'}
      var saved=(await api('/api/atelier/projects/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify(project)})).project
      if(currentProject&&currentProject.id===id)currentProject=saved
      await reloadIndex();classementAfterChange(id);toast(wasArchived?'Projet restauré':'Projet archivé — aucune donnée supprimée')
    }catch(e){alert('Classement impossible : '+e.message)}
  }
  async function deleteClassement(id){
    try{
      var project=await classementLoad(id)
      var validation=prompt('Suppression définitive de « '+project.title+' » et de ses données Atelier. Écris exactement le titre du projet pour confirmer :','')

      await api('/api/atelier/projects/'+encodeURIComponent(id),{method:'DELETE'})

  }

  function bookMarkdownChunk(text,size){
    var result=[],rest=String(text||'').trim(),limit=size||8500;
    while(rest.length){
      if(rest.length<=limit){result.push(rest);break}
      var cut=rest.lastIndexOf('\n',limit);
      if(cut<limit/2)cut=limit;
      result.push(rest.slice(0,cut).trim());rest=rest.slice(cut).trimStart();
    }
    return result;
  }
  async function conceptPdfMarkdown(file){
    if(!window.pdfjsLib){
      await new Promise(function(resolve,reject){
        var sc=document.createElement('script');sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        sc.onload=resolve;sc.onerror=function(){reject(Error('Bibliothèque PDF indisponible. Essaie un DOCX ou un Markdown.'))};document.head.appendChild(sc);
      });
    }
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    var pdf=await pdfjsLib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise,pages=[];
    for(var n=1;n<=pdf.numPages;n++){
      bookStatus('Lecture du PDF : page '+n+' / '+pdf.numPages+'…');
      var pg=await pdf.getPage(n),items=(await pg.getTextContent()).items,lines=[],line='',prev=null;
      for(var it of items){
        if(!it.str)continue;
        var y=it.transform&&it.transform[5],x=it.transform&&it.transform[4];
        if(prev&&(Math.abs((y||0)-(prev.y||0))>2.6||(x!=null&&prev.x!=null&&x<prev.x-5))){if(line.trim())lines.push(line.trim());line=''}
        if(line&&!(line.endsWith(' ')||it.str.startsWith(' ')))line+=' ';
        line+=it.str;
        prev={y:y,x:x};
        if(it.hasEOL){if(line.trim())lines.push(line.trim());line='';prev=null}
      }
      if(line.trim())lines.push(line.trim());
      var body=lines.join('\n').replace(/[ \t]+\n/g,'\n').trim();
      pages.push('<!-- Page '+n+' -->\n\n'+body);
    }
    var markdown=pages.join('\n\n').trim();
    if(markdown.replace(/<!--[^>]*-->/g,'').trim().length<80)throw Error('Ce PDF semble scanné ou sans texte sélectionnable. Aucun texte n’a été inventé : utilise une version avec texte ou DOCX.');
    return markdown;
  }

  async function conceptBookAI(tool,system,question,maxTokens){
    var res=await api('/api/chat',{method:'POST',body:JSON.stringify({providerId:tool.providerId,model:tool.model,system_prompt:system,max_tokens:maxTokens,temperature:0.2,messages:[{role:'user',content:question}]})});

  async function adaptConceptBook(){
    var b=conceptBook;if(!b||b.busy||!currentProject||b.projectId!==currentProject.id||!b.markdown)return;
    var tool=currentAiTool();if(!tool)return alert('Choisis un modèle dans la Table de travail IA à droite.');
    var pieces=bookMarkdownChunk(b.markdown,8500),groups=Math.ceil(pieces.length/8),calls=pieces.length+(groups>1?groups:0)+1;
    if(!confirm('Adapter « '+b.fileName+' » avec '+tool.name+' : environ '+calls+' appels TEXTE susceptibles d’être facturés. Le Markdown original et les cases actuelles restent intacts jusqu’à ta validation. Continuer ?'))return;
    b.busy=true;b.proposal=null;bookStatus('Adaptation : préparation des '+pieces.length+' passages…');
    var projectId=b.projectId,system='Tu adaptes un livre en soirée de jeu. Aucun changement à la trame, aux noms, événements, lieux ni motivations. Distingue FAITS DU LIVRE et PROPOSITIONS DE JEU. Ne fabrique ni scène originale ni fin du roman. Réponds dans la langue du livre.';
    try{
      var notes=[];
      for(var i=0;i<pieces.length;i++){
        if(!currentProject||currentProject.id!==projectId)throw Error('Projet modifié pendant la préparation.');
        bookStatus('Lecture narrative : passage '+(i+1)+' / '+pieces.length+'…');
        notes.push(await conceptBookAI(tool,system,'Extrait '+(i+1)+'/'+pieces.length+'. Retiens les faits, personnages, lieux, scènes dans l’ordre et sources (numéro du passage). Aucun ajout inventé. Notes structurées et concises.\n\n'+pieces[i],2200));
      }

  function gameImportHeadingInfo(line){

    else if(/^([IVXLCDM]+\.|\d+[.)])\s+.+/i.test(raw)||(/^[A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŒ0-9][A-ZÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŒ0-9 '\-—–:()]{4,120}$/.test(raw)&&raw.length<130)){level=1}
    else if(/^(ACTE|PHASE|ÉPISODE|EPISODE|SCÈNE|SCENE|FIN|FINALE|QUÊTE|QUETE|ÉVÉNEMENT|EVENEMENT|EMBRANCHEMENT|CLIFFHANGER|ÉPILOGUE|EPILOGUE|PERSONNAGE|PERSONNAGES|PNJ|NPC|CASTING|HÉROS|HEROS|HÉROÏNE|HEROINE|FACTION|FACTIONS|CRÉATURE|CREATURE|CRÉATURES|CREATURES|ENNEMI|ENNEMIS|ADVERSAIRE|ADVERSAIRES|BOSS|OBJET|OBJETS|INDICE|INDICES|RÉCOMPENSE|RECOMPENSE|RÉCOMPENSES|RECOMPENSES|LOOT|PROMPT|IMAGE|IMAGES|VISUEL|VISUELS|ILLUSTRATION|ILLUSTRATIONS|PORTRAIT|PORTRAITS|COUVERTURE|COVER|AUDIO|SON|SONS|MUSIQUE|MUSIQUES|VOIX|VIDÉO|VIDEO|VIDÉOS|VIDEOS|CLIP|CLIPS|CARTE|CARTES|MAP|MAPS|BATTLEMAP|BATTLEMAPS)\b/i.test(raw)){level=2}
    else return null
    return {level:level,title:title}
  }
  function gameImportCategory(title,current,endingMode){
    var t=String(title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
    if(/\b(prompt(?:s)? (?:graphique|graphiques|image|images|visuel|visuels)|image|images|graphique|graphiques|visuel|visuels|illustration|illustrations|portrait|portraits|token|tokens|couverture|cover|midjourney|dall[- ]?e|imagegen)\b/.test(t))return 'images'
    if(/\b(prompt(?:s)? audio|audio|son|sons|musique|musiques|bruitage|bruitages|voix|tts|ambiance sonore|ambiances sonores)\b/.test(t))return 'audio'
    if(/\b(prompt(?:s)? video|video|videos|clip|clips|cinematique|cinematiques|storyboard|transition|transitions)\b/.test(t))return 'video'
    if(/\b(prompt(?:s)? carte|carte|cartes|map|maps|battlemap|battlemaps|cartographie|azgaar|plan des lieux|plans des lieux)\b/.test(t))return 'maps'
    if(/\b(personnage|personnages|pnj|npc|casting|heros|heroine|protagoniste|protagonistes|antagoniste|antagonistes|fiche personnage|fiches personnages)\b/.test(t))return 'characters'
    if(/\b(faction|factions|creature|creatures|ennemi|ennemis|adversaire|adversaires|boss|monstre|monstres|bestiaire|clan|clans|guilde|guildes)\b/.test(t))return 'factions'
    if(/\b(objet|objets|indice|indices|recompense|recompenses|loot|artefact|artefacts|relique|reliques|inventaire|tresor|tresors)\b/.test(t))return 'items'
    if(/\b(fin|fins|finale|finales|consequence|consequences|cliffhanger|epilogue|resolution|resolutions)\b/.test(t))return 'endings'
    if(endingMode)return 'endings'
    if(/\b(scene|scenes|quete|quetes|evenement|evenements|embranchement|embranchements|declencheur|declencheurs|moment wow)\b/.test(t))return 'scenes'
    if(/\b(structure|schema|acte|phase|episode|architecture|histoire|synopsis|trame|boucle de jeu|rythme)\b/.test(t))return 'story'
    return current||'story'
  }
  function gameImportSplit(text){
    var lines=String(text||'').replace(/\r\n?/g,'\n').split('\n'),parts={story:[],scenes:[],endings:[],characters:[],factions:[],items:[],images:[],audio:[],video:[],maps:[]},current='story',endingMode=false,block=[]
    function flush(){var val=block.join('\n').trim();if(val&&parts[current])parts[current].push(val);block=[]}
    lines.forEach(function(line){
      var h=gameImportHeadingInfo(line)
      if(h){
        flush()
        var norm=String(h.title||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
        if(h.level<=1){
          if(/\b(fin|fins|finale|finales|consequence|consequences|cliffhanger|resolutions?)\b/.test(norm))endingMode=true
          else if(/\b(acte|structure|histoire|architecture|recapitulatif|rythme|personnage|personnages|pnj|casting|faction|factions|creature|creatures|ennemi|ennemis|adversaire|adversaires|objet|objets|indice|indices|recompense|recompenses|media|medias|graphique|visuel|audio|video|carte|cartographie)\b/.test(norm))endingMode=false
        }
        current=gameImportCategory(h.title,current,endingMode)
      }
      block.push(line)
    });flush()
    return {
      story:parts.story.join('\n\n').trim(),
      scenes:parts.scenes.join('\n\n').trim(),
      endings:parts.endings.join('\n\n').trim(),
      characters:parts.characters.join('\n\n').trim(),
      factions:parts.factions.join('\n\n').trim(),
      items:parts.items.join('\n\n').trim(),
      images:parts.images.join('\n\n').trim(),
      audio:parts.audio.join('\n\n').trim(),
      video:parts.video.join('\n\n').trim(),
      maps:parts.maps.join('\n\n').trim()
    }
  }

  async function gameImportDocx(file){

    var zip=await JSZip.loadAsync(file),entry=zip.file('word/document.xml');if(!entry)throw new Error('DOCX illisible')
    var xml=await entry.async('text'),doc=new DOMParser().parseFromString(xml,'application/xml'),paras=[].slice.call(doc.getElementsByTagNameNS('*','p'))
    return paras.map(function(p){
      var txt=[].slice.call(p.getElementsByTagNameNS('*','t')).map(function(t){return t.textContent||''}).join('')
      if(!txt.trim())return ''
      var styles=[].slice.call(p.getElementsByTagNameNS('*','pStyle')),style=styles[0]?styles[0].getAttributeNS('http://schemas.openxmlformats.org/wordprocessingml/2006/main','val')||styles[0].getAttribute('w:val')||styles[0].getAttribute('val')||'':''

  async function gameReadImportFile(file){

  }

  function visualDirectionFromCurrentGame(d){
    // Ne jamais récupérer une référence ACE ou une direction provenant d'un autre projet.
    var raw=String(d.imageBriefs||'').trim()
    if(!raw)return ''
    var lines=raw.split(/\r?\n/),title=/(direction artistique|charte visuelle|style visuel|références? visuelles?|cohérence visuelle)/i
    var start=lines.findIndex(function(line){return title.test(line)&&!assetCodeFromTitle(line)})
    if(start<0){
      start=lines.findIndex(function(line){return line.trim()&&!assetCodeFromTitle(line)})
      if(start<0)return ''
      if(!lines.slice(start,Math.min(lines.length,start+3)).join(' ').match(/(style|artist|visuel|ambiance|[eé]poque|photographie|dessin|illustration|palette|couleur|lumi[eè]re|rendu|consigne|coh[eé]rence)/i))return ''
    }
    var kept=[]
    for(var i=start;i<lines.length&&kept.join('\n').length<1600;i++){
      var line=lines[i].trim()
      if(i>start&&assetCodeFromTitle(line))break
      if(i>start&&/^#{1,5}\s/.test(line)&&kept.length>0&&!title.test(line))break
      if(line&&!/^\|?\s*(?:code|identifiant)\s*\|/i.test(line))kept.push(line)
    }
    return kept.join('\n').slice(0,1500).trim()
  }
  function mediaIdentitySensitive(a){

    return a.kind==='badge'||/(portrait|personnage|\bpnj\b|\bpj\b|h[eé]ros|h[eé]ro[iï]ne|cr[eé]ature|artefact|objet unique|couverture|blason|embl[eè]me|rune|indice secret|document fictif)/i.test([a.title,a.notes].join(' '))
  }
  function mediaBankQuery(asset){
    var kind=asset&&asset.kind||''
    var explicit=String(asset?.searchTerms||'').trim()
    var original=explicit||String(asset?.title||'').trim()
    var q=original.replace(/\b(?:KV|ID|CH|CON|CR|TOK|OBJ|DOC|BG|MAP|UI|AUD|SFX|MUS|VID|CLIP)[-–][A-Z0-9]+\b/gi,' ')
      .replace(/[|_*#`[\]{}()]/g,' ').replace(/\s+/g,' ').trim()
      .replace(/^(audio|son|sons|ambiance|bruitage|video|vidéo|clip|scene|scène|image|portrait)\s*[:\-–—]?\s*/i,'')
    if(kind==='audio'){
      var normal=(q+' '+String(asset?.notes||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      var sounds=[
        [/porte.*(grinc|couin)|(grinc|couin).*porte/, 'creaking squeaky door'],
        [/porte.*(ouvr|ferm)|(ouvr|ferm).*porte/, 'door opening closing'],
        [/pluie|averse|goutte/, 'rain ambience'],
        [/orage|tonnerre|eclair/, 'thunder storm'],
        [/vent|bourrasque/, 'wind ambience'],
        [/pas.*(couloir|plancher)|marcher|bruit.*pas/, 'footsteps hallway'],
        [/foret|bois|oiseaux/, 'forest birds ambience'],
        [/riv(iere|er)|ruisseau|cascade/, 'stream water ambience'],
        [/feu|cheminee|crepit/, 'fireplace crackling'],
        [/horloge|tic.tac/, 'clock ticking'],
        [/chuchot|murmur/, 'whispering'],
        [/clef|cle.*serrure|verrou/, 'keys lock door'],
        [/pas.*neige|neige.*pas/, 'footsteps snow'],
        [/vague|ocean|mer/, 'ocean waves'],
        [/hibou|chouette/, 'owl hooting'],
        [/chien|aboi/, 'dog barking']
      ]
      for(var entry of sounds){if(entry[0].test(normal))return entry[1]}
    }
    // Ne jamais chercher un titre de roman ou un simple code comme sujet visuel.
    if(kind!=='audio'&&!explicit){
      var title=String(asset?.title||'').replace(/\b(?:KV|ID|CH|CON|CR|TOK|OBJ|DOC|BG|MAP|UI|AUD|SFX|MUS|VID|CLIP)[-–][A-Z0-9]+\b/gi,'').trim()
      var notes=String(asset?.notes||'').split(/[.\n|]/)[0].trim()
      if(title.length<12||/^l[’']?[eé]cho de la lune$/i.test(title))q=notes||''
      else q=title
    }
    return q.slice(0,95)
  }
  function mediaKindFromMime(type,name){
    var t=String(type||'').toLowerCase(),n=String(name||'').toLowerCase()
    if(t.startsWith('image/')||/\.(png|jpg|jpeg|webp|gif|svg)$/.test(n))return 'image'
    if(t.startsWith('video/')||/\.(mp4|webm|mov|m4v)$/.test(n))return 'video'
    if(t.startsWith('audio/')||/\.(mp3|wav|ogg|m4a|aac|flac)$/.test(n))return 'audio'
    return 'other'
  }

  function tokensForMatch(s){
    return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim().split(/\s+/).filter(function(x){return x&&x.length>2})
  }
  function matchScore(a,b){
    var A=tokensForMatch(a),B=tokensForMatch(b),setB={}
    B.forEach(function(x){setB[x]=1})
    var score=0
    A.forEach(function(x){if(setB[x])score++})
    return score
  }
  function assetCodeFromTitle(title){
    var m=String(title||'').toUpperCase().match(/\b((?:KV|ID|CH|CON|CR|TOK|OBJ|DOC|BG|MAP|UI|AUD|SFX|MUS|VID|CLIP)[-–][A-Z0-9]+)\b/)
    return m?m[1].replace('–','-'):''
  }
  function mediaSemanticTokens(value){
    var stop=new Set(['image','images','audio','son','sons','fichier','photo','video','videos','scene','scenes','fond','pour','avec','dans','une','des','les','the','and','background','asset','nyxia','jeu','game','personnage','ambiance','visuel','effet','effets'])
    return [...new Set(tokensForMatch(String(value||'').replace(/\b(?:KV|ID|CH|CON|CR|TOK|OBJ|DOC|BG|MAP|UI|AUD|SFX|MUS|VID|CLIP)[-–][A-Z0-9]+\b/gi,' ')).filter(function(t){return !stop.has(t) && t.length>=4}))]
  }
  function ownMediaCandidates(asset,d){
    var code=String(asset.code||assetCodeFromTitle(asset.title)||'').toUpperCase().replace(/–/g,'-')
    var wanted=['badge','map'].includes(asset.kind)?'image':asset.kind
    var list=(d.userMediaAssets||[]).filter(function(m){return m.kind===wanted})
    var exact=code?list.filter(function(m){
      var hay=(String(m.name||'')+' '+String(m.tags||'')).toUpperCase().replace(/–/g,'-')
      return new RegExp('(?:^|[^A-Z0-9])'+code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:[^A-Z0-9]|$)').test(hay)
    }):[]
    if(exact.length)return exact.map(function(m){return {media:m,score:100,reason:'code exact'}})
    // Sans code, un nom explicite ou des étiquettes précises peuvent suffire.
    // Un seul mot générique et deux fichiers à égalité ne sont PAS un appariement fiable.
    var sought=mediaSemanticTokens((asset.title||'')+' '+(asset.notes||''))
    if(sought.length<2)return []
    return list.map(function(m){
      var words=mediaSemanticTokens((m.name||'')+' '+(m.tags||''))
      var matches=sought.filter(function(t){return words.includes(t)}).length
      return {media:m,score:matches,reason:'mots-clés'}
    }).filter(function(x){return x.score>=2 && x.score>=Math.ceil(Math.min(4,sought.length)*.65)})
      .sort(function(a,b){return b.score-a.score})
  }
  function findUserProvidedAsset(asset,d){
    var matches=ownMediaCandidates(asset,d)
    if(!matches.length)return null
    // Code exact unique ; sinon correspondance sémantique unique ET nettement meilleure.
    if(matches.length===1)return matches[0].media
    return matches[0].score>matches[1].score+1?matches[0].media:null
  }

  async function proposeFreeGameMedia(){
    if(!currentProject||freeSearchRunning)return
    var projectId=currentProject.id
    freeSearchRunning=true;freeSearchStop=false
    var scanned=0,proposed=0,skipped=0,failed=[],limit=8
    try{
      mediaProgress('Démarrage : contrôle du projet et de la direction artistique…')
      await autoAssignOwnMedia(true)
      var unresolved=parseProductionAssets(currentProject.data.productionAssetsJson).filter(function(a){
        return !a.url&&!a.localMediaId&&!a.generatedPreviewUrl&&!Object.prototype.hasOwnProperty.call(gameFreeSuggestions,mediaFreeKey(a.id))
      })
      var queue=[]
      unresolved.forEach(function(a){
        if(a.kind==='map'||mediaSceneKind(a)==='image'&&mediaIdentitySensitive(a)){
          skipped++;return // Le cas unique est revu individuellement, jamais par stock massif.
        }
        if(mediaSceneKind(a)==='image'&&!visualDirectionFromCurrentGame(currentProject.data||{})){skipped++;return}
        queue.push(a)
      })
      var batch=queue.slice(0,limit)
      if(!batch.length){mediaProgress('Aucune recherche automatique pertinente. '+skipped+' sujet(s) particuliers à examiner individuellement. Consulte le tableau ci-dessous.');renderGame();return}
      for(var a of batch){
        if(freeSearchStop||!currentProject||currentProject.id!==projectId)break
        scanned++
        mediaProgress('Recherche '+scanned+'/'+batch.length+' : '+(a.title||a.code||a.id)+' · '+proposed+' média(s) à examiner · 0 $ IA')
        try{proposed+=(await suggestFreeGameMedia(a.id,true)).length}
        catch(e){failed.push((a.code||a.title)+' : '+e.message)}
        if(scanned<batch.length)await mediaWait(180)
      }
      if(currentProject&&currentProject.id===projectId){
        var summary='Recherche : '+scanned+' besoin(s) examinés ; '+proposed+' proposition(s) NON VALIDÉE(S) ; '+skipped+' média(s) narratifs réservés à la recherche individuelle ; '+Math.max(0,queue.length-scanned)+' en attente de la prochaine série. IA payante : 0 $.'+(gameUnsplashUnavailable?' Unsplash 403 : cette banque a été ignorée, Pexels reste utilisable.':'')+(failed.length?' Erreurs : '+failed.slice(0,3).join(' | '):'')
        currentProject.data.mediaProductionLog=summary
        try{await persistMediaProject()}catch(e){summary+=' Sauvegarde du journal impossible : '+e.message}
        renderGame();mediaProgress(summary)
      }
    }catch(e){mediaProgress('Recherche interrompue : '+e.message+' ; aucun achat IA.');alert('Recherche interrompue : '+e.message)}
    finally{freeSearchRunning=false;freeSearchStop=false}
  }

    var scenes=Array.isArray(parsed)?parsed:parsed?.scenes
    if(d.coverUrl===url)d.coverUrl=''

  function isHostedGameMedia(a){return a&&a.status==='produit'&&!a.localMediaId&&/^\/game-media\/[a-zA-Z0-9_-]+\/[a-zA-Z0-9_-]+\//.test(String(a.url||''))}
  function gameMediaReady(a){return isHostedGameMedia(a)&&!!a.mediaVerifiedAt&&(!a.free||a.editorialApproved===true)}
  async function verifyGameMediaForClient(){
    if(!currentProject)throw new Error('Aucun projet ouvert')
    var d=currentProject.data||{},assets=parseProductionAssets(d.productionAssetsJson)
    if(!assets.length)throw new Error('Registre médias vide')
    for(var i=0;i<assets.length;i++){
      var a=assets[i]
      if(!gameMediaReady(a))throw new Error('Média non hébergé et vérifié : '+(a.code||a.title||a.id))
      var head=await fetch(a.url,{method:'HEAD',headers:{'Authorization':'Bearer '+token},cache:'no-store'})
      if(!head.ok||!(Number(head.headers.get('content-length'))>0))throw new Error('Média indisponible pour l’acheteur : '+(a.code||a.title||a.id))
    }
    if(!String(d.coverUrl||'').startsWith('/game-media/'))throw new Error('La couverture doit être hébergée par NyXia Game avant finalisation.')
    var cover=await fetch(d.coverUrl,{method:'HEAD',headers:{'Authorization':'Bearer '+token},cache:'no-store'})
    if(!cover.ok||!String(cover.headers.get('content-type')||'').startsWith('image/'))throw new Error('Couverture inaccessible ou non reconnue comme image.')
    var guide=parseJsonLoose(d.guidedScenesJson||'{}'),scenes=Array.isArray(guide)?guide:guide.scenes
    if(!Array.isArray(scenes)||!scenes.length)throw new Error('Conducteur guidé absent')
    // Un média ciblant précisément une scène doit réellement y être relié :
    // une URL hébergée dans le registre ne suffit pas à rendre un jeu jouable.
    for(var targeted of assets){
      if(!['image','map','badge','audio','video'].includes(targeted.kind))continue
      var referenced=scenes.filter(function(scene){return sceneReferencesAsset(scene,targeted)})
      if(referenced.length&&!referenced.some(function(scene){
        return scene?.media?.[mediaSceneKind(targeted)+'Url']===targeted.url
      }))throw new Error('Média hébergé mais non placé dans sa scène : '+(targeted.code||targeted.title||targeted.id))
    }
    for(var scene of scenes){
      if(!scene?.media)continue
      for(var kind of ['image','audio','video']){
        var url=String(scene.media[kind+'Url']||'').trim()
        if(url&&!url.startsWith('/game-media/'))throw new Error('URL de scène externe non vérifiée : '+(scene.title||scene.id)+' / '+kind)
        if(url){
          var media=await fetch(url,{method:'HEAD',headers:{'Authorization':'Bearer '+token},cache:'no-store'})
          if(!media.ok||!String(media.headers.get('content-type')||'').startsWith(kind+'/'))throw new Error('Média de scène indisponible : '+(scene.title||scene.id)+' / '+kind)
        }
      }
    }
    return true
  }

  var gameMediaPublishing=false

  function mediaSceneKind(a){return a.kind==='audio'?'audio':a.kind==='video'?'video':(['image','map','badge'].includes(a.kind)?'image':'')}
  function sceneReferencesAsset(scene,a){
    var code=String(a.code||assetCodeFromTitle(a.title)||'').toUpperCase()
    if(code){
      var text=[scene.id,scene.title,scene.phase,scene.hostInstruction,scene.media&&scene.media.instruction].filter(Boolean).join(' ').toUpperCase()
      if(new RegExp('(?:^|[^A-Z0-9])'+code.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?:[^A-Z0-9]|$)').test(text))return true
    }
    // L'indication explicite de scène du plan est exploitable sans inventer de correspondance.
    var hint=String(a.scene||'').trim().toLowerCase(),id=String(scene.id||'').trim().toLowerCase(),title=String(scene.title||'').trim().toLowerCase()
    return !!(hint&&((id&&hint===id)||(title&&hint===title)))
  }
  async function placePublishedMediaInScenes(silent){
    if(!currentProject)return {placed:0,ambiguous:0,unplaced:0}
    var d=currentProject.data||{},raw=String(d.guidedScenesJson||'').trim(),guide
    try{guide=parseJsonLoose(raw)}catch(_){guide=null}
    var scenes=Array.isArray(guide)?guide:guide&&guide.scenes
    if(!Array.isArray(scenes)||!scenes.length){
      if(!silent)alert('Conducteur absent : les médias publiés sont conservés, mais aucune scène ne peut encore les recevoir.')
      return {placed:0,ambiguous:0,unplaced:0,noGuide:true}
    }
    var ready=parseProductionAssets(d.productionAssetsJson).filter(gameMediaReady)
    var placed=0,ambiguous=[],used=new Set(),preserved=0
    scenes.forEach(function(scene){
      if(!scene||typeof scene!=='object')return
      scene.media=scene.media&&typeof scene.media==='object'?scene.media:{}
      ;['image','audio','video'].forEach(function(kind){
        var field=kind+'Url',candidates=ready.filter(function(a){return mediaSceneKind(a)===kind&&sceneReferencesAsset(scene,a)})
        if(String(scene.media[field]||'').trim()){
          preserved++;return // Ne jamais écraser une mise en scène choisie par Diane.
        }
        if(candidates.length===1){scene.media[field]=candidates[0].url;used.add(candidates[0].id);placed++}
        else if(candidates.length>1)ambiguous.push(String(scene.title||scene.id||'Scène')+' : '+kind+' ('+candidates.map(function(a){return a.code||a.id}).join(', ')+')')
      })
    })
    if(placed){d.guidedScenesJson=JSON.stringify(guide,null,2);await persistMediaProject()}
    var result={placed:placed,ambiguous:ambiguous.length,unplaced:ready.length-used.size,preserved:preserved}
    currentProject.data.mediaPlacementReport=placed+' média(s) placé(s) par référence exacte ; '+ambiguous.length+' scène(s)/type ambigu(s). Liens existants préservés : '+preserved+'. '+(ambiguous.length?'À départager : '+ambiguous.slice(0,8).join(' | '):'')
    await persistMediaProject()
    if(!silent){renderGame();alert(currentProject.data.mediaPlacementReport)}
    return result
  }

  async function automateGameMediaDelivery(){
    if(!currentProject||gameMediaPublishing)return
    var projectId=currentProject.id
    gameMediaPublishing=true
    clearTimeout(saveTimer)
    var uploaded=0,failed=[],placed={placed:0}
    try{
      await persistMediaProject() // Le serveur doit connaître le registre avant le premier transfert.
      var health=await api('/api/game/media/health')
      if(!health.ok)throw new Error('Stockage R2 non raccordé. Aucune publication effectuée.')
      mediaProgress('Stockage R2 vérifié. Association des fichiers par code exact…')
      // Publier UNIQUEMENT les médias choisis pour une fiche : aucune association automatique au moment de publier.
      var todo=parseProductionAssets(currentProject.data.productionAssetsJson).filter(function(a){return a.status==='local-assigné'&&a.localMediaId&&a.editorialApproved===true})
      if(!todo.length)mediaProgress('Aucun nouveau fichier local à publier. Vérification des scènes…')
      for(var i=0;i<todo.length;i++){
        if(!currentProject||currentProject.id!==projectId)throw new Error('Le projet a changé pendant la publication. Arrêt sans perte.')
        var asset=todo[i],library=currentProject.data.userMediaAssets||[],item=library.find(function(x){return x.id===asset.localMediaId})
        if(!item){failed.push((asset.code||asset.id)+' : fichier source absent du registre');continue}
        var file=await getLocalMedia(projectId+':'+item.id)
        if(!file){failed.push((asset.code||asset.id)+' : fichier absent de ce navigateur');continue}
        mediaProgress('Publication '+(i+1)+'/'+todo.length+' : '+(asset.code||asset.title)+'…')
        try{
          var data=new FormData()
          data.append('projectId',projectId);data.append('assetId',asset.id);data.append('file',file,item.name||'media')
          var response=await fetch('/api/game/media/upload',{method:'POST',headers:{'Authorization':'Bearer '+token},body:data})
          var result=await response.json().catch(function(){return {error:'Réponse serveur invalide'}})
          if(!response.ok||!result.ok||!String(result.url||'').startsWith('/game-media/'))throw new Error(result.error||'Transfert non confirmé')
          var verification=await fetch(result.url,{method:'HEAD',headers:{'Authorization':'Bearer '+token},cache:'no-store'})
          if(!verification.ok||Number(verification.headers.get('content-length'))!==file.size||!String(verification.headers.get('content-type')||'').startsWith(result.kind+'/'))throw new Error('Le fichier ne passe pas la vérification HTTP (URL, taille ou type).')
          var assets=parseProductionAssets(currentProject.data.productionAssetsJson),live=assets.find(function(x){return x.id===asset.id})
          if(!live)throw new Error('Asset supprimé du registre durant le transfert')
          live.url=result.url;live.status='produit';live.mediaVerifiedAt=new Date().toISOString();live.source='Fichier personnel hébergé R2 ('+item.name+')';delete live.localMediaId;delete live.error
          item.url=result.url;item.storage='cloud'
          currentProject.data.productionAssetsJson=JSON.stringify(assets,null,2)
          await persistMediaProject()
          uploaded++
        }catch(e){failed.push((asset.code||asset.id)+' : '+e.message)}
      }
      placed=await placePublishedMediaInScenes(true)
      var all=parseProductionAssets(currentProject.data.productionAssetsJson)
      if(!String(currentProject.data.coverUrl||'').trim()){
        var covers=all.filter(function(a){return gameMediaReady(a)&&mediaSceneKind(a)==='image'&&/couverture|cover|affiche|poster/i.test((a.title||'')+' '+(a.notes||''))})
        if(covers.length===1){currentProject.data.coverUrl=covers[0].url;await persistMediaProject()}
      }
      var hosted=all.filter(gameMediaReady).length,missing=all.filter(function(a){return !gameMediaReady(a)}).length
      var text='Médias hébergés dans ce jeu : '+hosted+'/'+all.length+' ; nouveaux transferts vérifiés : '+uploaded+' ; '+placed.placed+' lien(s) de scène créé(s) ; '+missing+' restant(s).'+(failed.length?' Échecs : '+failed.join(' | '):'')+' Aucun appel de génération IA.'
      currentProject.data.mediaProductionLog=text
      await persistMediaProject();renderGame();mediaProgress(text)
      alert(text+'\n\nLa vente et le rendu sur portailgame.nyxia.top restent à tester avec un compte acheteur. Les médias exigent une session autorisée. Le véritable accès client et la configuration privée de R2 restent à tester après déploiement.')
    }catch(e){
      if(currentProject&&currentProject.id===projectId){currentProject.data.mediaProductionLog='Publication interrompue : '+e.message;try{await persistMediaProject()}catch(_){}}
      renderGame();alert('Publication non validée : '+e.message+'\nLes fichiers et correspondances déjà enregistrés ont été conservés.')
    }finally{gameMediaPublishing=false}
  }

  function mediaWait(ms){return new Promise(function(resolve){setTimeout(resolve,ms)})}
  async function pollGameMedia(url,kind,maxAttempts,delay){
    for(var i=0;i<maxAttempts;i++){
      var d=await api(url)
      if(kind==='image'&&d.status==='completed'&&d.output_url)return d.output_url
      if(kind==='audio'&&d.status==='completed'&&d.audio_url)return d.audio_url
      if(kind==='video'&&d.status==='completed'&&d.video_url)return d.video_url
      if(d.status==='failed'||d.status==='error'||d.error)throw new Error(typeof d.error==='string'?d.error:JSON.stringify(d.error||'Échec de génération'))
      await mediaWait(delay)
    }
    throw new Error('Temps d’attente dépassé pour '+kind)
  }

  function mediaNotebookImportTable(text){
    // Cahier Studio Prompt simple : sections IMAGES / SONS / VIDÉOS et tableau « Scène | Prompt ».
    // Une ligne = UNE fiche et son prompt original ; aucune scène numérotée n'est exigée.
    var simple=[],category='',inside=false
    String(text||'').split(/\r?\n/).forEach(function(line){
      var heading=line.match(/^\s*#{1,5}\s+(.+?)\s*$/)
      if(heading){
        var headingName=heading[1].replace(/[\*`]/g,'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()
        category=/^images?\b/.test(headingName)?'image':/^(sons?|audio|bruitages?)\b/.test(headingName)?'audio':/^(videos?|clips?)\b/.test(headingName)?'video':''
        inside=false;return
      }
      if(!category||!/^\s*\|.*\|\s*$/.test(line))return
      var cells=line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(function(cell){return cell.trim().replace(/\\\|/g,'|').replace(/<br\s*\/?\s*>/gi,'\n')})
      if(cells.length!==2)return
      if(/^(sc[eè]ne|m[eé]dia|nom|titre)$/i.test(cells[0].replace(/[\*`]/g,'').trim())&&/^prompt$/i.test(cells[1].replace(/[\*`]/g,'').trim())){inside=true;return}
      if(!inside||cells.every(function(c){return /^[-:\s]*$/.test(c)}))return
      var label=cells[0].replace(/^\*\*(.*?)\*\*$/,'$1').trim()
      var prompt=cells[1].replace(/^`([\s\S]*)`$/,'$1').trim()
      if(!label||!prompt)return
      var n=simple.length+1,id='media-'+String(n).padStart(3,'0')
      simple.push({id:id,title:label,number:n,characters:[],place:'',action:'',freeImageQuery:category==='image'?prompt.slice(0,160):'',freeSoundQuery:category==='audio'?prompt.slice(0,160):'',freeVideoQuery:category==='video'?prompt.slice(0,160):'',imageBrief:category==='image'?prompt:'',audioBrief:category==='audio'?prompt:'',videoBrief:category==='video'?prompt:'',imagePrompt:category==='image'?prompt:'',videoMovement:category==='video'?prompt:'',imageNeeded:category==='image',audioNeeded:category==='audio',videoNeeded:category==='video',warnings:[],reviewed:false})
    })
    if(simple.length)return simple
    var rows=String(text||'').split(/\r?\n/).filter(function(line){return /^\s*\|.*\|\s*$/.test(line)})
      .map(function(line){return line.trim().replace(/^\||\|$/g,'').split(/(?<!\\)\|/).map(function(cell){return cell.replace(/\\\|/g,'|').replace(/<br\s*\/?\s*>/gi,'\n').replace(/[`*]/g,'').trim()})})
    var header=rows.findIndex(function(row){return row.length>=5&&/sc[eè]ne/i.test(row[0])&&/personnage/i.test(row[1])})
    if(header<0)return []
    var imported=[]
    rows.slice(header+1).forEach(function(row){
      if(row.length<5||row.every(function(cell){return /^[-:\s]*$/.test(cell)}))return
      var index=imported.length+1,number=(row[0].match(/\d+/)||[])[0]||String(index),desc=row[1]||'',q=row[3]||'',imageQuery=(q.match(/`([^`]+)`/)||[])[1]||q.split(/[\n,;]/)[0]||'',soundQuery=q.split(/[\n,;]/).slice(1).join(' ').trim()
      var movement=row[5]||'',prompt=row[4]||'',place=row[2]||''
      imported.push({id:'scene-'+String(number).padStart(3,'0'),title:'Scène '+number,number:index,characters:desc?[{name:desc.split(/[,(]/)[0].trim(),appearance:desc}]:[],place:place,action:'',freeImageQuery:imageQuery.slice(0,160),freeSoundQuery:soundQuery.slice(0,160),freeVideoQuery:'',imageBrief:place,audioBrief:soundQuery,videoBrief:movement,imagePrompt:prompt,videoMovement:movement,imageNeeded:!!prompt,audioNeeded:!!soundQuery,videoNeeded:!!movement,warnings:['Fiche importée : vérifier les descriptions et les droits avant approbation.'],reviewed:false})
    })
    return imported
  }
  async function importMediaNotebook(files){
    if(!currentProject||!files?.length)return
    var file=files[0],projectId=currentProject.id,ext=(file.name.split('.').pop()||'').toLowerCase()
    if(!['json','md','markdown','txt','docx','rtf'].includes(ext))return alert('Cahier accepté : JSON, TXT, MD, DOCX ou RTF. Aucun changement effectué.')
    if(file.size>2*1024*1024)return alert('Cahier supérieur à 2 Mo : aucun fichier importé. Divise le document sans modifier les fiches existantes.')
    try{
      var text=await gameReadImportFile(file)
      if(!currentProject||currentProject.id!==projectId)return alert('Le projet ouvert a changé. Aucun import réalisé.')
      if(!text.trim())return alert('Document vide : aucun changement.')
      var d=currentProject.data||{},parsed=null,scenes=[]
      if(ext==='json'){
        try{parsed=JSON.parse(text)}catch(_){return alert('JSON invalide : aucun changement.')}
        var original=parsed?.projectId
        if(original&&original!==projectId)return alert('Ce cahier appartient à un AUTRE projet ('+original+'). Import refusé pour ne pas mélanger deux histoires.')
        var arr=Array.isArray(parsed)?parsed:parsed?.scenes

        scenes=arr.map(function(x,i){

          var src={id:'scene-'+String(i+1).padStart(3,'0'),title:String(x.title||'Scène '+(i+1))}
          var card=mediaNotebookCleanScene(Object.assign({},x,{imageNeeded:x.imageNeeded===true||!!x.imagePrompt,audioNeeded:x.audioNeeded===true||!!(x.audioBrief||x.freeSoundQuery),videoNeeded:x.videoNeeded===true||!!x.videoMovement}),src,i)
          card.warnings.push('Importée de '+file.name+' : contrôle éditorial requis.');return card
        })
      }else{
        scenes=mediaNotebookImportTable(text)

      var previous=mediaNotebookRead(d)
      if(!confirm('Importer « '+file.name+' » dans CE projet ? '+(scenes.length?scenes.length+' fiche(s) reconnue(s) seront enregistrées et prérempliront les cartes.':'Le document sera conservé comme référence pour compiler les scènes une par une.')+' Les médias déjà associés et les autres onglets seront préservés.'+(previous?' Le cahier existant sera remplacé (mais pas ses médias).':'')))return
      if(scenes.length){
        // Replacing an imported reference is explicitly confirmed above; do not mix old briefs.
        d.mediaImportedNotebookText='';d.mediaImportedNotebookFileName=''
        var book={version:1,projectId:projectId,fingerprint:mediaNotebookFingerprint(mediaNotebookSource(d)),total:scenes.length,nextIndex:scenes.length,scenes:scenes,warnings:[],importedFileName:file.name,createdAt:new Date().toISOString()}
        for(var card of scenes){var outcome=mediaNotebookMergeAssets(d,card);book.warnings.push.apply(book.warnings,outcome.conflicts)}
        d.mediaSceneNotebookJson=JSON.stringify(book,null,2)
      }else{
        if(text.length>50000)return alert('Ce cahier dépasse 50 000 caractères et ne contient pas de tableau de scènes reconnu. Aucun contenu effacé : importe une version structurée par scènes.')
        d.mediaImportedNotebookText=text
        d.mediaImportedNotebookFileName=file.name
        // A previously compiled cahier is preserved until the user deliberately recompiles.
      }
      if(!currentProject||currentProject.id!==projectId)return alert('Projet changé : aucun enregistrement.')
      await persistMediaProject();renderGame()
      mediaNotebookProgress(scenes.length?'Cahier importé : '+scenes.length+' scène(s), cartes média préremplies. Contrôle les propositions avant tout usage.':'Cahier « '+file.name+' » importé comme référence. Clique « Compiler le Cahier Média » pour extraire ses scènes, sans modifier ton histoire.')
    }catch(e){alert('Import du Cahier Média non terminé : '+e.message+' ; aucune génération lancée.')}
  }

  async function buildGuidedScenesJson(force){
    if(!currentProject)throw new Error('Aucun projet ouvert')
    var d=currentProject.data||{}
    if(!force && String(d.guidedScenesJson||'').trim()){
      try{var existing=parseJsonLoose(d.guidedScenesJson);var arr=Array.isArray(existing)?existing:existing.scenes;if(Array.isArray(arr)&&arr.length)return d.guidedScenesJson}catch(e){}
    }
    var tool=currentAiTool()
    if(!tool)throw new Error('Aucun modèle GPT n’est sélectionné ou disponible.')
    rememberAiModel(tool.id)
    var catalog=parseProductionAssets(d.productionAssetsJson).filter(gameMediaReady).map(function(a){return {code:a.code||'',title:a.title||'',scene:a.scene||'',kind:a.kind,url:a.url}})
    var ctx=JSON.stringify(Object.assign({},gameContext(),{publishedMediaCatalog:catalog}),null,2)
    var schema='{"scenes":[{"id":"scene-01","phase":"Acte / phase","title":"Titre court","durationMinutes":10,"hostInstruction":"Ce que l’animateur fait maintenant, en langage simple","readAloud":"Texte optionnel à lire aux joueurs","playerObjective":"Objectif visible des joueurs","announcement":"Annonce courte optionnelle","completion":"Comment savoir que cette scène est terminée","breakout":{"enabled":false,"instruction":"","teams":[]},"npc":{"enabled":false,"name":"","instruction":""},"dice":{"enabled":true,"instruction":""},"media":{"imageUrl":"","audioUrl":"","videoUrl":"","instruction":""},"clues":[{"id":"clue-01","label":"Nom de l’indice","scope":"all","team":"","text":"Texte envoyé"}]}]}'
    var prompt='Transforme ce DOSSIER DE JEU en CONDUCTEUR GUIDÉ PRÊT À ANIMER. Réponds UNIQUEMENT avec du JSON valide, sans markdown, exactement selon ce schéma : '+schema+'\n\nRÈGLES : 1) couvre toute la soirée dans l’ordre réel; 2) chaque hostInstruction doit dire précisément quoi faire en 1 à 4 phrases, sans jargon technique; 3) l’animateur ne doit pas inventer le jeu pendant la soirée; 4) conserve toutes les mécaniques puissantes prévues (PNJ IA, dés, médias, Breakout Rooms, indices, embranchements) lorsqu’elles sont pertinentes; 5) ne révèle jamais un secret joueur dans playerObjective/readAloud; 6) utilise uniquement les URL du publishedMediaCatalog lorsqu’une correspondance scène/asset est explicite (code ou indication précise de scène), préserve toute URL préexistante, sinon laisse les URL vides; 7) scope d’un indice = "all" ou "team"; 8) garde un public adulte/16+ selon le dossier; 9) respecte strictement Canon et Bible.\n\nDOSSIER :\n'+ctx
    toast('NyXia prépare le conducteur guidé…')
    var res=await api('/api/chat',{method:'POST',body:JSON.stringify({providerId:tool.providerId,model:tool.model,system_prompt:(tool.system_prompt?tool.system_prompt+'\n\n':'')+gamePromptBase(),max_tokens:9000,temperature:0.45,messages:[{role:'user',content:prompt}]})})
    var obj=parseJsonLoose(res.text||'')
    var scenes=Array.isArray(obj)?obj:obj.scenes
    if(!Array.isArray(scenes)||!scenes.length)throw new Error('NyXia n’a pas produit de scènes guidées exploitables')
    currentProject.data.guidedScenesJson=JSON.stringify({scenes:scenes},null,2)
    markDirty();await saveCurrent();await placePublishedMediaInScenes(true);renderGame()
    return currentProject.data.guidedScenesJson
  }

  async function regenerateGuidedScenes(){

  }

  async function finalizeAndTestAsBuyer(){
    if(!currentProject)return

    var pending=clientAssets.filter(function(a){return ['image','badge','map','audio','video'].indexOf(a.kind)>=0&&!gameMediaReady(a)})
    var local=clientAssets.filter(function(a){return a.localMediaId})
    var guide=(currentProject.data||{}).guidedScenesJson||'',sceneCount=0
    try{var parsedGuide=parseJsonLoose(guide),sceneList=Array.isArray(parsedGuide)?parsedGuide:parsedGuide.scenes;sceneCount=Array.isArray(sceneList)?sceneList.length:0}catch(e){}
    if(!clientAssets.length||pending.length||local.length||!String((currentProject.data||{}).coverUrl||'').startsWith('/game-media/')||!sceneCount){
      alert('FINALISATION BLOQUÉE : '+pending.length+' média(s) restent sans fichier publié ; '+local.length+' média(s) sont seulement dans TON navigateur. Vérifie aussi la couverture, le registre et les scènes guidées.\n\nUtilise le bouton Médias « Associer, héberger et placer » pour transférer les fichiers sur R2, puis vérifie que la couverture et les scènes pointent vers des URL hébergées. La vente exige encore un test réel sur le site déployé.')
      return
    }
    try{await verifyGameMediaForClient()}catch(e){alert('Vérification livraison médias : '+e.message);return}
    var popup=window.open('about:blank','nyxia-game-client-test')
    if(popup){popup.document.write('<title>NyXia Game</title><body style="background:#060a18;color:white;font-family:sans-serif;padding:40px">Préparation de ta bibliothèque cliente…</body>')}
    try{
      await buildGuidedScenesJson(false)
      await saveCurrent()
      var d=currentProject.data||{}
      var r=await api('/api/atelier/game/test-client',{method:'POST',body:JSON.stringify({projectId:currentProject.id,productId:d.publishedProductId||currentProject.id,title:currentProject.title,subtitle:d.packageSubtitle||'',description:d.packageNotes||d.idea||'',coverUrl:d.coverUrl||'',version:d.productVersion||'1.0',teams:d.liveTeams})})
      currentProject.data.publishedProductId=r.product.id
      markDirty();await saveCurrent();renderGame();toast('Version cliente prête ✓')

    }catch(e){if(popup)popup.close();alert('Finalisation impossible : '+e.message)}
  }

  async function publishGameClient(){
    if(!currentProject)return
    var entries=parseProductionAssets((currentProject.data||{}).productionAssetsJson)
    if(!entries.length||!String((currentProject.data||{}).coverUrl||'').startsWith('/game-media/')||!String((currentProject.data||{}).guidedScenesJson||'').trim()||entries.some(function(a){return ['image','badge','map','audio','video'].indexOf(a.kind)>=0&&(!gameMediaReady(a))})){
      alert('Publication bloquée : médias manquants / locaux, couverture ou conducteur absent. Une archive ZIP exportée ne transfère pas automatiquement les médias au portail client.')
      return
    }
    try{await verifyGameMediaForClient()}catch(e){alert('Publication bloquée : '+e.message);return}
    await saveCurrent()
    var d=currentProject.data||{}
    try{
      var r=await api('/api/atelier/game/publish',{method:'POST',body:JSON.stringify({projectId:currentProject.id,productId:d.publishedProductId||currentProject.id,title:currentProject.title,subtitle:d.packageSubtitle||'',description:d.packageNotes||d.idea||'',coverUrl:d.coverUrl||'',version:d.productVersion||'1.0',teams:d.liveTeams})})
      currentProject.data.publishedProductId=r.product.id
      markDirty();await saveCurrent();renderGame();toast('Version client publiée ✓')
      return r.product
    }catch(e){alert('Publication impossible : '+e.message);throw e}
  }

  async function createGameClientAccess(){
    if(!currentProject)return
    var d=currentProject.data||{}
    if(!d.publishedProductId){
      try{if(!await publishGameClient())return}catch(e){return}
      d=currentProject.data||{}
    }
    try{await verifyGameMediaForClient()}catch(e){alert('Accès client bloqué : '+e.message);return}
    try{
      var r=await api('/api/atelier/game/license',{method:'POST',body:JSON.stringify({productId:d.publishedProductId,email:d.clientTestEmail||'',maxSessionsPerProduct:Number(d.clientSessionLimit)||0,label:'Test '+currentProject.title})})
      currentProject.data.testAccessKey=r.accessKey

    }catch(e){alert('Accès client impossible : '+e.message)}

  function gamePromptBase(){return 'Tu travailles dans NyXiaLabo avec une équipe humaine qui garde la direction créative. Adapte le jeu à l’âge choisi dans le Concept (de 5 ans à 18 ans et plus). Respecte les niveaux d’intensité demandés et n’ajoute aucun contenu inadapté au public sélectionné. La sensualité peut être forte et romantique sans devenir pornographique explicite. L’horreur peut être sombre et dérangeante selon le niveau choisi. Ne modifie jamais les faits du CANON VERROUILLÉ. Si conceptValidation.completed est vrai, le Concept a été déclaré terminé par la créatrice : prends-le comme base pour les étapes suivantes, ne propose une réécriture que si elle te le demande explicitement. Pour les PNJ IA, la Bible + le Canon + l’état du moteur sont l’autorité de vérité : un PNJ peut mentir en personnage mais ne peut pas inventer un nouveau fait canonique, accéder à une connaissance interdite ni modifier l’état du jeu. Ton travail doit produire du matériel réellement jouable et exploitable, pas seulement une belle histoire. Quand une information manque, propose une solution éditoriale au lieu de bloquer.'}

    else if(mode==='pitch'){prompt='Rédige un pitch premium de 180 à 250 mots pour présenter ce jeu, sans jargon technique.\n\nDOSSIER:\n'+ctx;target='packageNotes'}

    else if(mode==='characters'){prompt='Crée le casting nécessaire. Pour chaque personnage/PNJ : rôle, personnalité, objectif, secret, connaissances, relations, façon de parler, évolution possible et ce qu’il ne sait PAS. Pour RPG, ajoute les informations de jeu utiles sans enfermer le projet dans un système tiers précis.\n\nDOSSIER:\n'+ctx;target='characters'}
    else if(mode==='npcbrains'){prompt='Transforme les PNJ existants en acteurs IA structurés. Pour CHAQUE PNJ pertinent, fournis une fiche avec : ID stable, rôle, identité/personnalité, style de dialogue, OBJECTIFS, CE QU’IL SAIT (faits précis), CE QU’IL CROIT (peut être faux), CE QU’IL IGNORE, CONNAISSANCES INTERDITES, SECRETS, conditions/seuils de révélation, relations initiales avec scores -100 à +100, déclencheurs émotionnels, limites de décision et règles anti-canon. Indique clairement quand le PNJ ment volontairement versus quand sa croyance est erronée. Ne donne jamais au PNJ la vérité complète du dossier par défaut.\n\nDOSSIER:\n'+ctx;target='npcIntelligence'}

  async function runAIText(system,prompt,lockedToolId){
    var tool=lockedToolId?aiTools.find(function(t){return t.id===lockedToolId}):currentAiTool();
    if(!tool)throw new Error('Aucun modèle GPT n’est sélectionné ou disponible. Choisis GPT dans la Table de travail IA.');

    var d=await api('/api/chat',{method:'POST',body:JSON.stringify({providerId:tool.providerId,model:tool.model,system_prompt:(tool.system_prompt?tool.system_prompt+'\n\n':'')+system,max_tokens:Math.max(Number(tool.max_tokens)||2500,5000),temperature:(tool.temperature == null ? 0.7 : tool.temperature),messages:[{role:'user',content:prompt}]})});
