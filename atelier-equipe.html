  function splitAssetLines(txt){
    return String(txt||'').split(/\r?\n/).map(function(line){return line.trim()}).filter(Boolean)
  }
  function parseAssetBriefRows(raw,kind,field){
    var out=[],seen={},lines=splitAssetLines(raw)
    lines.forEach(function(line){
      var cells=line.indexOf('|')>=0?line.replace(/^\|/,'').replace(/\|$/,'').split('|').map(function(x){return x.trim()}):[line]
      var first=String(cells[0]||'').replace(/^[*\s\-\d.)]+/,'').trim()
      var code=assetCodeFromTitle(first)
      if(!code||seen[code])return
      // A chapter such as "TOK-01 à TOK-10" is a group brief: keep it as ONE group, not ten paid requests.
      var title=first.replace(/\*\*/g,'').replace(/`/g,'').trim()
      if(title.length>190)title=title.slice(0,190)
      var pr=String(cells[cells.length-1]||'').match(/\bP[0-3]\b/i)
      var priority=pr?pr[0].toUpperCase():'P2'
      var notes=cells.length>2?cells.slice(1,-1).join(' — ').slice(0,1100):''
      var derived=kind
      if(kind==='image'&&/^MAP-/.test(code))derived='map'
      if(kind==='image'&&/^TOK-|^UI-/.test(code))derived='image'
      seen[code]=true
      out.push({id:'asset-'+code,code:code,kind:derived,title:title,status:'à produire',sourceField:field,scene:cells[2]||'',priority:priority,notes:notes})
    })
    return out
  }
  function buildDefaultProductionAssets(d){
    var all=[];
    [['image','imageBriefs'],['audio','audioPlan'],['video','videoPlan'],['map','mapPlan']].forEach(function(p){
      all=all.concat(parseAssetBriefRows(d[p[1]],p[0],p[1]))
    })
    // Reconstituer les cartes du cahier sans altérer les quatre champs créatifs.
    var book=mediaNotebookRead(d)
    if(book&&Array.isArray(book.scenes))book.scenes.forEach(function(scene){all=all.concat(mediaNotebookAssetsFromScene(scene))})
    var seen={}
    return all.filter(function(a){if(seen[a.code])return false;seen[a.code]=true;return true})
  }
  function rebuildProductionAssets(silent){
    if(!currentProject)return
    var d=currentProject.data||{},old=parseProductionAssets(d.productionAssetsJson),next=buildDefaultProductionAssets(d)
    if(!next.length){alert('Aucun asset identifiable par un code (KV-01, CH-01, OBJ-02…). Le registre existant est conservé.');return}
    var kept=0
    next.forEach(function(a){
      var m=old.find(function(x){return (x.code||assetCodeFromTitle(x.title))===a.code && x.kind===a.kind && (x.url||x.localMediaId)})
      if(m){['status','url','localMediaId','userMediaId','source','credit','license','sourceUrl','generatedAt','mediaVerifiedAt','free','editorialApproved','rejectedFreeUrls','searchTerms','selectedToolId','generatedPreviewUrl'].forEach(function(k){if(m[k]!==undefined)a[k]=m[k]});kept++}
    })
    var orphan=old.filter(function(x){return (x.url||x.localMediaId)&&!next.some(function(y){return y.code===(x.code||assetCodeFromTitle(x.title)) && y.kind===x.kind})})
    if(!silent&&!confirm('Réparer le registre : '+next.length+' vrais assets, '+kept+' médias conservés et '+orphan.length+' anciens médias hors registre sauvegardés séparément ? Aucun appel IA.'))return
    d.legacyProducedAssets=(d.legacyProducedAssets||[]).concat(orphan)
    d.productionAssetsJson=JSON.stringify(next,null,2)
    d.productionLog=(String(d.productionLog||'').trim()+'\nRegistre réparé : '+next.length+' lignes réellement identifiées ; '+kept+' médias conservés ; '+orphan.length+' anciens médias archivés.').trim()
    markDirty();renderGame();toast('Registre réparé : '+next.length+' vrais assets · 0 $')
  }

  // Import sans appel IA/TTS : inventaire conservateur des passages qui commencent
  // par une réplique (tiret cadratin/demi-cadratin ou guillemet français).
  // Le bloc original est conservé pour éviter de perdre une phrase lors du nettoyage.
  function dialogueExtractManuscript(source,filename){
    var lines=String(source||'').replace(/\r\n?/g,'\n').split('\n'),out=[],act='Sans acte',chapter='',ambiguousQuotes=0
    var cleanTitle=function(line){return line.replace(/^\s*\\?#{1,6}\s*/,'').replace(/\\([#*_-])/g,'$1').trim()}
    var isOpening=function(line){return /^\s*(?:[—–]\s*\S|«\s*\S)/.test(line)}
    for(var i=0;i<lines.length;i++){
      var line=lines[i],heading=cleanTitle(line),isHeading=/^\s*\\?#{1,6}\s*/.test(line)
      if(isHeading){if(/^acte\b/i.test(heading))act=heading;if(/^chapitre\b/i.test(heading))chapter=heading;continue}
      if(!isOpening(line)){
        // Ces guillemets enchâssés peuvent être des dialogues ou de simples citations.
        if(/«[^»\n]+»/.test(line))ambiguousQuotes++
        continue
      }
      var first=i,parts=[line],j=i+1
      while(j<lines.length&&lines[j].trim()&&!/^\s*\\?#{1,6}\s*/.test(lines[j])&&!isOpening(lines[j])){parts.push(lines[j]);j++}
      var original=parts.join('\n').trim()
      var spoken=original.replace(/^\s*[—–]\s*/,'').replace(/^\s*«\s*/,'').replace(/\s*»\s*$/,'').trim()
      var contextBefore=lines.slice(Math.max(0,first-4),first).filter(function(x){return x.trim()}).join(' ').slice(-700)
      var contextAfter=lines.slice(j,Math.min(lines.length,j+4)).filter(function(x){return x.trim()}).join(' ').slice(0,700)
      // Seule une attribution explicite par nom est acceptée d'emblée;
      // « dit-il/elle » reste inconnu jusqu'à examen humain/IA.
      var speech=original.match(/\b(?:dit|répondit|demanda|murmura|souffla|lança|s'exclama|s’écria|s'écria|confirma|compléta|continua|coupa|corrigea|chuchota|ajouta|ordonna|déclara|annonça|insista|répliqua|protesta|intervint)\s+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÿ'’-]*(?:\s+[A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÿ'’-]*)?)/u)
      var character=speech?speech[1]:''
      // Ces expressions sont des descriptions, pas des noms de personnages.
      if(/^(?:Une|Un|La|Le|Les|Sa|Son|Ses|Des|Ce|Cette|Il|Elle|C'était)$/i.test(character))character=''
      out.push({id:crypto.randomUUID(),character:character,act:act,chapter:chapter,text:spoken,sourceText:original,sourceFile:filename,sourceLine:first+1,sourceKey:filename+'|'+(first+1)+'|'+original,sourceChapter:chapter,contextBefore:contextBefore,contextAfter:contextAfter,needsReview:true})
      i=j-1
    }
    return {entries:out,inlineQuotes:ambiguousQuotes}
  }
  async function importDialogueManuscript(files){
    if(!currentProject||currentProject.kind!=='audiobook'||!files||!files.length)return
    var file=files[0],projectId=currentProject.id

    if(file.size>3*1024*1024){alert('Manuscrit supérieur à 3 Mo : divise-le en actes pour l’import.');return}
    try{
      var raw=await file.text()
      if(!currentProject||currentProject.id!==projectId)return
      var parsed=dialogueExtractManuscript(raw,file.name),rows=currentProject.data.dialogueReplicas=currentProject.data.dialogueReplicas||[]

      parsed.entries.forEach(function(r){if(!known.has(r.sourceKey)){rows.push(r);known.add(r.sourceKey);added++}})
      dialogueFocusActor='';dialogueFocusAct=''
      dialogueImportStatus=added+' réplique(s) relevée(s) · '+(parsed.entries.length-added)+' doublon(s) évité(s) · '+parsed.inlineQuotes+' citation(s) intégrée(s) à la narration à inspecter séparément. Chaque réplique extraite doit être confirmée avant synthèse.'

  }
  // DOCUMENT 1 : format Markdown humain, à éditer puis à remettre au Labo.

  function exportDialogueReviewDocument(){

  // Ne jamais accepter un document étranger : toutes ses répliques doivent référencer
  // un ID de ce projet. Les cas manquants sont indiqués ; aucune suppression silencieuse.
  function dialogueParseReviewedDocument(source){
    var lines=String(source||'').replace(/\r\n?/g,'\n').split('\n'),items=[],current=null,act='Sans acte'
    function finish(){
      if(!current)return
      var body=current.lines.join('\n').trim()
      // Supprimer uniquement les commentaires de provenance générés par le Labo.
      body=body.replace(/\n?<!-- Provenance :[^\n]*-->\s*$/,'').trim()
      current.text=body;delete current.lines;items.push(current);current=null
    }
    lines.forEach(function(line){
      var actMatch=line.match(/^##\s+(.+?)\s*$/)
      if(actMatch){finish();act=actMatch[1];return}
      var heading=line.match(/^###\s+Réplique\s+\d+\s+\[ID:([a-f\d-]{36})\]\s+—\s+Personnage\s*:\s*(.*?)\s*$/i)
      if(heading){finish();current={id:heading[1],character:heading[2]==='À attribuer'?'':heading[2],act:act,lines:[]};return}
      if(current){
        if(/^<!-- Provenance :/.test(line)){current.lines.push(line);return}
        if(/^#{1,3}\s/.test(line))throw new Error('En-tête inattendu dans la réplique '+current.id+'. Conserve le format téléchargé.')
        current.lines.push(line)
      }
    })
    finish()
    return items
  }
  async function importDialogueReviewedDocument(files){
    if(!currentProject||currentProject.kind!=='audiobook'||!files||!files.length)return
    var file=files[0],projectId=currentProject.id
    if(!/\.(md|markdown|txt)$/i.test(file.name)||file.size>3*1024*1024){alert('Importe le document Markdown téléchargé depuis ce projet (maximum 3 Mo).');return}
    try{
      var raw=await file.text();if(!currentProject||currentProject.id!==projectId)return
      var incoming=dialogueParseReviewedDocument(raw),rows=dialogueList(),known=new Map(rows.map(function(r){return [r.id,r]}))
      if(!incoming.length)throw new Error('Aucune ligne « ### Réplique … [ID:…] — Personnage : … » retrouvée. Importe le document 1 téléchargé depuis ce Labo.')
      var seen=new Set(),invalid=[],empty=[],unassigned=[]
      incoming.forEach(function(r){
        if(seen.has(r.id))invalid.push('ID en double : '+r.id)
        else if(!known.has(r.id))invalid.push('ID inconnu : '+r.id)
        else if(!r.text)empty.push(r.id)
        else if(!r.character)unassigned.push(r.id)
        seen.add(r.id)
      })
      if(invalid.length||empty.length)throw new Error([invalid.slice(0,5).join(' ; '),empty.length+' réplique(s) vide(s)'].filter(Boolean).join(' ; '))
      var missing=rows.filter(function(r){return !seen.has(r.id)})
      if(missing.length)throw new Error(missing.length+' réplique(s) absente(s) du document. Retélécharge le document 1 et vérifie que toutes les répliques y figurent ; aucune ligne supprimée automatiquement.')
      if(unassigned.length)throw new Error(unassigned.length+' réplique(s) sans personnage. Remplis chaque champ « Personnage : » avant de lancer la séparation.')
      var msg=incoming.length+' répliques reconnues ; '+missing.length+' du projet absentes du document (elles resteront conservées) ; '+unassigned.length+' personnage(s) à attribuer.\n\nImporter les corrections et créer le regroupement par personnage ?'
      if(!confirm(msg))return
      incoming.forEach(function(r){var original=known.get(r.id);original.text=r.text;original.act=r.act;original.character=r.character;original.needsReview=false;original.reviewedDocument=true;delete dialogueProposals[r.id]})

  async function analyzeDialogueWithNyxia(){
    if(dialogueAnalysisBusy||!currentProject)return
    var items=dialogueList().filter(function(r){return r.sourceText&&r.needsReview})
    if(!items.length){alert('Aucune réplique extraite en attente d’analyse. Importe le manuscrit ou confirme les fiches.');return}
    if(!confirm('NyXia va analyser '+items.length+' répliques par petites séries, via le modèle IA sélectionné. Cela peut entraîner des frais IA, mais aucun Google TTS ne sera lancé. Continuer ?'))return
    var projectId=currentProject.id,done=0,accepted=0,flagged=0
    dialogueAnalysisBusy=true;dialogueImportStatus='Analyse de NyXia en cours…';renderAudio()
    try{
      for(var offset=0;offset<items.length;offset+=10){
        if(!currentProject||currentProject.id!==projectId)throw new Error('Le projet a changé; analyse interrompue.')
        var batch=items.slice(offset,offset+10),names=dialogueActorNames()
        var packet=batch.map(function(r){return {id:r.id,act:r.act,chapter:r.chapter,original:r.sourceText,before:r.contextBefore,after:r.contextAfter,actorHint:r.character||''}})
        dialogueImportStatus='NyXia analyse '+(offset+1)+'–'+Math.min(offset+10,items.length)+' / '+items.length+' répliques…'
        var answer=await runAIText('Tu es NyXia, assistante éditoriale de production audio. Réponds seulement en JSON valide {"entries":[{"id":"identifiant donné","character":"nom exact ou chaîne vide si doute","spokenText":"UNIQUEMENT paroles prononcées"}]}. Traite CHAQUE identifiant UNE FOIS. Respecte absolument l’ordre des mots du paragraphe original; enlève les incises et la narration sans inventer ni reformuler. Si tu ne peux pas isoler les paroles avec certitude, renvoie spokenText identique au texte initial sans le tiret, et character vide si incertain. Identifie le locuteur à partir du contexte; ne déduis jamais une identité à partir du personnage interpellé. Aucun texte supplémentaire.', 'Personnages déjà connus : '+JSON.stringify(names)+'\n\nRépliques et contexte : '+JSON.stringify(packet))
        var parsed=parseDialogueAiJson(answer),proposals=Array.isArray(parsed.entries)?parsed.entries:[],seen=new Set()
        proposals.forEach(function(p){
          if(!p||seen.has(p.id))return
          var row=batch.find(function(x){return x.id===p.id});if(!row)return
          seen.add(p.id)
          var txt=String(p.spokenText||'').trim(),who=String(p.character||'').trim()
          var context=[row.sourceText,row.contextBefore,row.contextAfter,names.join(' ')].join(' ')
          var hasName=who&&(context.toLocaleLowerCase('fr').indexOf(who.toLocaleLowerCase('fr'))>=0||row.character===who)
          if(!txt||!dialogueFaithful(row.sourceText,txt)||new TextEncoder().encode(txt).length>=4300){flagged++;return}
          if(who&&!hasName)who=''
          dialogueProposals[row.id]={character:who,text:txt};accepted++
        })
        done+=batch.length;flagged+=batch.length-seen.size
      }
      dialogueImportStatus='NyXia : '+done+' réplique(s) parcourue(s), '+accepted+' proposition(s) à examiner, '+flagged+' entrée(s) non résolue(s). Les textes originaux et les répliques du projet n’ont pas été remplacés.'
    }catch(e){dialogueImportStatus='Analyse interrompue après '+done+'/'+items.length+' répliques : '+e.message+'. Les propositions déjà reçues restent consultables.'}
    finally{dialogueAnalysisBusy=false;if(currentProject&&currentProject.id===projectId)renderAudio()}
  }

  function cleanSpeechMarkdown(text){
    var t=String(text||'');
    // Blocs de code / marqueurs de langage : ```md, ```json, etc.
    t=t.replace(/```[a-zA-Z0-9_-]*\s*/g,' ').replace(/```/g,' ');
    // Images Markdown ![alt](url) -> alt
    t=t.replace(/!\[([^\]]*)\]\([^)]+\)/g,'$1');
    // Liens Markdown [texte](url) -> texte
    t=t.replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');
    // Titres Markdown
    t=t.replace(/^\s{0,3}#{1,6}\s+/gm,'');
    // Citations
    t=t.replace(/^\s*>\s?/gm,'');
    // Listes / puces / checkboxes
    t=t.replace(/^\s*[-*+]\s+\[[ xX]\]\s+/gm,'');
    t=t.replace(/^\s*[-*+]\s+/gm,'');
    t=t.replace(/^\s*\d+[\.\)]\s+/gm,'');
    // Gras, italique, barré, code inline
    t=t.replace(/\*\*([^*]+)\*\*/g,'$1')
       .replace(/__([^_]+)__/g,'$1')
       .replace(/\*([^*]+)\*/g,'$1')
       .replace(/_([^_]+)_/g,'$1')
       .replace(/~~([^~]+)~~/g,'$1')
       .replace(/`([^`]+)`/g,'$1');
    // Tableaux Markdown : enlève les séparateurs et transforme les pipes en pauses
    t=t.replace(/^\s*\|?[\s:|-]+\|?\s*$/gm,' ');
    t=t.replace(/\s*\|\s*/g,', ');
    // HTML simple éventuellement présent
    t=t.replace(/<br\s*\/?>/gi,'. ').replace(/<[^>]+>/g,' ');
    // Entités courantes
    t=t.replace(/&nbsp;/gi,' ').replace(/&amp;/gi,' et ').replace(/&quot;/gi,'"')
       .replace(/&#39;/gi,"'").replace(/&lt;/gi,' ').replace(/&gt;/gi,' ');
    // URLs seules : ne pas lire les adresses complètes
    t=t.replace(/https?:\/\/\S+/gi,'');
    // Nettoyage espaces / répétitions
    t=t.replace(/[ \t]+/g,' ').replace(/\s*\n\s*/g,'. ').replace(/\.{2,}/g,'. ');
    return t.trim()
  }
  function splitSpeechText(text,maxLen){
    maxLen=maxLen||420;
    var clean=String(text||'').replace(/\s+/g,' ').trim();
    if(!clean)return [];
    var sentences=clean.match(/[^.!?…]+[.!?…]+|[^.!?…]+$/g)||[clean],out=[],buf='';
    sentences.forEach(function(s){
      s=s.trim();if(!s)return;
      if((buf+' '+s).trim().length<=maxLen){buf=(buf+' '+s).trim();return}
      if(buf){out.push(buf);buf=''}
      if(s.length<=maxLen){buf=s;return}
      var words=s.split(/\s+/),part='';
      words.forEach(function(w){
        var next=(part+' '+w).trim();
        if(next.length<=maxLen)part=next;
        else{if(part)out.push(part);part=w}
      });
      if(part)buf=part
    });
    if(buf)out.push(buf);
    return out
  }
  function stopAISpeech(){
    aiSpeechStopped=true;aiSpeechQueue=[];aiSpeechIndex=0;
    if('speechSynthesis' in window)window.speechSynthesis.cancel();
    toast('Lecture arrêtée')
  }
  function speakNextAIChunk(){
    if(aiSpeechStopped||aiSpeechIndex>=aiSpeechQueue.length){
      if(!aiSpeechStopped)toast('Lecture terminée ✓');
      return
    }
    var part=aiSpeechQueue[aiSpeechIndex++];
    var u=new SpeechSynthesisUtterance(part);
    u.lang='fr-FR';u.rate=.95;
    var voices=window.speechSynthesis.getVoices()||[];
    // Priorité absolue au français de France. On évite qu'un fr-CA soit choisi
    // simplement parce qu'il apparaît avant dans la liste du navigateur.
    var fr=voices.find(function(v){return /^fr[-_]FR$/i.test(v.lang||'')})||
           voices.find(function(v){return /^fr[-_]FR\b/i.test(v.lang||'')})||
           voices.find(function(v){
             return /^fr\b/i.test(v.lang||'') && /france|français \(france\)|francais \(france\)/i.test((v.name||'')+' '+(v.lang||''))
           })||
           voices.find(function(v){return /^fr\b/i.test(v.lang||'') && !/^fr[-_]CA$/i.test(v.lang||'')});
    if(fr){u.voice=fr;u.lang='fr-FR'}
    else{
      u.lang='fr-FR';
      toast('Aucune voix Français (France) installée : le navigateur utilisera sa voix fr-FR par défaut.')
    }
    u.onend=function(){setTimeout(speakNextAIChunk,80)};
    u.onerror=function(e){
      aiSpeechStopped=true;
      toast('Lecture impossible : '+(e.error||'erreur du navigateur'));
    };
    window.speechSynthesis.speak(u)
  }
  function speakAI(){
    var text=cleanSpeechMarkdown(String(lastAI&&lastAI.text||''));
    if(!text){toast('Aucun texte à écouter');return}
    if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
      toast('La lecture vocale n’est pas disponible dans ce navigateur');return
    }
    window.speechSynthesis.cancel();
    aiSpeechStopped=false;
    aiSpeechQueue=splitSpeechText(text,420);
    aiSpeechIndex=0;
    if(!aiSpeechQueue.length){toast('Aucun texte à écouter');return}
    toast('🔊 Lecture du personnage…');
    setTimeout(speakNextAIChunk,120)
  }
  async function copyAI(){await navigator.clipboard.writeText(lastAI.text);toast('Copié')}
  function retryAI(){if(lastAI.prompt)runAI(lastAI.system,lastAI.prompt,lastAI.target)}
  function pdfAI(){if(!window.jspdf)return;var doc=new window.jspdf.jsPDF(),y=20,lines=doc.splitTextToSize(lastAI.text,175);doc.setFontSize(15);doc.text(currentProject?currentProject.title:'NyXiaLabo',18,y);y+=10;doc.setFontSize(11);lines.forEach(function(l){if(y>280){doc.addPage();y=20}doc.text(l,18,y);y+=6});doc.save(safeName(currentProject?currentProject.title:'nyxialabo')+'-'+Date.now()+'.pdf')}
  function applyAITo(field){if(!currentProject||!field)return;if(!confirm('Remplacer le contenu du champ « '+field+' » par cette proposition ?'))return;setData(field,lastAI.text);if(currentView==='ghost')renderGhost();if(currentView==='game')renderGame();toast('Proposition appliquée')}
  function parseJsonLoose(txt){var t=String(txt||'').trim().replace(/^```json\s*/i,'').replace(/```$/,'').trim();return JSON.parse(t)}
  function applyMysteryProposal(){try{var obj=parseJsonLoose(lastAI.text),keys=['murderer','motive','method','timeline','secrets','relationships','trueClues','redHerrings','solution'];keys.forEach(function(k){if(obj[k]!=null)currentProject.data[k]=String(obj[k])});markDirty();renderMystery();toast('Bible appliquée — tu peux maintenant la verrouiller')}catch(e){alert('La réponse n’est pas un JSON exploitable. Copie-la ou réessaie avec le bouton ↺.') }}
  function saveDeliverable(type){currentProject.data.deliverables=currentProject.data.deliverables||{};currentProject.data.deliverables[type]=lastAI.text;markDirty();toast('Livrable conservé dans le projet')}

  window.addEventListener('beforeunload',function(){audioUrls.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});if(cartoPreviewUrl)try{URL.revokeObjectURL(cartoPreviewUrl)}catch(e){}})
  boot()
</script>
