<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <link rel="icon" type="image/png" href="/FavIcon.png">
  <title>NyXiaLabo — Atelier Équipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root{
      --night:#060A18;--night2:#0c1229;--panel:#111a38;--panel2:#151f46;
      --violet:#7B5CFF;--lav:#A78BFA;--gold:#F4C56A;--text:#F7F4FF;--muted:#A7ADCC;
      --line:rgba(167,139,250,.16);--green:#35d69a;--red:#ff7188;--shadow:0 22px 65px rgba(0,0,0,.34)
    }
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--night);color:var(--text);font-family:Outfit,sans-serif}
    body{background:radial-gradient(circle at 18% 0%,rgba(123,92,255,.18),transparent 34%),radial-gradient(circle at 88% 20%,rgba(244,197,106,.08),transparent 28%),var(--night)}
    button,input,textarea,select{font:inherit}.hidden{display:none!important}
    .shell{min-height:100vh;display:grid;grid-template-columns:270px 1fr}
    aside{position:sticky;top:0;height:100vh;padding:20px 16px;background:rgba(6,10,24,.92);border-right:1px solid var(--line);backdrop-filter:blur(18px);overflow:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px}.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#4b6cff);box-shadow:0 0 34px rgba(123,92,255,.45);font-size:21px}.brand h1{font-size:17px;margin:0}.brand small{display:block;color:var(--gold);margin-top:2px}
    .nav-label{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:#606a94;font-weight:800;margin:18px 10px 7px}.nav-btn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:12px;padding:11px 12px;display:flex;gap:10px;align-items:center;text-align:left;cursor:pointer;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:rgba(123,92,255,.12);border-color:rgba(123,92,255,.25);color:#fff}.nav-btn .ico{width:24px;text-align:center}.back{margin-top:18px;border-top:1px solid var(--line);padding-top:14px}
    main{min-width:0}.topbar{height:66px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;border-bottom:1px solid var(--line);background:rgba(6,10,24,.64);backdrop-filter:blur(15px);position:sticky;top:0;z-index:20}.topbar h2{font-family:'Cormorant Garamond',serif;font-size:24px;margin:0;background:linear-gradient(120deg,#fff,var(--lav),var(--gold));-webkit-background-clip:text;color:transparent}.status{font-size:12px;color:var(--muted)}.status.ok{color:var(--green)}.status.warn{color:var(--gold)}
    .content{padding:26px;max-width:1450px;margin:auto}.hero{padding:28px;border:1px solid var(--line);border-radius:24px;background:linear-gradient(135deg,rgba(123,92,255,.13),rgba(244,197,106,.04));box-shadow:var(--shadow)}.hero h3{font-family:'Cormorant Garamond',serif;font-size:34px;margin:0 0 6px}.hero p{max-width:850px;color:var(--muted);line-height:1.65;margin:0}.badge{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(244,197,106,.25);background:rgba(244,197,106,.07);color:#f8d995;border-radius:999px;padding:6px 10px;font-size:11px;font-weight:700;margin-bottom:13px}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:18px}.card{background:rgba(17,26,56,.78);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 36px rgba(0,0,0,.18)}.card h4{margin:0 0 6px;font-size:17px}.card p{margin:0;color:var(--muted);line-height:1.55;font-size:13px}.card .bigico{font-size:28px;margin-bottom:10px}.card-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
    .btn{border:1px solid rgba(123,92,255,.28);background:rgba(123,92,255,.10);color:#fff;border-radius:11px;padding:9px 13px;cursor:pointer;font-size:12px;font-weight:700}.btn:hover{background:rgba(123,92,255,.2)}.btn.primary{border:none;background:linear-gradient(135deg,var(--violet),#5a70ff);box-shadow:0 8px 25px rgba(123,92,255,.25)}.btn.gold{border-color:rgba(244,197,106,.28);background:rgba(244,197,106,.09);color:#ffe6a6}.btn.danger{border-color:rgba(255,113,136,.28);background:rgba(255,113,136,.08);color:#ff9cab}.btn:disabled{opacity:.5;cursor:not-allowed}
    .section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:28px 0 12px}.section-title h3{margin:0;font-size:20px}.section-title p{margin:4px 0 0;color:var(--muted);font-size:12px}
    .workspace{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(360px,.92fr);gap:18px}.panel{background:rgba(17,26,56,.82);border:1px solid var(--line);border-radius:18px;padding:18px}.panel h4{margin:0 0 14px}.field{margin-bottom:13px}.field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:#7f89b7;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;background:rgba(6,10,24,.55);border:1px solid rgba(167,139,250,.2);border-radius:11px;color:#fff;padding:10px 12px;outline:none}.field textarea{min-height:95px;resize:vertical;line-height:1.5}.field input:focus,.field textarea:focus,.field select:focus{border-color:rgba(167,139,250,.55);box-shadow:0 0 0 3px rgba(123,92,255,.08)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row.three{grid-template-columns:1fr 1fr 1fr}.muted{color:var(--muted);font-size:12px}.tiny{font-size:11px;color:#6e789f}.locked{border-color:rgba(244,197,106,.35)!important;background:rgba(244,197,106,.04)!important}.tools-line{display:flex;gap:8px;flex-wrap:wrap}.divider{height:1px;background:var(--line);margin:16px 0}
    .projectbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.projectbar select{max-width:380px;background:rgba(6,10,24,.65);border:1px solid var(--line);color:#fff;padding:9px 12px;border-radius:10px}.save-state{font-size:11px;color:var(--muted)}
    .result{min-height:160px;background:rgba(6,10,24,.5);border:1px solid rgba(167,139,250,.16);border-radius:14px;padding:14px;white-space:pre-wrap;line-height:1.6;color:#eef0ff;overflow:auto}.result.empty{display:grid;place-items:center;color:#606b94}.result-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.result-actions button{border:0;background:transparent;color:#8992b8;cursor:pointer;font-size:12px;padding:3px}.result-actions button:hover{color:#fff}.applybar{margin-top:10px;display:flex;gap:8px;align-items:center}.applybar select{max-width:230px}
    .recent{width:100%;border-collapse:collapse}.recent td,.recent th{padding:10px;border-bottom:1px solid rgba(167,139,250,.08);text-align:left;font-size:12px}.recent th{color:#68739e;text-transform:uppercase;font-size:10px}.kind{font-size:10px;border:1px solid var(--line);padding:4px 7px;border-radius:999px;color:var(--lav)}
    .chapter{border:1px solid rgba(167,139,250,.14);border-radius:14px;padding:12px;margin-bottom:10px;background:rgba(6,10,24,.32)}.chapter-head{display:flex;gap:8px;align-items:center}.chapter-head input{flex:1}.chapter textarea{margin-top:9px;min-height:120px}.chapter.selected{border-color:rgba(244,197,106,.38);box-shadow:inset 0 0 0 1px rgba(244,197,106,.08)}.audio-box{margin-top:10px;padding:10px;border-radius:12px;background:rgba(6,10,24,.45);border:1px solid var(--line)}audio{width:100%;margin-top:7px}
    .checks{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.check{padding:10px;border-radius:11px;background:rgba(6,10,24,.4);border:1px solid var(--line);font-size:12px}.check.ok{border-color:rgba(53,214,154,.26);color:#9bf0d0}.check.bad{border-color:rgba(255,113,136,.26);color:#ffb4c1}.lockline{display:flex;align-items:center;gap:8px;padding:10px;border-radius:12px;background:rgba(244,197,106,.06);border:1px solid rgba(244,197,106,.2);color:#f5d890;font-size:12px}
    .tool-list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tool-pill{padding:11px;border:1px solid var(--line);border-radius:12px;background:rgba(6,10,24,.35);font-size:12px;color:var(--muted)}
    .toast{position:fixed;right:22px;bottom:22px;z-index:99;background:#111a38;color:#fff;border:1px solid var(--line);box-shadow:var(--shadow);padding:11px 14px;border-radius:12px;font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}

    .map-preview{margin-top:14px;border:1px solid var(--line);border-radius:16px;padding:10px;background:rgba(6,10,24,.48);min-height:180px;display:grid;place-items:center;overflow:auto}.map-preview img{max-width:100%;height:auto;border-radius:10px;display:block}.file-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:12px}.file-btn{padding:10px;border:1px solid var(--line);border-radius:11px;background:rgba(123,92,255,.07);color:#fff;cursor:pointer;text-align:center;font-size:12px}.file-btn:hover{background:rgba(123,92,255,.16)}@media(max-width:850px){.file-grid{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:1050px){.grid{grid-template-columns:repeat(2,1fr)}.workspace{grid-template-columns:1fr}.shell{grid-template-columns:220px 1fr}.row.three{grid-template-columns:1fr 1fr}}
    @media(max-width:720px){.shell{display:block}aside{position:relative;width:100%;height:auto}.grid{grid-template-columns:1fr}.content{padding:16px}.topbar{padding:0 16px}.row,.row.three{grid-template-columns:1fr}.tool-list{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="brand"><div class="orb">🧪</div><div><h1>NyXiaLabo</h1><small>Atelier équipe humaine + IA</small></div></div>
    <div class="nav-label">Atelier</div>
    <button class="nav-btn active" data-view="home" onclick="showView('home')"><span class="ico">🏠</span>Vue d'ensemble</button>
    <button class="nav-btn" data-view="ghost" onclick="showView('ghost')"><span class="ico">✍️</span>GhostWriting</button>
    <button class="nav-btn" data-view="audio" onclick="showView('audio')"><span class="ico">🎧</span>Studio Livre Audio</button>
    <button class="nav-btn" data-view="mystery" onclick="showView('mystery')"><span class="ico">🎲</span>Jeux & Expériences</button>
    <button class="nav-btn" data-view="maps" onclick="showView('maps')"><span class="ico">🗺️</span>Cartographie & Mondes</button>
    <button class="nav-btn" data-view="visual" onclick="showView('visual')"><span class="ico">🎨</span>Création visuelle</button>
    <button class="nav-btn" data-view="video" onclick="showView('video')"><span class="ico">🎬</span>Vidéo</button>
    <button class="nav-btn" data-view="models" onclick="showView('models')"><span class="ico">🧪</span>Modèles & API</button>
    <div class="back"><button class="nav-btn" onclick="location.href='/dashboard.html'"><span class="ico">↩</span>Retour au Labo complet</button></div>
  </aside>

  <main>
    <div class="topbar"><h2 id="top-title">Atelier Équipe</h2><div id="health" class="status">Connexion…</div></div>
    <div class="content">
      <section id="view-home" class="view"></section>
      <section id="view-ghost" class="view hidden"></section>
      <section id="view-audio" class="view hidden"></section>
      <section id="view-mystery" class="view hidden"></section>
      <section id="view-maps" class="view hidden"></section>
      <section id="view-visual" class="view hidden"></section>
      <section id="view-video" class="view hidden"></section>
      <section id="view-models" class="view hidden"></section>
    </div>
  </main>
</div>
<div id="toast" class="toast"></div>

<script>
  var token = sessionStorage.getItem('sandbox_token') || ''
  var allProjects = []
  var currentProject = null
  var tools = []
  var aiTools = []
  var currentView = 'home'
  var lastAI = { prompt:'', system:'', toolId:'', text:'', target:'' }
  var saveTimer = null
  var audioUrls = []
  var selectedChapter = 0
  var pendingMysteryProposal = null
  var cartoJob = null
  var cartoPreviewUrl = ''
  var cartoReady = false

  function h(){ return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token } }
  function esc(s){ var d=document.createElement('div'); d.textContent=s==null?'':String(s); return d.innerHTML }
  function toast(msg){ var e=document.getElementById('toast'); e.textContent=msg; e.classList.add('show'); setTimeout(function(){e.classList.remove('show')},1800) }
  function kindLabel(k){ return ({ghostwriting:'GhostWriting',audiobook:'Livre Audio',mystery:'Meurtre & Mystère',visual:'Visuel',video:'Vidéo',api:'Modèles & API'})[k]||k }
  function kindIcon(k){ return ({ghostwriting:'✍️',audiobook:'🎧',mystery:'🎲',visual:'🎨',video:'🎬',api:'🧪'})[k]||'🧪' }

  async function api(url, opts){
    opts=opts||{}; opts.headers=Object.assign({},h(),opts.headers||{})
    var r=await fetch(url,opts); var data=await r.json().catch(function(){return {}})
    if(r.status===401){ sessionStorage.removeItem('sandbox_token'); location.href='/login.html'; throw new Error('Session expirée') }
    if(!r.ok) throw new Error(data.error||('HTTP '+r.status))
    return data
  }

  async function boot(){
    if(!token){ location.href='/login.html'; return }
    try{
      var auth=await fetch('/api/check-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:token})}).then(function(r){return r.json()})
      if(!auth.valid){ location.href='/login.html'; return }
      var data=await Promise.all([api('/api/atelier/health'),api('/api/atelier/projects'),api('/api/tools')])
      var health=data[0]; allProjects=data[1].projects||[]; tools=data[2].tools||[]
      aiTools=tools.filter(function(t){ return t.providerId && t.model && (!t.kind || t.kind==='chat') })
      cartoReady=!!health.cartography; var he=document.getElementById('health'); he.textContent='● Atelier connecté'+(health.googleTts?' · TTS prêt':' · TTS à configurer')+(cartoReady?' · Cartographie prête':' · Cartographie à déployer'); he.className='status '+(health.googleTts&&cartoReady?'ok':'warn')
      renderHome()
    }catch(e){ document.getElementById('health').textContent='⚠ '+e.message; document.getElementById('health').className='status warn'; renderHome() }
  }

  function showView(v){
    currentView=v
    document.querySelectorAll('.view').forEach(function(x){x.classList.add('hidden')})
    document.getElementById('view-'+v).classList.remove('hidden')
    document.querySelectorAll('.nav-btn[data-view]').forEach(function(b){b.classList.toggle('active',b.dataset.view===v)})
    document.getElementById('top-title').textContent=({home:'Atelier Équipe',ghost:'Atelier GhostWriting',audio:'Studio Livre Audio',mystery:'Atelier Jeux & Expériences',maps:'Cartographie & Mondes',visual:'Création visuelle',video:'Vidéo',models:'Modèles & API'})[v]
    if(v==='home')renderHome(); if(v==='ghost')renderGhost(); if(v==='audio')renderAudio(); if(v==='mystery')renderMystery(); if(v==='maps')renderMaps(); if(v==='visual')renderVisual(); if(v==='video')renderVideo(); if(v==='models')renderModels()
  }

  function renderHome(){
    var recent=(allProjects||[]).slice(0,8).map(function(p){return '<tr><td>'+kindIcon(p.kind)+' <span class="kind">'+esc(kindLabel(p.kind))+'</span></td><td><b>'+esc(p.title)+'</b><div class="tiny">'+esc(p.client||'')+'</div></td><td>'+new Date(p.updatedAt).toLocaleDateString('fr-CA')+'</td><td><button class="btn" onclick="openProject(\''+p.id+'\')">Ouvrir</button></td></tr>'}).join('')
    document.getElementById('view-home').innerHTML=''+
      '<div class="hero"><div class="badge">ATELIER INTERNE · ÉQUIPE HUMAINE + IA</div><h3>Créer plus vite sans céder la direction créative.</h3><p>Le Labo reste ton atelier. Les modèles servent à produire, tester, comparer et contrôler. Les faits verrouillés, les décisions éditoriales et la relation client restent entre les mains de l’équipe humaine.</p></div>'+
      '<div class="grid">'+
        homeCard('✍️','GhostWriting','Idée → synopsis → plan → chapitres → cohérence. Les faits verrouillés sont injectés dans chaque demande IA.','ghost','Nouveau livre')+
        homeCard('🎧','Studio Livre Audio','Aperçu gratuit dans le navigateur, puis production réelle avec Google Cloud Text-to-Speech.','audio','Nouveau livre audio')+
        homeCard('🎲','Jeux & Expériences','Bible Maîtresse, Meurtre & Mystère, contrôle de solvabilité, dossiers et variantes.','mystery','Nouveau jeu')+
        homeCard('🗺️','Cartographie & Mondes','Azgaar devient la vérité géographique : seed verrouillée, villes, États, rivières, routes et exports .map / JSON / SVG / PNG.','maps','Créer une carte')+
        homeCard('🎨','Création visuelle','Retrouve les moteurs déjà présents dans le Labo pour couvertures, personnages et scènes.','visual','Ouvrir')+
        homeCard('🎬','Vidéo','Bandes-annonces, teasers, scènes courtes et messages fictifs en réutilisant les outils existants.','video','Ouvrir')+
        homeCard('🧪','Modèles & API','Comparer les modèles, outils API personnalisés, banques et fournisseurs avant intégration portail.','models','Ouvrir')+
      '</div>'+
      '<div class="section-title"><div><h3>Projets récents</h3><p>Stockés dans HUB_CONFIG, donc disponibles à l’équipe sur le Labo.</p></div></div>'+
      '<div class="card">'+(recent?'<table class="recent"><tr><th>Atelier</th><th>Projet</th><th>Modifié</th><th></th></tr>'+recent+'</table>':'<p>Aucun projet Atelier pour l’instant.</p>')+'</div>'
  }
  function homeCard(i,t,p,v,b){return '<div class="card"><div class="bigico">'+i+'</div><h4>'+t+'</h4><p>'+p+'</p><div class="card-actions"><button class="btn primary" onclick="showView(\''+v+'\')">'+b+'</button></div></div>'}

  async function openProject(id){
    try{ var d=await api('/api/atelier/projects/'+id); currentProject=d.project; var v=({ghostwriting:'ghost',audiobook:'audio',mystery:'mystery',visual:'visual',video:'video',api:'models'})[currentProject.kind]||'home'; showView(v) }catch(e){alert(e.message)}
  }

  function projectSelector(kind,onchangeName){
    var list=allProjects.filter(function(p){return p.kind===kind})
    var opts='<option value="">— Choisir un projet —</option>'+list.map(function(p){return '<option value="'+p.id+'"'+(currentProject&&currentProject.id===p.id?' selected':'')+'>'+esc(p.title)+'</option>'}).join('')
    return '<div class="projectbar"><select onchange="'+onchangeName+'(this.value)">'+opts+'</select><button class="btn primary" onclick="newProject(\''+kind+'\')">+ Nouveau</button>'+(currentProject&&currentProject.kind===kind?'<button class="btn" onclick="duplicateCurrent()">Dupliquer</button><button class="btn danger" onclick="deleteCurrent()">Supprimer</button><span id="save-state" class="save-state">Enregistré</span>':'')+'</div>'
  }

  async function chooseProject(kind,id,renderer){ if(!id){currentProject=null;renderer();return} try{currentProject=(await api('/api/atelier/projects/'+id)).project;renderer()}catch(e){alert(e.message)} }
  function chooseGhost(id){chooseProject('ghostwriting',id,renderGhost)}
  function chooseAudio(id){chooseProject('audiobook',id,renderAudio)}
  function chooseMystery(id){chooseProject('mystery',id,renderMystery)}

  async function newProject(kind){
    var defaults={ghostwriting:{idea:'',genre:'',audience:'',tone:'',lockedFacts:'',synopsis:'',outline:'',characters:'',draft:''},audiobook:{author:'',notes:'',voiceName:'',languageCode:'fr-FR',speakingRate:1,pitch:0,chapters:[{title:'Chapitre 1',text:''}]},mystery:{premise:'',playerCount:8,duration:'2 h 30',era:'Contemporain',place:'',theme:'',difficulty:'Intermédiaire',locked:false,murderer:'',motive:'',method:'',timeline:'',secrets:'',relationships:'',trueClues:'',redHerrings:'',solution:'',deliverables:{}}}
    var title=prompt('Titre du projet :','Nouveau '+kindLabel(kind))||('Nouveau '+kindLabel(kind))
    try{var d=await api('/api/atelier/projects',{method:'POST',body:JSON.stringify({kind:kind,title:title,data:defaults[kind]||{}})}); currentProject=d.project; await reloadIndex(); showView(({ghostwriting:'ghost',audiobook:'audio',mystery:'mystery'})[kind]||'home'); toast('Projet créé') }catch(e){alert(e.message)}
  }
  async function reloadIndex(){allProjects=(await api('/api/atelier/projects')).projects||[]}
  async function duplicateCurrent(){if(!currentProject)return; try{var d=await api('/api/atelier/projects/'+currentProject.id+'/duplicate',{method:'POST',body:JSON.stringify({})});currentProject=d.project;await reloadIndex();showView(currentView);toast('Copie créée')}catch(e){alert(e.message)}}
  async function deleteCurrent(){if(!currentProject||!confirm('Supprimer ce projet Atelier ?'))return;try{await api('/api/atelier/projects/'+currentProject.id,{method:'DELETE'});currentProject=null;await reloadIndex();showView(currentView);toast('Projet supprimé')}catch(e){alert(e.message)}}

  function markDirty(){var e=document.getElementById('save-state');if(e)e.textContent='Modification…';clearTimeout(saveTimer);saveTimer=setTimeout(saveCurrent,650)}
  async function saveCurrent(){if(!currentProject)return;try{currentProject=(await api('/api/atelier/projects/'+currentProject.id,{method:'PUT',body:JSON.stringify(currentProject)})).project;await reloadIndex();var e=document.getElementById('save-state');if(e)e.textContent='Enregistré ✓'}catch(err){var e2=document.getElementById('save-state');if(e2)e2.textContent='Erreur sauvegarde';console.error(err)}}
  function setRoot(field,value){if(!currentProject)return;currentProject[field]=value;markDirty()}
  function setData(field,value){if(!currentProject)return;currentProject.data=currentProject.data||{};currentProject.data[field]=value;markDirty()}

  function modelSelector(){var pref=aiTools.find(function(t){return t.category==='livre'})||aiTools[0];var selected=lastAI.toolId|| (pref?pref.id:'');return '<select id="ai-model">'+aiTools.map(function(t){return '<option value="'+t.id+'"'+(t.id===selected?' selected':'')+'>'+esc((t.icon||'🤖')+' '+t.name)+'</option>'}).join('')+'</select>'}

        '<div class="field"><label>Couches Azgaar (séparées par virgules)</label><input id="map-layers" value="'+esc(layers)+'" '+(locked?'disabled':'')+'></div>'+
        '<div class="lockline"><input type="checkbox" id="map-lock" '+(locked?'checked':'')+' onchange="toggleMapLock(this.checked)"> <b>Verrouiller la carte du projet</b> — empêche de changer sa seed par accident.</div>'+
        '<div class="tools-line" style="margin-top:14px"><button class="btn primary" id="map-generate" onclick="generateCartography()" '+(!cartoReady||locked?'disabled':'')+'>🗺️ Générer la carte</button><button class="btn" onclick="openCartoEditor()">✏️ Ouvrir dans Azgaar</button>'+(locked?'<button class="btn gold" onclick="toggleMapLock(false)">🔓 Déverrouiller pour variante</button>':'')+'</div>'+
        '<p class="tiny" style="margin-top:10px">La version exacte `.map` est conservée dans R2. JSON = données du monde; SVG = vectoriel; PNG = prêt à imprimer / illustrer.</p>'+
      '</div><div class="panel"><h4>📦 Résultat</h4><div id="map-result">'+cartoResultHtml(cartoJob)+'</div></div></div>'
    if(cartoJob&&cartoJob.files&&cartoJob.files.png)loadCartoPreview(cartoJob).catch(function(){})
  }
  function newMapSeed(){var e=document.getElementById('map-seed');if(e)e.value=String(Math.floor(100000000+Math.random()*900000000))}
  function cartoPayload(){
    var layers=(document.getElementById('map-layers').value||'').split(',').map(function(x){return x.trim()}).filter(Boolean)
    return {title:document.getElementById('map-title').value.trim()||'Carte NyXia',seed:document.getElementById('map-seed').value.trim(),width:Number(document.getElementById('map-width').value)||1600,height:Number(document.getElementById('map-height').value)||1000,preset:document.getElementById('map-preset').value,layers:layers,outputs:['map','json','svg','png'],projectId:currentProject?currentProject.id:'',projectKind:currentProject?currentProject.kind:''}
  }
  async function generateCartography(){
    if(!cartoReady){alert('Le Worker NyXia Cartographie doit d’abord être déployé et lié au Labo.');return}
    var btn=document.getElementById('map-generate');btn.disabled=true;btn.textContent='⏳ Azgaar construit le monde…';document.getElementById('map-result').innerHTML='<div class="result">Génération de la géographie, fleuves, biomes, États, routes et villes…</div>'
    try{
      var d=await api('/api/atelier/cartography/generate',{method:'POST',body:JSON.stringify(cartoPayload())});cartoJob=d.job
      if(currentProject){currentProject.data=currentProject.data||{};currentProject.data.cartography=Object.assign({},cartoJob,{locked:false});markDirty()}
      renderMaps();toast('Carte Azgaar générée et conservée dans R2')
    }catch(e){document.getElementById('map-result').innerHTML='<div class="result">⚠ '+esc(e.message)+'</div>';btn.disabled=false;btn.textContent='🗺️ Générer la carte'}
  }
  function cartoResultHtml(job){
    if(!job)return '<div class="result empty">Aucune carte générée pour l’instant.</div>'
    if(job.status==='failed')return '<div class="result">⚠ '+esc(job.error||'Génération échouée')+'</div>'
    var files=job.files||{}, buttons=['map','json','svg','png'].filter(function(k){return files[k]}).map(function(k){return '<button class="file-btn" onclick="downloadCartoFile(\''+k+'\')">⬇ '+k.toUpperCase()+'</button>'}).join('')
    return '<div class="result"><b>'+esc(job.title||'Carte NyXia')+'</b>\nSeed : '+esc(job.seed)+'\nMoteur : '+esc(job.engine||'Azgaar')+' '+esc(job.engineVersion||'')+'\nDimensions : '+esc(job.width)+' × '+esc(job.height)+'\nCouches : '+esc((job.layers||[]).join(', '))+'</div><div class="file-grid">'+buttons+'</div><div class="map-preview" id="map-preview"><span class="muted">Chargement de l’aperçu PNG…</span></div>'
  }
  async function loadCartoPreview(job){
    if(!job||!job.files||!job.files.png)return
    var r=await fetch('/api/atelier/cartography'+job.files.png.path,{headers:h()});if(!r.ok)return
    var b=await r.blob();if(cartoPreviewUrl)URL.revokeObjectURL(cartoPreviewUrl);cartoPreviewUrl=URL.createObjectURL(b)
    var host=document.getElementById('map-preview');if(host)host.innerHTML='<img src="'+cartoPreviewUrl+'" alt="Aperçu de la carte Azgaar">'
  }
  async function downloadCartoFile(kind){
    var job=cartoJob||mapSaved();if(!job||!job.files||!job.files[kind])return
    try{var f=job.files[kind],r=await fetch('/api/atelier/cartography'+f.path,{headers:h()});if(!r.ok)throw new Error('Téléchargement impossible');var b=await r.blob(),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=f.name||('carte.'+kind);document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},2000)}catch(e){alert(e.message)}
  }
  function openCartoEditor(){
    var job=cartoJob||mapSaved(),url=job&&job.editorUrl?job.editorUrl:'https://maps.nyxia.top/'
    if(!job){var seed=(document.getElementById('map-seed')||{}).value||'';if(seed)url+='?seed='+encodeURIComponent(seed)+'&options=default'}
    window.open(url,'_blank','noopener')
  }
  function toggleMapLock(v){
    if(!currentProject){toast('Choisis un projet pour verrouiller sa carte');return}
    currentProject.data=currentProject.data||{};currentProject.data.cartography=currentProject.data.cartography||cartoJob||{}
    currentProject.data.cartography.locked=!!v;cartoJob=currentProject.data.cartography;markDirty();renderMaps();toast(v?'Carte verrouillée':'Carte déverrouillée')
  }

  function renderVisual(){var cats=['image','banque-gratuite'];var list=tools.filter(function(t){return cats.indexOf(t.category)>=0||t.kind==='image'||t.kind==='image-async'});document.getElementById('view-visual').innerHTML='<div class="hero"><div class="badge">RÉUTILISE L’EXISTANT</div><h3>Création visuelle</h3><p>Pas de second moteur : couvertures, personnages, scènes, cartes, faux documents et matériel promo passent par les outils déjà présents dans le Labo.</p><div class="card-actions"><button class="btn primary" onclick="location.href=\'/dashboard.html\'">Ouvrir le Labo complet</button></div></div><div class="section-title"><div><h3>Outils visuels détectés</h3></div></div><div class="tool-list">'+list.map(toolPill).join('')+'</div>'}
  function renderVideo(){var list=tools.filter(function(t){return t.category==='video'||String(t.kind||'').indexOf('video')>=0});document.getElementById('view-video').innerHTML='<div class="hero"><div class="badge">BANDES-ANNONCES · TEASERS · SCÈNES</div><h3>Vidéo</h3><p>Les moteurs vidéo du Labo restent la source unique. L’Atelier les utilise pour les livres, les jeux et les campagnes sans dupliquer leur configuration.</p><div class="card-actions"><button class="btn primary" onclick="location.href=\'/dashboard.html\'">Ouvrir les outils vidéo</button><button class="btn" onclick="location.href=\'/wan-video.html\'">Wan vidéo</button></div></div><div class="section-title"><div><h3>Outils vidéo détectés</h3></div></div><div class="tool-list">'+list.map(toolPill).join('')+'</div>'}
  function renderModels(){var list=tools.filter(function(t){return t.kind==='custom-api'||['conversation','utilites','transcription','banque-gratuite'].indexOf(t.category)>=0});document.getElementById('view-models').innerHTML='<div class="hero"><div class="badge">BAC À SABLE DE DIANE</div><h3>Modèles & API</h3><p>Tester de nouveaux modèles, comparer les fournisseurs et conserver l’ajout d’API personnalisées par cURL dans le Labo existant.</p><div class="card-actions"><button class="btn primary" onclick="location.href=\'/dashboard.html\'">Ouvrir Modèles & API</button></div></div><div class="section-title"><div><h3>Outils utiles détectés</h3></div></div><div class="tool-list">'+list.map(toolPill).join('')+'</div>'}
  function toolPill(t){return '<div class="tool-pill">'+esc((t.icon||'⚙️')+' '+t.name)+'<div class="tiny">'+esc(t.category||t.kind||'')+'</div></div>'}

  async function runAI(system,prompt,target){
    var sel=document.getElementById('ai-model'),tool=aiTools.find(function(t){return t.id===(sel?sel.value:lastAI.toolId)})||aiTools[0];if(!tool){alert('Aucun modèle de chat disponible.');return}
    lastAI={system:system,prompt:prompt,target:target||'',toolId:tool.id,text:''};renderAIResult('… production en cours …',true)
    try{var d=await api('/api/chat',{method:'POST',body:JSON.stringify({providerId:tool.providerId,model:tool.model,system_prompt:(tool.system_prompt?tool.system_prompt+'\n\n':'')+system,max_tokens:Math.max(Number(tool.max_tokens)||2500,5000),temperature:(tool.temperature == null ? 0.7 : tool.temperature),messages:[{role:'user',content:prompt}]})});lastAI.text=d.text||'(réponse vide)';renderAIResult(lastAI.text,false)}catch(e){lastAI.text='⚠ '+e.message;renderAIResult(lastAI.text,false)}
  }
  function renderAIResult(text,busy){var box=document.getElementById('ai-result');if(!box)return;box.className='result';box.textContent=text;var actions=document.getElementById('ai-actions');if(!actions)return;actions.innerHTML=busy?'':'<div class="result-actions"><button onclick="speakAI()">🔊 Écouter</button><button onclick="copyAI()">📋 Copier</button><button onclick="retryAI()">↺ Réessayer</button><button onclick="pdfAI()">⬇ PDF</button></div>'+applyBar()}
  function applyBar(){if(!lastAI.target)return '';if(lastAI.target==='__mystery_json__')return '<div class="applybar"><button class="btn gold" onclick="applyMysteryProposal()">Appliquer cette Bible proposée</button></div>';if(lastAI.target.indexOf('deliverable:')===0)return '<div class="applybar"><button class="btn gold" onclick="saveDeliverable(\''+lastAI.target.split(':')[1]+'\')">Conserver dans le projet</button></div>';return '<div class="applybar"><span class="tiny">Aucune modification automatique.</span><button class="btn gold" onclick="applyAITo(\''+lastAI.target+'\')">Utiliser cette proposition</button></div>'}
  function speakAI(){speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(lastAI.text);u.lang='fr-FR';u.rate=.95;speechSynthesis.speak(u)}
  async function copyAI(){await navigator.clipboard.writeText(lastAI.text);toast('Copié')}
  function retryAI(){if(lastAI.prompt)runAI(lastAI.system,lastAI.prompt,lastAI.target)}
  function pdfAI(){if(!window.jspdf)return;var doc=new window.jspdf.jsPDF(),y=20,lines=doc.splitTextToSize(lastAI.text,175);doc.setFontSize(15);doc.text(currentProject?currentProject.title:'NyXiaLabo',18,y);y+=10;doc.setFontSize(11);lines.forEach(function(l){if(y>280){doc.addPage();y=20}doc.text(l,18,y);y+=6});doc.save(safeName(currentProject?currentProject.title:'nyxialabo')+'-'+Date.now()+'.pdf')}
  function applyAITo(field){if(!currentProject||!field)return;if(!confirm('Remplacer le contenu du champ « '+field+' » par cette proposition ?'))return;setData(field,lastAI.text);if(currentView==='ghost')renderGhost();toast('Proposition appliquée')}
  function parseJsonLoose(txt){var t=String(txt||'').trim().replace(/^```json\s*/i,'').replace(/```$/,'').trim();return JSON.parse(t)}
  function applyMysteryProposal(){try{var obj=parseJsonLoose(lastAI.text),keys=['murderer','motive','method','timeline','secrets','relationships','trueClues','redHerrings','solution'];keys.forEach(function(k){if(obj[k]!=null)currentProject.data[k]=String(obj[k])});markDirty();renderMystery();toast('Bible appliquée — tu peux maintenant la verrouiller')}catch(e){alert('La réponse n’est pas un JSON exploitable. Copie-la ou réessaie avec le bouton ↺.') }}
  function saveDeliverable(type){currentProject.data.deliverables=currentProject.data.deliverables||{};currentProject.data.deliverables[type]=lastAI.text;markDirty();toast('Livrable conservé dans le projet')}

  window.addEventListener('beforeunload',function(){audioUrls.forEach(function(u){try{URL.revokeObjectURL(u)}catch(e){}});if(cartoPreviewUrl)try{URL.revokeObjectURL(cartoPreviewUrl)}catch(e){}})
  boot()
</script>
</body>
